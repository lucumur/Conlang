name: Refine lexicon corrections

on:
  push:
    paths:
      - '.github/workflows/lexicon-audit-fixes.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore distinct roots and re-audit forms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, unicodedata

          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')

          # La pasada anterior aplicó dos correcciones por glosa de forma demasiado amplia.
          # Restaurar las raíces distintas que compartían glosa, conservando las correcciones
          # destinadas a NOR-O -> NORΘ y LEO -> LEΘ.
          pat_n=re.compile(r'(<td class="form"><code>)\*NORΘ-(</code></td><td class="gloss">norte</td><td class="tags">[^<]*(?:<span[^>]*>[^<]*</span>)*?<span class="tag griego">Griego</span>.*?</td>)',re.S)
          s,n1=pat_n.subn(r'\1*BOR-\2',s,count=1)

          pat_l=re.compile(r'(<td class="form"><code>)\*LEΘ-(</code></td><td class="gloss">cuero</td><td class="tags"><span class="tag generic">Raiz</span></td>)',re.S)
          s,n2=pat_l.subn(r'\1*ĈER-\2',s,count=1)

          if n1!=1: raise SystemExit(f'No se pudo restaurar BOR-: {n1}')
          if n2!=1: raise SystemExit(f'No se pudo restaurar ĈER-: {n2}')

          # Auditoría completa de las formas.
          forms=re.findall(r'<td class="form"><code>(.*?)</code></td>',s,re.S)
          forms=[html.unescape(re.sub(r'<[^>]+>','',f)).strip() for f in forms]
          bad=[f for f in forms if not f.startswith('*') or '-' not in f]
          if bad: raise SystemExit('Formas sin * o sin guion: '+repr(bad[:30]))

          allowed={'Ĉ','Ĝ','Ŝ','Ẑ','ĉ','ĝ','ŝ','ẑ'}
          forbidden=[]
          for f in forms:
              for ch in f:
                  if ch in allowed or ch in {'Θ','θ'}: continue
                  d=unicodedata.normalize('NFD',ch)
                  if len(d)>1 and any(unicodedata.category(c)=='Mn' for c in d[1:]):
                      forbidden.append((f,ch))
          if forbidden: raise SystemExit('Diacríticos no permitidos: '+repr(forbidden[:30]))

          # Debe quedar una sola entrada de cada corrección nueva para estas dos glosas.
          if s.count('<code>*NORΘ-</code></td><td class="gloss">norte</td>')!=1:
              raise SystemExit('NORΘ- norte no quedó único')
          if s.count('<code>*LEΘ-</code></td><td class="gloss">cuero</td>')!=1:
              raise SystemExit('LEΘ- cuero no quedó único')

          p.write_text(s,encoding='utf-8')
          print('Formas auditadas:',len(forms))
          print('Restauradas: *BOR- = norte; *ĈER- = cuero')
          PY
      - name: Commit refined lexicon
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Afinar correcciones léxicas y preservar raíces distintas" || exit 0
          git push
