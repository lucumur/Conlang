name: Audit and correct lexicon forms

on:
  push:
    paths:
      - '.github/workflows/lexicon-audit-fixes.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit forms and apply canonical corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, unicodedata
          from collections import OrderedDict

          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')

          def plain(x):
              return html.unescape(re.sub(r'<[^>]+>', '', x)).strip()

          def norm_text(x):
              x = plain(x).lower().strip()
              return ''.join(c for c in unicodedata.normalize('NFD', x) if unicodedata.category(c) != 'Mn')

          # Solo estas cuatro consonantes con diacrítico forman parte de la ortografía del conlang.
          allowed = {'Ĉ','Ĝ','Ŝ','Ẑ','ĉ','ĝ','ŝ','ẑ'}
          def normalize_form_chars(form):
              out=[]
              for ch in form:
                  if ch in allowed or ch in {'Θ','θ'}:
                      out.append(ch)
                      continue
                  decomp=unicodedata.normalize('NFD', ch)
                  if len(decomp)>1 and any(unicodedata.category(c)=='Mn' for c in decomp[1:]):
                      out.append(decomp[0])
                  else:
                      out.append(ch)
              return ''.join(out)

          # Extraer todas las filas léxicas, independientemente de la sección actual.
          row_re = re.compile(
              r'<tr><td class="form"><code>(.*?)</code></td><td class="gloss">(.*?)</td><td class="tags">(.*?)</td></tr>',
              re.S
          )
          rows=[]
          for m in row_re.finditer(s):
              form_html, gloss_html, tags_html = m.groups()
              form = plain(form_html)
              gloss = plain(gloss_html)
              rows.append({'form':form,'gloss':gloss,'gloss_html':gloss_html,'tags_html':tags_html})

          if not rows:
              raise SystemExit('No se encontraron entradas léxicas')

          # Correcciones explícitas del usuario, identificadas por glosa.
          exact_by_gloss = {
              'hades': '*CAD-',
              'detener': '*CAL-T',
              'camaleon': '*CAME-',
              'caos': '*CAO-',
              'fuera': '*EL-',
              'costumbre': '*EΘ-',
              'eter': '*EΘ-R',
              'grava': '*GRU-',
              'cuero': '*LEΘ-',
              'mito, cuento': '*MIΘ-',
              'norte': '*NORΘ-',
              'desnudo': '*NUΘ-',
              'recto': '*ORΘ-',
              'padecer, sentir': '*PAΘ-',
          }

          changed=[]
          deleted=[]
          corrected=[]
          for e in rows:
              old=e['form']
              core = old.strip().lstrip('*').strip('-').strip().upper()
              # EO queda descartado según "EO (x)".
              if core == 'EO':
                  deleted.append((old,e['gloss']))
                  e['delete']=True
                  continue

              ng=norm_text(e['gloss'])
              if ng in exact_by_gloss:
                  e['form']=exact_by_gloss[ng]
                  corrected.append((old,e['form'],e['gloss']))

              # Normalización ortográfica solo de la FORMA, no de la glosa española.
              e['form']=normalize_form_chars(e['form'])

              # Toda forma debe contener asterisco y al menos un guion.
              if not e['form'].startswith('*'):
                  e['form']='*'+e['form'].lstrip('*')
              if '-' not in e['form']:
                  e['form']=e['form']+'-'

              if e['form'] != old and not any(c[0]==old and c[1]==e['form'] for c in corrected):
                  changed.append((old,e['form'],e['gloss']))

          rows=[e for e in rows if not e.get('delete')]

          # Auditoría final de formato.
          bad=[e for e in rows if not e['form'].startswith('*') or '-' not in e['form']]
          if bad:
              raise SystemExit('Persisten formas sin * o sin guion: '+repr([(e['form'],e['gloss']) for e in bad[:20]]))

          # Verificar que no queden letras diacríticas fuera del inventario permitido en las FORMAS.
          forbidden=[]
          for e in rows:
              for ch in e['form']:
                  if ch in allowed or ch in {'Θ','θ'}:
                      continue
                  d=unicodedata.normalize('NFD',ch)
                  if len(d)>1 and any(unicodedata.category(c)=='Mn' for c in d[1:]):
                      forbidden.append((e['form'],ch,e['gloss']))
          if forbidden:
              raise SystemExit('Persisten diacríticos no permitidos: '+repr(forbidden[:20]))

          # Reagrupar por letra inicial real para que C/Ĉ, G/Ĝ, S/Ŝ y Z/Ẑ sean secciones distintas.
          order=['A','B','C','Ĉ','D','E','F','G','Ĝ','I','J','K','L','M','N','O','P','R','S','Ŝ','T','Θ','U','V','Z','Ẑ']
          groups=OrderedDict((k,[]) for k in order)

          def initial(form):
              x=form.lstrip('*-')
              return x[0].upper() if x else '?'

          extras=[]
          for e in rows:
              k=initial(e['form'])
              if k in groups:
                  groups[k].append(e)
              else:
                  extras.append((k,e['form'],e['gloss']))
          if extras:
              raise SystemExit('Formas con inicial fuera del índice: '+repr(extras[:30]))

          def esc(x): return html.escape(x, quote=False)
          nav=[]; sections=[]; idx=1
          for letter, entries in groups.items():
              if not entries:
                  continue
              sid='sec-'+('circ-c' if letter=='Ĉ' else 'circ-g' if letter=='Ĝ' else 'circ-s' if letter=='Ŝ' else 'circ-z' if letter=='Ẑ' else re.sub(r'[^A-Za-z0-9]+','-',letter).strip('-').lower() or str(idx))
              nav.append(f'<a href="#{sid}">{letter}</a>')
              body=[]
              for e in entries:
                  body.append('<tr><td class="form"><code>'+esc(e['form'])+'</code></td><td class="gloss">'+e['gloss_html']+'</td><td class="tags">'+e['tags_html']+'</td></tr>')
              sections.append(
                  f'<section class="lex-section" id="{sid}">\n'
                  f'  <h2>{letter}</h2>\n'
                  '  <div class="table-wrap">\n'
                  '    <table class="lex-table">\n'
                  '      <thead><tr><th>Forma</th><th>Glosa</th><th>Etiquetas</th></tr></thead>\n'
                  '      <tbody>'+''.join(body)+'</tbody>\n'
                  '    </table>\n'
                  '  </div>\n'
                  '</section>'
              )
              idx+=1

          # Sustituir índice y todas las secciones léxicas; conservar buscador, cabecera, footer y JS.
          nav_re=re.compile(r'<nav class="alphabet" aria-label="Índice alfabético">.*?</nav>',re.S)
          s,n=nav_re.subn('<nav class="alphabet" aria-label="Índice alfabético">'+''.join(nav)+'</nav>',s,count=1)
          if n!=1:
              raise SystemExit('No se pudo reemplazar el índice alfabético')

          sec_start=s.find('<section class="lex-section"')
          main_end=s.find('</main>',sec_start)
          if sec_start<0 or main_end<0:
              raise SystemExit('No se encontró el bloque de secciones léxicas')
          s=s[:sec_start]+'\n'.join(sections)+'\n'+s[main_end:]

          # Validaciones de las correcciones explícitas.
          checks=['*CAD-','*CAL-T','*CAME-','*CAO-','*EL-','*EΘ-','*EΘ-R','*GRU-','*LEΘ-','*MIΘ-','*NORΘ-','*NUΘ-','*ORΘ-','*PAΘ-']
          for f in checks:
              if f'<code>{f}</code>' not in s:
                  raise SystemExit(f'No quedó aplicada la forma {f}')
          if re.search(r'<code>\*?EO-?</code>',s):
              raise SystemExit('EO debía quedar eliminado')

          p.write_text(s,encoding='utf-8')
          print('Entradas finales:',len(rows))
          print('Correcciones explícitas:',len(corrected))
          for x in corrected: print('EXPLICITA',x)
          print('Otras normalizaciones de formato/diacríticos:',len(changed))
          for x in changed: print('NORMALIZA',x)
          print('Eliminadas:',deleted)
          PY
      - name: Commit corrected lexicon
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Auditar formas y aplicar correcciones léxicas" || exit 0
          git push
