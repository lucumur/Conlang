name: Migrate ABL lexicon to EBL
on:
  push:
    paths:
      - '.github/workflows/migrate-abl-to-ebl.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update EBL derivatives and references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ep = Path('lexico/e.json')
          data = json.loads(ep.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-ebl')
          updates = {
              'lexeme-ables': {
                  'id': 'lexeme-ebles', 'form': 'ebles',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-es">-ES</a>',
                  'analysis_text': 'EBL + -ES'
              },
              'lexeme-ablitas': {
                  'id': 'lexeme-eblitas', 'form': 'eblitas',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-it">-IT-</a> + <a class="morph-link" href="#morph-as">-AS</a>',
                  'analysis_text': 'EBL + -IT- + -AS'
              },
              'lexeme-ableza': {
                  'id': 'lexeme-eblezha', 'form': 'ebleẑa',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-zha">-ẐA</a>',
                  'analysis_text': 'EBL + -ẐA'
              },
              'lexeme-ablin': {
                  'id': 'lexeme-eblin', 'form': 'eblin',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-in">-IN</a>',
                  'analysis_text': 'EBL + -IN'
              },
              'lexeme-malablin': {
                  'id': 'lexeme-maleblin', 'form': 'maleblin',
                  'analysis_html': 'MAL + EBL + <a class="morph-link" href="#morph-in">-IN</a>',
                  'analysis_text': 'MAL + EBL + -IN'
              },
          }
          seen = set()
          for w in root.get('words', []):
              old = w.get('id')
              if old in updates:
                  w.update(updates[old])
                  seen.add(old)
          missing = set(updates) - seen
          if missing:
              raise SystemExit(f'Missing expected EBL derivatives: {sorted(missing)}')
          ep.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mp = Path('lexico/morphemes.json')
          mtxt = mp.read_text(encoding='utf-8')
          mtxt2 = mtxt.replace('atestiguado en ablitas y agitas', 'atestiguado en eblitas y agitas')
          if mtxt2 == mtxt:
              raise SystemExit('Expected ablitas reference not found in morphemes.json')
          mp.write_text(mtxt2, encoding='utf-8')

          gp = Path('gramatica.html')
          gtxt = gp.read_text(encoding='utf-8')
          old = '<code>ables</code> «ser capaz, tener capacidad» → <code>ableẑa</code> «capacidad, habilidad»'
          new = '<code>ebles</code> «ser capaz, tener capacidad» → <code>ebleẑa</code> «capacidad, habilidad»'
          if old not in gtxt:
              raise SystemExit('Expected ABL grammar example not found')
          gp.write_text(gtxt.replace(old, new), encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/e.json lexico/morphemes.json lexico/index.json gramatica.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Migrar derivados de ABL a EBL"
          git push
