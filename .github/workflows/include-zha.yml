name: Include ZHA abstract nominalizer

on:
  push:
    paths:
      - '.github/workflows/include-zha.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update grammar and lexicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # --- gramatica.html ---
          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          if '<code>-ẐA</code>' not in g:
              old = '''    <tr><td><code>-AL</code></td><td>género locativo</td></tr>\n    <tr><td><code>-E</code></td><td>incontables</td></tr>\n  </tbody></table></div>\n</section>'''
              new = '''    <tr><td><code>-AL</code></td><td>género locativo</td></tr>\n    <tr><td><code>-E</code></td><td>incontables</td></tr>\n  </tbody></table></div>\n  <h3>4.1. Nominalización abstracta</h3>\n  <p><span class="status canon">Canónico</span><code>-ẐA</code> es un derivador productivo que forma nombres abstractos, especialmente cualidades, capacidades y estados.</p>\n  <p><span class="status canon">Canónico</span>Ejemplo: <code>ables</code> «ser capaz, tener capacidad» → <code>ableẑa</code> «capacidad, habilidad».</p>\n  <p class="source-note">El léxico también documenta <code>-URA</code> con valor de cualidad abstracta. La distribución semántica exacta entre <code>-ẐA</code> y <code>-URA</code> queda abierta hasta que se defina explícitamente.</p>\n</section>'''
              if old not in g:
                  raise SystemExit('No se encontró el cierre esperado de la sección 4 de gramática')
              g = g.replace(old, new, 1)
              gp.write_text(g, encoding='utf-8')

          # --- lexico.html ---
          lp = Path('lexico.html')
          s = lp.read_text(encoding='utf-8')

          old_abl = '<tr><td class="form"><code>*ABL-</code></td><td class="gloss">ser capaz</td><td class="tags"><span class="tag generic">Raiz</span></td></tr>'
          new_abl = '<tr><td class="form"><code>*ABL-</code></td><td class="gloss">ser capaz</td><td class="tags"><span class="tag generic">Raiz</span><span class="tag latin">Latin</span></td></tr>'
          if old_abl in s:
              s = s.replace(old_abl, new_abl, 1)

          if '<code>*-ẐA</code>' not in s:
              sec = '<section class="lex-section" id="sec-circ-z">'
              i = s.find(sec)
              if i < 0:
                  raise SystemExit('No se encontró la sección Ẑ del léxico')
              j = s.find('<tbody>', i)
              if j < 0:
                  raise SystemExit('No se encontró tbody en la sección Ẑ')
              insert = '<tbody><tr><td class="form"><code>*-ẐA</code></td><td class="gloss">nominalizador abstracto; cualidad, capacidad o estado</td><td class="tags"><span class="tag generic">sufijo</span></td></tr>'
              s = s[:j] + insert + s[j+len('<tbody>'):]

          lp.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gramatica.html lexico.html
          git commit -m "Canonizar -ẐA como nominalizador abstracto"
          git push
