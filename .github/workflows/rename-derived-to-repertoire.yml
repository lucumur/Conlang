name: Rename derived label to repertoire
on:
  push:
    paths:
      - '.github/workflows/rename-derived-to-repertoire.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lexicon labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')
          old = '<summary>${words.length} palabras derivadas</summary>'
          new = '<summary>Repertorio (${words.length})</summary>'
          if old not in s:
              raise SystemExit('No se encontró la etiqueta esperada de palabras derivadas')
          s = s.replace(old, new)
          s = s.replace('Inventario de raíces, palabras derivadas, morfemas, etimologías y etiquetas.', 'Inventario de raíces, repertorios, morfemas, etimologías y etiquetas.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Renombrar palabras derivadas como repertorio"
          git push
