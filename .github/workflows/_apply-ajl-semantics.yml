name: Apply AJL semantic fields
on:
  push:
    paths:
      - '.github/workflows/_apply-ajl-semantics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply semantic fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lexico/a.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-ajl')
          fields = {
              'lexeme-ajlo': ['alimentación', 'vegetales', 'condimentos'],
              'lexeme-ajlinto': ['alimentación', 'vegetales', 'partes'],
              'lexeme-ajloka': ['salud', 'boca', 'olor'],
          }
          for word in root.get('words', []):
              if word.get('id') in fields:
                  word['semantic_fields'] = fields[word['id']]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_apply-ajl-semantics.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Añadir campos semánticos a AJL"
          git push
