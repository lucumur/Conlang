name: Fix CO and ID once
on:
  push:
    paths:
      - '.github/workflows/_fix-co-id-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Correct CO and ID documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(p):
              return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p, data):
              Path(p).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # CO-T remains the original root; remove mistakenly created independent CO root.
          c = load('lexico/c.json')
          c['entries'] = [e for e in c['entries'] if e.get('id') != 'root-co']
          cot = next(e for e in c['entries'] if e.get('id') == 'root-co-t')
          notes = cot.setdefault('notes', [])
          note = 'CO- es un derivado desprendible de *CO-T; la T final es desprendible.'
          if note not in notes:
              notes.append(note)
          save('lexico/c.json', c)

          # Canonical derived prefix CO- and revised ID morpheme.
          m = load('lexico/morphemes.json')
          mid = next(x for x in m['morphemes'] if x.get('id') == 'morph-id')
          mid['gloss'] = 'subclase, diminutivo'
          co = next((x for x in m['morphemes'] if x.get('id') == 'morph-co-high'), None)
          if co is None:
              co = {
                  'id': 'morph-co-high',
                  'form': '*CO-',
                  'gloss': 'alto, sacro',
                  'tags': [{'class': 'generic', 'label': 'prefijo'}],
                  'letter': 'C',
                  'section': 'sec-c',
                  'etymology': None,
                  'notes': ['Derivado desprendible de *CO-T; la T final de la raíz original es desprendible.'],
                  'row_class': ''
              }
              m['morphemes'].append(co)
          else:
              co['gloss'] = 'alto, sacro'
              co['notes'] = ['Derivado desprendible de *CO-T; la T final de la raíz original es desprendible.']
          save('lexico/morphemes.json', m)

          # Replace provisional analyses in ALM family.
          a = load('lexico/a.json')
          alm = next(e for e in a['entries'] if e.get('id') == 'root-alm')
          byid = {w['id']: w for w in alm.get('words', [])}

          w = byid['lexeme-coalma']
          w['analysis_html'] = '<a class="morph-link" href="#morph-co-high">CO-</a> + ALM + <a class="morph-link" href="#morph-a-2">-A</a>'
          w['analysis_text'] = 'CO- + ALM + -A'
          w['refs'] = [{'id':'morph-co-high','label':'CO-'},{'id':'morph-a-2','label':'-A'}]

          w = byid['lexeme-nujalmida']
          w['analysis_html'] = '<a class="morph-link" href="#root-nu-j">NU-J</a> + ALM + <a class="morph-link" href="#morph-id">-ID-</a> + <a class="morph-link" href="#morph-a-2">-A</a>'
          w['analysis_text'] = 'NU-J + ALM + -ID- + -A'
          w['refs'] = [{'id':'root-nu-j','label':'NU-J'},{'id':'morph-id','label':'-ID-'},{'id':'morph-a-2','label':'-A'}]

          w = byid['lexeme-almidaj']
          w['analysis_html'] = 'ALM + <a class="morph-link" href="#morph-id">-ID-</a> + <a class="morph-link" href="#morph-aj">-AJ</a>'
          w['analysis_text'] = 'ALM + -ID- + -AJ'
          w['refs'] = [{'id':'morph-id','label':'-ID-'},{'id':'morph-aj','label':'-AJ'}]
          save('lexico/a.json', a)
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_fix-co-id-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexico/a.json lexico/c.json lexico/morphemes.json lexico/index.json .github/workflows/_fix-co-id-once.yml
          git commit -m 'Corregir relación CO-T, CO- e ID' || exit 0
          git push
