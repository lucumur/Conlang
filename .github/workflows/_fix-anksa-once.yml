name: Fix ANKSA once
on:
  push:
    paths:
      - '.github/workflows/_fix-anksa-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ANKSA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('lexico/a.json')
          data=json.loads(p.read_text())
          root=next(e for e in data['entries'] if e.get('id')=='root-anks')
          w=next(w for w in root['words'] if w.get('id')=='lexeme-anka')
          w['id']='lexeme-anksa'
          w['form']='anksa'
          w['analysis_html']='ANKS + <a class="morph-link" href="#morph-a-2">-A</a>'
          w['analysis_text']='ANKS + -A'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_fix-anksa-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json .github/workflows/_fix-anksa-once.yml
          git commit -m "Corregir anksa con raíz íntegra ANKS-"
          git push