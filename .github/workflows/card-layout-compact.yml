name: Compact lexicon cards
on:
  push:
    paths:
      - '.github/workflows/card-layout-compact.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact card layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')

          old_css='''.lex-card-view .lex-table thead{display:none}.lex-card-view .lex-table{display:block;width:100%;border:0;background:transparent}.lex-card-view .lex-table tbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;width:100%}.lex-card-view .lex-table tbody tr{display:block;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px}.lex-card-view .lex-table tbody td{display:block;border:0;padding:4px 0}.lex-card-view .lex-table tbody td::before{display:block;margin-bottom:2px;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.lex-card-view .lex-table tbody td.form::before{content:"Forma"}.lex-card-view .lex-table tbody td.gloss::before{content:"Glosa"}.lex-card-view .lex-table tbody td.tags::before{content:"Etiquetas"}.lex-card-view .table-wrap{overflow:visible}'''
          new_css='''.lex-card-view .lex-table thead{display:none}.lex-card-view .lex-table{display:block;width:100%;border:0;background:transparent}.lex-card-view .lex-table tbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;width:100%}.lex-card-view .lex-table tbody tr{display:block;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 12px}.lex-card-view .lex-table tbody td{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:10px;align-items:start;border:0;padding:5px 0}.lex-card-view .lex-table tbody td::before{grid-column:1;display:block;margin:2px 0 0;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.lex-card-view .lex-table tbody td>.cell-value{grid-column:2;min-width:0}.lex-card-view .lex-table tbody td.tags>.cell-value{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px}.lex-card-view .lex-table tbody td.form::before{content:"Forma"}.lex-card-view .lex-table tbody td.gloss::before{content:"Glosa"}.lex-card-view .lex-table tbody td.tags::before{content:"Etiquetas"}.lex-card-view .table-wrap{overflow:visible}'''
          if old_css not in s:
              raise SystemExit('No se encontró el bloque CSS esperado')
          s=s.replace(old_css,new_css,1)

          old_entry='''return`<tr class="${esc(e.row_class||'')}" data-entry-id="${esc(e.id)}"><td class="form"><code id="${esc(e.id)}">${esc(e.form)}</code></td><td class="gloss"><span class="root-gloss">${esc(e.gloss)}</span>${et}${notes}${rep}${derived}</td><td class="tags">${tagHTML(e.tags)}</td></tr>`'''
          new_entry='''return`<tr class="${esc(e.row_class||'')}" data-entry-id="${esc(e.id)}"><td class="form"><div class="cell-value"><code id="${esc(e.id)}">${esc(e.form)}</code></div></td><td class="gloss"><div class="cell-value"><span class="root-gloss">${esc(e.gloss)}</span>${et}${notes}${rep}${derived}</div></td><td class="tags"><div class="cell-value">${tagHTML(e.tags)}</div></td></tr>`'''
          if old_entry not in s:
              raise SystemExit('No se encontró entryRow esperado')
          s=s.replace(old_entry,new_entry,1)

          old_morph='''return`<tr><td class="form"><code id="${esc(m.id)}">${esc(m.form)}</code></td><td class="gloss">${esc(m.gloss)}${repertoireHTML(m.id,idx)}</td><td class="tags">${tagHTML(m.tags)}</td></tr>`'''
          new_morph='''return`<tr><td class="form"><div class="cell-value"><code id="${esc(m.id)}">${esc(m.form)}</code></div></td><td class="gloss"><div class="cell-value">${esc(m.gloss)}${repertoireHTML(m.id,idx)}</div></td><td class="tags"><div class="cell-value">${tagHTML(m.tags)}</div></td></tr>`'''
          if old_morph not in s:
              raise SystemExit('No se encontró morphemeRow esperado')
          s=s.replace(old_morph,new_morph,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Compactar tarjetas del léxico"
          git push
