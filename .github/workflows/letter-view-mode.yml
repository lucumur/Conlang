name: Lexicon letter view mode
on:
  push:
    paths:
      - '.github/workflows/letter-view-mode.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add letter-only view and global search behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')

          # Remove an earlier version of this feature if present.
          s=re.sub(r'\n<!-- lex-letter-mode-style -->.*?<!-- /lex-letter-mode-style -->\n','\n',s,flags=re.S)
          s=re.sub(r'\n<!-- lex-letter-mode-script -->.*?<!-- /lex-letter-mode-script -->\n','\n',s,flags=re.S)

          # Add ∞ to the alphabet navigation.
          nav=re.search(r'(<nav class="alphabet"[^>]*>)(.*?)(</nav>)',s,re.S)
          if not nav:
              raise SystemExit('No se encontró la navegación alfabética')
          inner=nav.group(2)
          inner=re.sub(r'<a[^>]*id="lex-letter-all"[^>]*>∞</a>','',inner)
          inner=inner.rstrip()+ '<a href="#lex-all" id="lex-letter-all" title="Mostrar todas las letras" aria-label="Mostrar todo el léxico">∞</a>'
          newnav=nav.group(1)+inner+nav.group(3)
          s=s[:nav.start()]+newnav+s[nav.end():]

          style='''
<!-- lex-letter-mode-style -->
<style>
/* letter-only lexicon navigation */
.alphabet a[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(67,56,202,.10);color:var(--accent)}
#lex-letter-all{font-size:1.08rem;line-height:1}
</style>
<!-- /lex-letter-mode-style -->
'''
          if '</head>' not in s:
              raise SystemExit('No se encontró </head>')
          s=s.replace('</head>',style+'\n</head>',1)

          script=r'''
<!-- lex-letter-mode-script -->
<script>
(function(){
  const sections=[...document.querySelectorAll('.lex-section')];
  const alphabet=document.querySelector('.alphabet');
  const search=document.getElementById('lex-search');
  if(!sections.length || !alphabet || !search) return;

  let mode='letter';
  let activeSection='sec-a';

  const letterLinks=[...alphabet.querySelectorAll('a[href^="#sec-"]')];
  const allLink=document.getElementById('lex-letter-all');

  function queryActive(){ return search.value.trim().length>0; }

  function setActiveNav(){
    const searching=queryActive();
    letterLinks.forEach(a=>{
      const active=!searching && mode==='letter' && a.getAttribute('href')==='#'+activeSection;
      if(active) a.setAttribute('aria-current','true');
      else a.removeAttribute('aria-current');
    });
    if(allLink){
      const active=!searching && mode==='all';
      if(active) allLink.setAttribute('aria-current','true');
      else allLink.removeAttribute('aria-current');
    }
  }

  function applyMode(){
    if(queryActive()){
      setActiveNav();
      return;
    }
    sections.forEach(sec=>{
      sec.hidden=(mode==='letter' && sec.id!==activeSection);
    });
    setActiveNav();
  }

  function clearSearch(){
    if(!queryActive()) return;
    search.value='';
    search.dispatchEvent(new Event('input',{bubbles:true}));
  }

  letterLinks.forEach(link=>{
    link.addEventListener('click',ev=>{
      ev.preventDefault();
      clearSearch();
      mode='letter';
      activeSection=link.getAttribute('href').slice(1);
      applyMode();
      const sec=document.getElementById(activeSection);
      if(sec) sec.scrollIntoView({block:'start'});
      history.replaceState(null,'','#'+activeSection);
    });
  });

  if(allLink){
    allLink.addEventListener('click',ev=>{
      ev.preventDefault();
      clearSearch();
      mode='all';
      sections.forEach(sec=>sec.hidden=false);
      setActiveNav();
      history.replaceState(null,'','#lex-all');
    });
  }

  // Before the existing search handler runs, expose every section so the
  // search always evaluates the complete lexicon, not only the selected letter.
  search.addEventListener('input',()=>{
    if(queryActive()) sections.forEach(sec=>sec.hidden=false);
  },true);

  // When a search is cleared, return to the previously selected letter/all mode.
  search.addEventListener('input',()=>{
    if(queryActive()){
      setActiveNav();
    }else{
      setTimeout(applyMode,0);
    }
  });

  // Internal morpheme/word links may point to another letter. Reveal that
  // section before navigating so reciprocal links continue to work.
  document.addEventListener('click',ev=>{
    const a=ev.target.closest('a[href^="#"]');
    if(!a || a.closest('.alphabet')) return;
    const href=a.getAttribute('href');
    if(!href || href==='#') return;
    let target;
    try{ target=document.querySelector(href); }catch(_){ return; }
    if(!target) return;
    const sec=target.closest('.lex-section');
    if(!sec) return;
    if(!queryActive() && mode==='letter' && sec.id!==activeSection){
      activeSection=sec.id;
      applyMode();
    }
  },true);

  function revealHashTarget(){
    if(!location.hash || location.hash==='#lex-all') return;
    let target;
    try{ target=document.querySelector(location.hash); }catch(_){ return; }
    if(!target) return;
    const sec=target.closest('.lex-section');
    if(sec && !queryActive()){
      mode='letter';
      activeSection=sec.id;
      applyMode();
    }
  }
  window.addEventListener('hashchange',revealHashTarget);

  // Default: A only. A direct internal hash overrides the default.
  if(location.hash==='#lex-all'){
    mode='all';
  }else if(location.hash){
    let target;
    try{ target=document.querySelector(location.hash); }catch(_){}
    const sec=target && target.closest ? target.closest('.lex-section') : null;
    if(sec){ mode='letter'; activeSection=sec.id; }
  }
  setTimeout(applyMode,0);
})();
</script>
<!-- /lex-letter-mode-script -->
'''
          if '</body>' not in s:
              raise SystemExit('No se encontró </body>')
          s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Mostrar léxico por letra y buscar globalmente"
          git push
