name: Fix IR grammar coherence
on:
  push:
    paths:
      - '.github/workflows/fix-ir-grammar.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix grammar wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gramatica.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<h3>3.8. Otros morfemas aspectuales documentados</h3>', '<h3>3.8. Otros morfemas derivativos y aspectuales documentados</h3>')
          old = '<p><span class="status prov">Provisional</span><code>-IR</code> funciona en <code>arkir</code> «secreto» como formante adjetival de reserva u ocultamiento; su alcance productivo queda por comprobar.</p>'
          new = '<p><span class="status prov">Provisional</span><code>-IR</code> se analiza como formante adjetival resultativo o estativo: expresa un estado resultante o una propiedad caracterizada por la raíz. Así, <code>arkir</code> «secreto» se interpreta históricamente como «guardado/oculto» y <code>arĉir</code> significa «arqueado».</p>'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-ir-grammar.yml
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gramatica.html .github/workflows/fix-ir-grammar.yml
          git commit -m "Unificar análisis provisional de IR"
          git push
