name: Clean lexicon tags and add search

on:
  push:
    paths:
      - '.github/workflows/cleanup-lexicon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lexicon HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')

          old = '<td class="form"><code>*-AJ (adverbial)</code></td><td class="gloss"></td>'
          new = '<td class="form"><code>*-AJ</code></td><td class="gloss">adverbial</td>'
          if old not in s:
              raise SystemExit('No se encontró la entrada *-AJ esperada')
          s = s.replace(old, new, 1)

          s = s.replace('<span class="tag generic">Espro</span>', '')
          s = s.replace('<span class="tag generic">Verbal</span>', '')

          if 'id="lex-search"' not in s:
              marker = '<nav class="alphabet" aria-label="Índice alfabético">'
              search = '''<div class="lex-search-box">
    <label for="lex-search">Buscar en el léxico</label>
    <div class="lex-search-row">
      <input id="lex-search" type="search" autocomplete="off" spellcheck="false" placeholder="Escribe una raíz, glosa o etiqueta…">
      <span id="lex-search-count" aria-live="polite"></span>
    </div>
  </div>
  '''
              if marker not in s:
                  raise SystemExit('No se encontró el índice alfabético')
              s = s.replace(marker, search + marker, 1)

          if '/* lex-search */' not in s:
              style = '''
<style>
/* lex-search */
.lex-search-box{margin:0 0 18px}.lex-search-box label{display:block;margin:0 0 7px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.lex-search-row{display:flex;align-items:center;gap:12px}.lex-search-row input{width:min(680px,100%);padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;outline:none}.lex-search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}#lex-search-count{color:var(--muted);font-size:.86rem;white-space:nowrap}.lex-section[hidden]{display:none}.lex-table tr[hidden]{display:none}@media(max-width:600px){.lex-search-row{align-items:flex-start;flex-direction:column}#lex-search-count{padding-left:2px}}
</style>
'''
              s = s.replace('</head>', style + '</head>', 1)

          if 'function filterLexicon' not in s:
              script = r'''
<script>
(function(){
  const input=document.getElementById('lex-search');
  const count=document.getElementById('lex-search-count');
  if(!input) return;
  const sections=[...document.querySelectorAll('.lex-section')];
  const rows=[...document.querySelectorAll('.lex-table tbody tr')];
  const norm=s=>s.toLocaleLowerCase('es').trim();
  function filterLexicon(){
    const q=norm(input.value);
    let shown=0;
    for(const row of rows){
      const match=!q || norm(row.textContent).includes(q);
      row.hidden=!match;
      if(match) shown++;
    }
    for(const section of sections){
      section.hidden=![...section.querySelectorAll('tbody tr')].some(r=>!r.hidden);
    }
    count.textContent=q ? `${shown} resultado${shown===1?'':'s'}` : `${rows.length} entradas`;
  }
  input.addEventListener('input',filterLexicon);
  filterLexicon();
})();
</script>
'''
              s = s.replace('</body>', script + '</body>', 1)

          assert '*-AJ (adverbial)' not in s
          assert '<code>*-AJ</code></td><td class="gloss">adverbial</td>' in s
          assert '>Espro<' not in s
          assert '>Verbal<' not in s
          assert 'id="lex-search"' in s
          assert 'function filterLexicon' in s

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Corregir léxico, limpiar etiquetas y añadir buscador" || exit 0
          git push
