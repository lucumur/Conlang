name: Apply AMER-K once
on:
  push:
    paths:
      - '.github/workflows/_apply-amerk-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update AMER-K
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-amer')
          root['form'] = '*AMER-K'
          root['gloss'] = 'america'
          root['etymology'] = 'Etym. Eo. Ameriko → *AMER-K'
          root['row_class'] = 'lex-root-row'
          root['words'] = [
            {
              'id': 'lexeme-amerkel',
              'form': 'amerkel',
              'gloss': 'americano (adjetivo generico)',
              'analysis_html': '<a class="morph-link" href="#root-amer">AMER-K</a> + <a class="morph-link" href="#morph-el">-EL</a>',
              'analysis_text': 'AMER-K + -EL',
              'refs': [
                {'id': 'root-amer', 'label': 'AMER-K'},
                {'id': 'morph-el', 'label': '-EL'}
              ],
              'tags': [{'class': 'generic', 'label': 'Adjetivo EL'}]
            },
            {
              'id': 'lexeme-amerkal',
              'form': 'Amerkal',
              'gloss': 'America',
              'analysis_html': '<a class="morph-link" href="#root-amer">AMER-K</a> + <a class="morph-link" href="#morph-al-3">-AL</a>',
              'analysis_text': 'AMER-K + -AL',
              'refs': [
                {'id': 'root-amer', 'label': 'AMER-K'},
                {'id': 'morph-al-3', 'label': '-AL'}
              ],
              'tags': [{'class': 'generic', 'label': 'Locativo AL'}]
            },
            {
              'id': 'lexeme-amerkin',
              'form': 'Amerkin',
              'gloss': 'americano',
              'analysis_html': '<a class="morph-link" href="#root-amer">AMER-K</a> + <a class="morph-link" href="#morph-in">-IN</a>',
              'analysis_text': 'AMER-K + -IN',
              'refs': [
                {'id': 'root-amer', 'label': 'AMER-K'},
                {'id': 'morph-in', 'label': '-IN'}
              ],
              'tags': [{'class': 'generic', 'label': 'Participio IN'}]
            }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_apply-amerk-once.yml
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json .github/workflows/_apply-amerk-once.yml
          git commit -m "Actualizar AMER a AMER-K"
          git push
