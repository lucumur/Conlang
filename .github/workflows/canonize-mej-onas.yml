name: Canonize MEJ and ONAS
on:
  push:
    paths:
      - '.github/workflows/canonize-mej-onas.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize ONAS placement and tag
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/morphemes.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          ms = data['morphemes']
          item = next(m for m in ms if m.get('id') == 'morph-onas')
          ms.remove(item)
          idx = next((i for i, m in enumerate(ms) if m.get('id') == 'morph-os'), len(ms))
          ms.insert(idx, item)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ep = Path('lexico/e.json')
          edata = json.loads(ep.read_text(encoding='utf-8'))
          ebl = next(e for e in edata['entries'] if e.get('id') == 'root-ebl')
          word = next(w for w in ebl['words'] if w.get('id') == 'lexeme-eblonas')
          word['tags'] = [{'class': 'generic', 'label': 'Predicado ONAS'}]
          ep.write_text(json.dumps(edata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/morphemes.json lexico/e.json lexico/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalizar documentación de ONAS"
          git push
