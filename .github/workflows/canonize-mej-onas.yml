name: Canonize MEJ and ONAS
on:
  push:
    paths:
      - '.github/workflows/canonize-mej-onas.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonize MEJ root and ONAS agentive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('lexico/m.json')
          mdata = json.loads(mp.read_text(encoding='utf-8'))
          entries = mdata['entries']
          mej = next((e for e in entries if e.get('id') == 'root-mej' or e.get('form') == '*MEJ-'), None)
          payload = {
              'id': 'root-mej', 'form': '*MEJ-', 'gloss': 'posibilitativo',
              'tags': [{'class': 'generic', 'label': 'Raiz'}],
              'letter': 'M', 'section': 'sec-m', 'etymology': None,
              'notes': [], 'row_class': '', 'words': []
          }
          if mej is None:
              insert_at = len(entries)
              for i, e in enumerate(entries):
                  form = e.get('form', '')
                  if form.startswith('*') and form > '*MEJ-':
                      insert_at = i; break
              entries.insert(insert_at, payload)
          else:
              old_words = mej.get('words', [])
              mej.clear(); mej.update(payload); mej['words'] = old_words
          mp.write_text(json.dumps(mdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          morphp = Path('lexico/morphemes.json')
          morphdata = json.loads(morphp.read_text(encoding='utf-8'))
          ments = morphdata['morphemes']
          onas = next((e for e in ments if e.get('id') == 'morph-onas' or e.get('form') == '*-ONAS'), None)
          onas_payload = {
              'id': 'morph-onas', 'form': '*-ONAS', 'gloss': 'tipo de agentivo',
              'tags': [{'class': 'generic', 'label': 'agentivo'}],
              'letter': 'O', 'section': 'sec-o', 'etymology': None,
              'notes': [], 'row_class': ''
          }
          if onas is None:
              insert_at = len(ments)
              for i, e in enumerate(ments):
                  form = e.get('form', '')
                  if form > '*-ONAS':
                      insert_at = i; break
              ments.insert(insert_at, onas_payload)
          else:
              onas.clear(); onas.update(onas_payload)
          morphp.write_text(json.dumps(morphdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ep = Path('lexico/e.json')
          edata = json.loads(ep.read_text(encoding='utf-8'))
          ebl = next(e for e in edata['entries'] if e.get('id') == 'root-ebl')
          ebl['notes'] = [
              'CANÓNICO: eblis es la forma absolutiva impersonal; eblos es la forma absolutiva dinámica.',
              'CANÓNICO: -ONAS es un tipo de agentivo; eblonas emplea este morfema.'
          ]
          by_id = {w.get('id'): w for w in ebl.get('words', [])}
          w = by_id['lexeme-eblonas']
          w['analysis_html'] = 'EBL + <a class="morph-link" href="#morph-onas">-ONAS</a>'
          w['analysis_text'] = 'EBL + -ONAS'
          w['refs'] = [{'id': 'morph-onas', 'label': '-ONAS'}]

          w = by_id['lexeme-mejeblira']
          w['analysis_html'] = '<a class="morph-link" href="#root-mej">MEJ</a> + EBL + <a class="morph-link" href="#morph-ir-reservative">-IR</a> + <a class="morph-link" href="#morph-a-2">-A</a>'
          w['analysis_text'] = 'MEJ + EBL + -IR + -A'
          w['refs'] = [
              {'id': 'root-mej', 'label': 'MEJ'},
              {'id': 'morph-ir-reservative', 'label': '-IR'},
              {'id': 'morph-a-2', 'label': '-A'}
          ]

          w = by_id['lexeme-maleblonir']
          w['analysis_html'] = '<a class="morph-link" href="#root-mal">MAL</a> + EBLONAS → MALEBLONIR'
          w['analysis_text'] = 'MAL + EBLONAS → MALEBLONIR'
          w['refs'] = [
              {'id': 'root-mal', 'label': 'MAL'},
              {'id': 'morph-onas', 'label': '-ONAS'}
          ]
          ep.write_text(json.dumps(edata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ap = Path('lexico/a.json')
          adata = json.loads(ap.read_text(encoding='utf-8'))
          found = False
          for root in adata['entries']:
              for word in root.get('words', []):
                  if word.get('id') == 'lexeme-aronas' or word.get('form') == 'aronas':
                      word['analysis_html'] = 'AR + <a class="morph-link" href="#morph-onas">-ONAS</a>'
                      word['analysis_text'] = 'AR + -ONAS'
                      word['refs'] = [{'id': 'morph-onas', 'label': '-ONAS'}]
                      found = True
          if not found:
              raise SystemExit('Expected aronas lexeme not found')
          ap.write_text(json.dumps(adata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gp = Path('gramatica.html')
          gtxt = gp.read_text(encoding='utf-8')
          row = '    <tr><td><code>-AS</code></td><td><strong>agentivo</strong></td></tr>'
          newrow = row + '\n    <tr><td><code>-ONAS</code></td><td><strong>tipo de agentivo</strong></td></tr>'
          if '<code>-ONAS</code>' not in gtxt:
              if row not in gtxt:
                  raise SystemExit('Canonical -AS grammar row not found')
              gtxt = gtxt.replace(row, newrow, 1)
          gp.write_text(gtxt, encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/m.json lexico/morphemes.json lexico/e.json lexico/a.json lexico/index.json gramatica.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Canonizar MEJ y agentivo ONAS"
          git push
