name: Abbreviate etymology labels
on:
  push:
    paths:
      - '.github/workflows/abbrev-etymology-labels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abbreviate labels in lexicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Etimología:', 'Etym.')
          s=s.replace('Esperanto ', 'Eo. ')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Abreviar etiquetas etimológicas"
          git push
