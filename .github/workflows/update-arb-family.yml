name: Update ARB family
on:
  push:
    paths:
      - '.github/workflows/update-arb-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ARB family and NAT root
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          def tag(label, cls='generic'):
              return {"class": cls, "label": label}

          # --- canonical NAT root: *NA-T -> *NAT- ---
          np = Path('lexico/n.json')
          nd = json.loads(np.read_text(encoding='utf-8'))
          nat = None
          for e in nd.get('entries', []):
              if e.get('id') == 'root-na-t' or e.get('form') == '*NA-T':
                  nat = e
                  break
          if nat is None:
              raise SystemExit('No se encontró la raíz antigua *NA-T')
          nat['id'] = 'root-nat'
          nat['form'] = '*NAT-'
          nat['gloss'] = 'nacer'
          nat['row_class'] = nat.get('row_class','')
          np.write_text(json.dumps(nd, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- morphemes ---
          mp = Path('lexico/morphemes.json')
          md = json.loads(mp.read_text(encoding='utf-8'))
          morphemes = md.get('morphemes', [])
          by_id = {m.get('id'): m for m in morphemes}

          additions = [
              {
                  'id':'morph-o',
                  'form':'*-O',
                  'gloss':'inanimados',
                  'tags':[tag('sufijo')],
                  'letter':'O','section':'sec-o','etymology':None,'notes':[],'row_class':''
              },
              {
                  'id':'morph-olda',
                  'form':'*-OLDA',
                  'gloss':'forma abstracta derivada de adjetivos en -OL',
                  'tags':[tag('sufijo')],
                  'letter':'O','section':'sec-o','etymology':None,
                  'notes':['Derivación canónica: adjetivo en -OL → abstracto en -OLDA.'],
                  'row_class':''
              },
              {
                  'id':'morph-fas',
                  'form':'*-FAS',
                  'gloss':"función derivativa pendiente; atestiguado en arbifas 'fortificar'",
                  'tags':[tag('morfema')],
                  'letter':'F','section':'sec-f','etymology':None,
                  'notes':['La función general de -FAS todavía no está canonizada.'],
                  'row_class':''
              }
          ]
          for item in additions:
              if item['id'] in by_id:
                  idx = next(i for i,m in enumerate(morphemes) if m.get('id') == item['id'])
                  morphemes[idx] = item
              else:
                  morphemes.append(item)
          md['morphemes'] = morphemes
          mp.write_text(json.dumps(md, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- ARB repertoire ---
          ap = Path('lexico/a.json')
          ad = json.loads(ap.read_text(encoding='utf-8'))
          arb = next((e for e in ad.get('entries',[]) if e.get('id')=='root-arb'), None)
          if arb is None:
              raise SystemExit('No se encontró *ARB-')
          arb['row_class'] = 'lex-root-row'
          arb['words'] = [
              {
                  'id':'lexeme-arbol','form':'arbol','gloss':'robusto',
                  'analysis_html':'ARB + <a class="morph-link" href="#morph-ol-2">-OL</a>',
                  'analysis_text':'ARB + -OL',
                  'refs':[{'id':'morph-ol-2','label':'-OL'}],
                  'tags':[tag('Adjetivo OL')]
              },
              {
                  'id':'lexeme-arbolda','form':'arbolda','gloss':'robustez',
                  'analysis_html':'ARB + <a class="morph-link" href="#morph-olda">-OLDA</a>',
                  'analysis_text':'ARB + -OLDA',
                  'refs':[{'id':'morph-olda','label':'-OLDA'}],
                  'tags':[]
              },
              {
                  'id':'lexeme-arbo','form':'arbo','gloss':'arbol',
                  'analysis_html':'ARB + <a class="morph-link" href="#morph-o">-O</a>',
                  'analysis_text':'ARB + -O',
                  'refs':[{'id':'morph-o','label':'-O'}],
                  'tags':[tag('Nomen O')]
              },
              {
                  'id':'lexeme-arbadal','form':'arbadal','gloss':'arboleda',
                  'analysis_html':'ARB + <a class="morph-link" href="#morph-ad">-AD-</a> + <a class="morph-link" href="#morph-al-3">-AL</a>',
                  'analysis_text':'ARB + -AD- + -AL',
                  'refs':[{'id':'morph-ad','label':'-AD-'},{'id':'morph-al-3','label':'-AL'}],
                  'tags':[tag('Locativo AL')]
              },
              {
                  'id':'lexeme-arbiko','form':'arbiko','gloss':'arbusto',
                  'analysis_html':'ARB + <a class="morph-link" href="#morph-ik">-IK-</a> + <a class="morph-link" href="#morph-o">-O</a>',
                  'analysis_text':'ARB + -IK- + -O',
                  'refs':[{'id':'morph-ik','label':'-IK-'},{'id':'morph-o','label':'-O'}],
                  'tags':[tag('Nomen O')]
              },
              {
                  'id':'lexeme-arbikrona','form':'arbikrona','gloss':'copa del arbol',
                  'analysis_html':'ARB + <span class="meta-extra">i epentética</span> + <a class="morph-link" href="#root-kron">KRON</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
                  'analysis_text':'ARB + i epentética + KRON + -A',
                  'refs':[{'id':'root-kron','label':'KRON'},{'id':'morph-a-2','label':'-A'}],
                  'tags':[tag('Nomen A')]
              },
              {
                  'id':'lexeme-natarbo','form':'natarbo','gloss':'arbol de navidad',
                  'analysis_html':'<a class="morph-link" href="#root-nat">NAT</a> + ARB + <a class="morph-link" href="#morph-o">-O</a>',
                  'analysis_text':'NAT + ARB + -O',
                  'refs':[{'id':'root-nat','label':'NAT'},{'id':'morph-o','label':'-O'}],
                  'tags':[tag('Nomen O')]
              },
              {
                  'id':'lexeme-arbifas','form':'arbifas','gloss':'fortificar',
                  'analysis_html':'ARB + <span class="meta-extra">i epentética</span> + <a class="morph-link" href="#morph-fas">-FAS</a>',
                  'analysis_text':'ARB + i epentética + -FAS',
                  'refs':[{'id':'morph-fas','label':'-FAS'}],
                  'tags':[]
              },
              {
                  'id':'lexeme-arbigos','form':'arbiĝos','gloss':'robustecer, volverse fuerte-macizo',
                  'analysis_html':'ARB + <a class="morph-link" href="#root-ig">IĜ</a> + <a class="morph-link" href="#morph-os">-OS</a>',
                  'analysis_text':'ARB + IĜ + -OS',
                  'refs':[{'id':'root-ig','label':'IĜ'},{'id':'morph-os','label':'-OS'}],
                  'tags':[tag('Predicado OS')]
              }
          ]
          ap.write_text(json.dumps(ad, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- Grammar: OL -> OLDA abstract ---
          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          row = '    <tr><td><code>-OL</code></td><td>adjetivo de abundancia o parecido</td></tr>'
          newrow = row + '\n    <tr><td><code>-OLDA</code></td><td>forma abstracta derivada de un adjetivo en <code>-OL</code></td></tr>'
          if '<code>-OLDA</code>' not in g:
              if row not in g:
                  raise SystemExit('No se encontró la fila -OL en gramatica.html')
              g = g.replace(row, newrow, 1)
              gp.write_text(g, encoding='utf-8')

          subprocess.run(['python','scripts/build_lexicon_index.py'], check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/n.json lexico/morphemes.json lexico/index.json gramatica.html
          git commit -m "Añadir repertorio de ARB y actualizar NAT"
          git push
