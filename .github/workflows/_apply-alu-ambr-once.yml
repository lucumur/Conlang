name: Apply ALU semantics and AMBR once
on:
  push:
    paths:
      - '.github/workflows/_apply-alu-ambr-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update lexicon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ap = Path('lexico/a.json')
          mp = Path('lexico/morphemes.json')
          a = json.loads(ap.read_text(encoding='utf-8'))
          m = json.loads(mp.read_text(encoding='utf-8'))

          # Ensure *-ERZ- = metal is canonical.
          erz = next((x for x in m['morphemes'] if x.get('id') == 'morph-erz'), None)
          if erz is None:
              erz = {
                  'id': 'morph-erz', 'form': '*-ERZ-', 'gloss': 'metal',
                  'tags': [{'class':'generic','label':'sufijo'}],
                  'letter': 'E', 'section': 'sec-e', 'etymology': None,
                  'notes': [], 'row_class': ''
              }
              # insert near other E morphemes, otherwise append
              pos = next((i for i,x in enumerate(m['morphemes']) if x.get('letter') not in ('A','B','C','Ĉ','D','E')), len(m['morphemes']))
              m['morphemes'].insert(pos, erz)
          else:
              erz['form'] = '*-ERZ-'
              erz['gloss'] = 'metal'

          # Canonical ALU entry + accepted semantic fields.
          alu = next((x for x in a['entries'] if x.get('id') in ('root-alu','root-alum')), None)
          if alu:
              alu['id'] = 'root-alu'
              alu['form'] = '*ALU-'
              alu['gloss'] = 'alumbre'
              alu['etymology'] = 'Etym. Eo. aluno → *ALU-'
              alu['row_class'] = 'lex-root-row'
              words = {w.get('id'): w for w in alu.get('words', [])}
              words['lexeme-alusale'] = {
                  'id':'lexeme-alusale','form':'alusale','gloss':'alumbre',
                  'analysis_html':'ALU + <a class="morph-link" href="#root-sal">SAL</a> + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text':'ALU + SAL + -E',
                  'refs':[{'id':'root-sal','label':'SAL'},{'id':'morph-e','label':'-E'}],
                  'tags':[{'class':'generic','label':'Nomen E'}],
                  'semantic_fields':['química','sales']
              }
              words['lexeme-alurze'] = {
                  'id':'lexeme-alurze','form':'alurze','gloss':'aluminio',
                  'analysis_html':'ALU + <a class="morph-link" href="#morph-erz">-ERZ-</a> + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text':'ALU + -ERZ- + -E',
                  'refs':[{'id':'morph-erz','label':'-ERZ-'},{'id':'morph-e','label':'-E'}],
                  'tags':[{'class':'generic','label':'Nomen E'}],
                  'semantic_fields':['química','elementos','metales']
              }
              alu['words'] = [words[k] for k in ('lexeme-alusale','lexeme-alurze')]

          # Canonical AMBR paradigm.
          ambr = next(x for x in a['entries'] if x.get('id') == 'root-ambr')
          ambr['gloss'] = 'ambar'
          ambr['row_class'] = 'lex-root-row'
          ambr['words'] = [
              {
                  'id':'lexeme-ambrol','form':'ambrol',
                  'gloss':'amarillo (modernamente genérico; históricamente más próximo a amarillo-naranja)',
                  'analysis_html':'AMBR + <a class="morph-link" href="#morph-ol-2">-OL</a>',
                  'analysis_text':'AMBR + -OL',
                  'refs':[{'id':'morph-ol-2','label':'-OL'}],
                  'tags':[{'class':'generic','label':'Adjetivo OL'}]
              },
              {
                  'id':'lexeme-ambre','form':'ambre','gloss':'ambar',
                  'analysis_html':'AMBR + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text':'AMBR + -E',
                  'refs':[{'id':'morph-e','label':'-E'}],
                  'tags':[{'class':'generic','label':'Nomen E'}]
              },
              {
                  'id':'lexeme-zetikambre','form':'ẑetikambre','gloss':'ambar gris',
                  'analysis_html':'ẐETIK + AMBR + <a class="morph-link" href="#morph-e">-E</a> <span class="meta-extra">[ẐETIK pendiente de analizar]</span>',
                  'analysis_text':'ẐETIK + AMBR + -E [ẐETIK pendiente de analizar]',
                  'refs':[{'id':'morph-e','label':'-E'}],
                  'tags':[{'class':'generic','label':'Nomen E'}]
              }
          ]

          ap.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_apply-alu-ambr-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/morphemes.json lexico/index.json .github/workflows/_apply-alu-ambr-once.yml
          git commit -m "Actualizar ALU y AMBR"
          git push
