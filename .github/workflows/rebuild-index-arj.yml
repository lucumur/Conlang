name: Rebuild index after ARJ merge
on:
  push:
    paths:
      - '.github/workflows/rebuild-index-arj.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild lexicon index
        run: python scripts/build_lexicon_index.py
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/rebuild-index-arj.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/index.json .github/workflows/rebuild-index-arj.yml
          git commit -m "Regenerar índice tras unificar ARJ"
          git push
