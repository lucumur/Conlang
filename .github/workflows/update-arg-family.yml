name: Update ARG family
on:
  push:
    paths:
      - '.github/workflows/update-arg-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ARG family and morphemes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # --- lexico/a.json ---
          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          arg = next((e for e in data.get('entries', []) if e.get('id') == 'root-arg'), None)
          if arg is None:
              raise SystemExit('No se encontró *ARG-')

          def tag(label):
              return {'class':'generic','label':label}

          arg['row_class'] = 'lex-root-row'
          arg['words'] = [
            {
              'id':'lexeme-argle',
              'form':'argle',
              'gloss':'arcilla',
              'analysis_html':'ARG + <a class="morph-link" href="#morph-le-deverbal">-LE</a>',
              'analysis_text':'ARG + -LE',
              'refs':[{'id':'morph-le-deverbal','label':'-LE'}],
              'tags':[tag('Derivado deverbal')],
              'semantic_fields':['materiales','geología','cerámica']
            },
            {
              'id':'lexeme-argethe',
              'form':'argeθe',
              'gloss':'argon',
              'analysis_html':'ARG + <a class="morph-link" href="#morph-etheta-gas">-EΘ-</a> + <a class="morph-link" href="#morph-e">-E</a>',
              'analysis_text':'ARG + -EΘ- + -E',
              'refs':[{'id':'morph-etheta-gas','label':'-EΘ-'},{'id':'morph-e','label':'-E'}],
              'tags':[tag('Nomen E')],
              'semantic_fields':['gases','elementos químicos','química']
            }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- lexico/morphemes.json ---
          mp = Path('lexico/morphemes.json')
          mdata = json.loads(mp.read_text(encoding='utf-8'))
          morphs = mdata.setdefault('morphemes', [])

          def upsert(m):
              for i, old in enumerate(morphs):
                  if old.get('id') == m['id']:
                      morphs[i] = m
                      return
              morphs.append(m)

          upsert({
            'id':'morph-etheta-gas',
            'form':'*-EΘ-',
            'gloss':'gas; formante para sustancias gaseosas',
            'tags':[tag('morfema')],
            'letter':'E',
            'section':'sec-e',
            'etymology':None,
            'notes':['Valor canónico: gas.'],
            'row_class':''
          })
          upsert({
            'id':'morph-le-deverbal',
            'form':'*-LE',
            'gloss':'derivador deverbal; función semántica formal aún no definida',
            'tags':[tag('morfema')],
            'letter':'L',
            'section':'sec-l',
            'etymology':None,
            'notes':['Es deverbal; su valor semántico específico permanece abierto.'],
            'row_class':''
          })
          mp.write_text(json.dumps(mdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- gramatica.html ---
          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          marker = '    <tr><td><code>-AĈ-</code></td><td>intensificativo verbal</td></tr>'
          addition = marker + '\n    <tr><td><code>-EΘ-</code></td><td>formante de gas / sustancias gaseosas</td></tr>\n    <tr><td><code>-LE</code></td><td>derivador deverbal; función semántica formal todavía abierta</td></tr>'
          if '<code>-EΘ-</code></td><td>formante de gas' not in g:
              if marker not in g:
                  raise SystemExit('No se encontró punto de inserción en gramatica.html')
              g = g.replace(marker, addition, 1)
          gp.write_text(g, encoding='utf-8')
          PY

          python scripts/build_lexicon_index.py
          git rm .github/workflows/update-arg-family.yml

      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/morphemes.json lexico/index.json gramatica.html .github/workflows/update-arg-family.yml
          git commit -m "Añadir repertorio de ARG y morfemas EΘ y LE"
          git push
