name: Canonize participles and ONAS derivatives
on:
  push:
    paths:
      - '.github/workflows/canonize-participles-onas.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonize participles and ONAS human derivative
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def tag(label):
              return {'class':'generic','label':label}
          def ref(i,label):
              return {'id':i,'label':label}

          # Morphemes
          mp=Path('lexico/morphemes.json')
          md=json.loads(mp.read_text(encoding='utf-8'))
          morphs=md['morphemes']
          byid={m.get('id'):m for m in morphs}

          ar=byid['morph-ar-2']
          ar['gloss']='participio de -AS (agentivo)'
          ar['notes']=['Canónico: -AR es el participio correspondiente a la serie predicativa en -AS.']

          mor=byid.get('morph-or')
          if mor is None:
              raise SystemExit('morph-or not found')
          mor['gloss']='adjetivo superlativo o de magnitud'
          mor['notes']=['CANÓNICO: -OR forma adjetivos superlativos o de magnitud.','CANÓNICO: -OR reemplaza en esta función al antiguo -UR; ya no es el participio de -OS.']

          mur=byid.get('morph-ur-3')
          if mur is None:
              raise SystemExit('morph-ur-3 not found')
          mur['gloss']='participio de -OS (absolutivo dinámico; serie intransitiva)'
          mur['notes']=['CANÓNICO: -UR es el participio correspondiente a la serie predicativa en -OS.','CANÓNICO: -UR reemplaza en esta función al antiguo -OR; ya no es el sufijo productivo de superlativo o magnitud.']

          monas=byid.get('morph-onas')
          if monas is None:
              raise SystemExit('morph-onas not found')
          monas['notes']=[
              'Canónico: -ONAS es un tipo de agentivo.',
              'Su participio sigue la serie agentiva: -ONAS → -ONAR, por sustitución de -AS por -AR.',
              'Para «persona dedicada a» una actividad en -ONAS se usa -ONTAN, no el analógico esperado *-ONISTAN.'
          ]

          if 'morph-ontan' not in byid:
              morphs.append({
                  'id':'morph-ontan','form':'*-ONTAN','gloss':'persona dedicada a una actividad expresada en -ONAS',
                  'tags':[tag('sufijo'),tag('humano especializado')],
                  'letter':'O','section':'sec-o','etymology':None,
                  'notes':['Derivación canónica de la serie -ONAS. Sustituye al esperado analógico *-ONISTAN para este valor.'],
                  'row_class':''
              })
          else:
              byid['morph-ontan'].update({
                  'form':'*-ONTAN','gloss':'persona dedicada a una actividad expresada en -ONAS',
                  'tags':[tag('sufijo'),tag('humano especializado')],
                  'notes':['Derivación canónica de la serie -ONAS. Sustituye al esperado analógico *-ONISTAN para este valor.']
              })
          mp.write_text(json.dumps(md,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Lexicon A: AŜV and old -OR dependent entries.
          ap=Path('lexico/a.json')
          ad=json.loads(ap.read_text(encoding='utf-8'))
          entries=ad['entries']
          asv=next(e for e in entries if e.get('id')=='root-asv')
          asv['notes']=[
              'La grafía canónica de la raíz es AŜV; la antigua ASV queda obsoleta.',
              'aŝvontan es el derivado humano especializado de aŝvonas mediante -ONTAN «persona dedicada a»; no *aŝvonistan.',
              'aŝvonar es el participio de aŝvonas: -ONAS → -ONAR.',
              'El UR de aŝvur no se identifica automáticamente con el -UR superlativo; la ambigüedad formal se conserva.'
          ]
          w={x.get('form'):x for x in asv.get('words',[])}
          w['aŝvontan'].update({
              'analysis_html':'AŜV + <a class="morph-link" href="#morph-ontan">-ONTAN</a>',
              'analysis_text':'AŜV + -ONTAN',
              'refs':[ref('morph-ontan','-ONTAN')],
              'tags':[tag('Humano especializado')]
          })
          w['aŝvonar'].update({
              'analysis_html':'AŜV + <a class="morph-link" href="#morph-onas">-ONAS</a> → AŜV + -ON- + <a class="morph-link" href="#morph-ar-2">-AR</a>',
              'analysis_text':'AŜV + -ONAS → AŜV + -ON- + -AR',
              'refs':[ref('morph-onas','-ONAS'),ref('morph-ar-2','-AR')],
              'tags':[tag('Participio de ONAS')]
          })

          # bonalmor had been linked to the old superlative -OR; do not silently reinterpret it as a participle.
          for e in entries:
              for x in e.get('words',[]):
                  if x.get('form')=='bonalmor':
                      x['analysis_html']='<a class="morph-link" href="#root-bon">BON</a> + ALM + OR (segmento final pendiente de reanálisis; no se asume el participio -OR)'
                      x['analysis_text']='BON + ALM + OR (segmento final pendiente de reanálisis; no se asume el participio -OR)'
                      x['refs']=[r for r in x.get('refs',[]) if r.get('id')!='morph-or']

          # avilor: update old note mentioning superlative OR.
          av=next(e for e in entries if e.get('id')=='root-av-3')
          for x in av.get('words',[]):
              if x.get('form')=='avilor':
                  x['analysis_html']='AV + <a class="morph-link" href="#morph-il-partitive">-IL-</a> + OR (segmento final no asumido como participio de -OS)'
                  x['analysis_text']='AV + -IL- + OR (segmento final no asumido como participio de -OS)'
                  x['refs']=[r for r in x.get('refs',[]) if r.get('id')!='morph-or']

          ap.write_text(json.dumps(ad,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Grammar
          gp=Path('gramatica.html')
          g=gp.read_text(encoding='utf-8')
          g=g.replace('<tr><td><code>-AR</code></td><td>participio agentivo</td></tr>',
                      '<tr><td><code>-AR</code></td><td><strong>participio de -AS</strong> (serie agentiva)</td></tr>')
          # Insert participial correspondence and ONAS derivation near predicative section if absent.
          anchor='  <p><span class="status discard">Descartado</span>-OS es simultáneamente absolutivo dinámico y un tipo de verbo intransitivo; «dinámico» se opone a la predicación estativa en -ES.</p>\n'
          block=anchor+'''\n  <h3>2.1. Participios de las series predicativas</h3>\n  <p><span class="status canon">Canónico</span><code>-AR</code> es el participio de la serie agentiva <code>-AS</code>; <code>-UR</code> es el participio de la serie absolutiva dinámica e intransitiva <code>-OS</code>.</p>\n  <p><span class="status canon">Canónico</span>Los adjetivos superlativos o de magnitud se forman productivamente con <code>-OR</code>. El antiguo <code>-UR</code> de esta función queda reemplazado; <code>-UR</code> es ahora el participio de la serie en <code>-OS</code>.</p>\n  <p><span class="status canon">Canónico</span>Dentro de la serie <code>-ONAS</code>, el participio se forma como <code>-ONAR</code> (<code>-ONAS → -ONAR</code>). Para designar «persona dedicada a» esa actividad se usa <code>-ONTAN</code>, en lugar del analógico esperado <code>*-ONISTAN</code>.</p>\n'''
          if '<h3>2.1. Participios de las series predicativas</h3>' not in g:
              if anchor not in g:
                  raise SystemExit('grammar anchor not found')
              g=g.replace(anchor,block,1)
          gp.write_text(g,encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/morphemes.json lexico/index.json gramatica.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Canonizar participios AR OR y derivación ONAS"
          git push
