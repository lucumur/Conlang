name: Apply ANT family once
on:
  push:
    paths:
      - '.github/workflows/_apply-ant-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ANT family
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('lexico/a.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          root=next(e for e in data['entries'] if e['id']=='root-ant')
          root['row_class']='lex-root-row'
          words=[
            {
              'id':'lexeme-alantos','form':'alantos','gloss':'adelantarse',
              'analysis_html':'<a class="morph-link" href="#morph-al-2">AL-</a> + ANT + <a class="morph-link" href="#morph-os">-OS</a>',
              'analysis_text':'AL- + ANT + -OS',
              'refs':[{'id':'morph-al-2','label':'AL-'},{'id':'morph-os','label':'-OS'}],
              'tags':[{'class':'generic','label':'Predicado OS'}]
            },
            {
              'id':'lexeme-antur','form':'antur','gloss':'anterior',
              'analysis_html':'ANT + <a class="morph-link" href="#morph-ur-3">-UR</a>',
              'analysis_text':'ANT + -UR',
              'refs':[{'id':'morph-ur-3','label':'-UR'}],
              'tags':[{'class':'generic','label':'Adjetivo UR'}]
            },
            {
              'id':'lexeme-antevur','form':'antevur','gloss':'antiguo',
              'analysis_html':'ANT + <a class="morph-link" href="#morph-ev">-EV-</a> + <a class="morph-link" href="#morph-ur-3">-UR</a>',
              'analysis_text':'ANT + -EV- + -UR',
              'refs':[{'id':'morph-ev','label':'-EV-'},{'id':'morph-ur-3','label':'-UR'}],
              'tags':[{'class':'generic','label':'Adjetivo UR'}]
            },
            {
              'id':'lexeme-opantur','form':'opantur','gloss':'contrario',
              'analysis_html':'<a class="morph-link" href="#root-op">OP</a> + ANT + <a class="morph-link" href="#morph-ur-3">-UR</a>',
              'analysis_text':'OP + ANT + -UR',
              'refs':[{'id':'root-op','label':'OP'},{'id':'morph-ur-3','label':'-UR'}],
              'tags':[{'class':'generic','label':'Adjetivo UR'}]
            },
            {
              'id':'lexeme-alantur','form':'alantur','gloss':'delantero',
              'analysis_html':'<a class="morph-link" href="#morph-al-2">AL-</a> + ANT + <a class="morph-link" href="#morph-ur-3">-UR</a>',
              'analysis_text':'AL- + ANT + -UR',
              'refs':[{'id':'morph-al-2','label':'AL-'},{'id':'morph-ur-3','label':'-UR'}],
              'tags':[{'class':'generic','label':'Adjetivo UR'}]
            },
            {
              'id':'lexeme-antevon','form':'antevon','gloss':'hombre de la antigüedad',
              'analysis_html':'ANT + <a class="morph-link" href="#morph-ev">-EV-</a> + <a class="morph-link" href="#morph-on">-ON</a>',
              'analysis_text':'ANT + -EV- + -ON',
              'refs':[{'id':'morph-ev','label':'-EV-'},{'id':'morph-on','label':'-ON'}],
              'tags':[{'class':'generic','label':'Humano ON'}]
            },
            {
              'id':'lexeme-antevada','form':'antevada','gloss':'la antigüedad',
              'analysis_html':'ANT + <a class="morph-link" href="#morph-ev">-EV-</a> + <a class="morph-link" href="#morph-ad">-AD-</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text':'ANT + -EV- + -AD- + -A',
              'refs':[{'id':'morph-ev','label':'-EV-'},{'id':'morph-ad','label':'-AD-'},{'id':'morph-a-2','label':'-A'}],
              'tags':[{'class':'generic','label':'Nomen A'}]
            },
            {
              'id':'lexeme-antaf','form':'antaf','gloss':'enfrente',
              'analysis_html':'ANT + <a class="morph-link" href="#morph-af">-AF</a>',
              'analysis_text':'ANT + -AF',
              'refs':[{'id':'morph-af','label':'-AF'}],
              'tags':[{'class':'generic','label':'Adverbio AF'}]
            },
            {
              'id':'lexeme-antacom','form':'antaĉom','gloss':'ante todo, principalmente',
              'analysis_html':'ANT + AĈOM',
              'analysis_text':'ANT + AĈOM',
              'refs':[],
              'tags':[{'class':'generic','label':'Adverbio'}]
            },
            {
              'id':'lexeme-antam','form':'antam','gloss':'antes',
              'analysis_html':'ANT + <a class="morph-link" href="#morph-am">-AM</a>',
              'analysis_text':'ANT + -AM',
              'refs':[{'id':'morph-am','label':'-AM'}],
              'tags':[{'class':'generic','label':'Adverbio AM'}]
            },
            {
              'id':'lexeme-antajur','form':'antajur','gloss':'antes de hoy, hace ...',
              'analysis_html':'ANT + A + <a class="morph-link" href="#root-jur">JUR</a>',
              'analysis_text':'ANT + A + JUR',
              'refs':[{'id':'root-jur','label':'JUR'}],
              'tags':[{'class':'generic','label':'Adverbio'}]
            },
            {
              'id':'lexeme-alantaf','form':'alantaf','gloss':'adelante',
              'analysis_html':'<a class="morph-link" href="#morph-al-2">AL-</a> + ANT + <a class="morph-link" href="#morph-af">-AF</a>',
              'analysis_text':'AL- + ANT + -AF',
              'refs':[{'id':'morph-al-2','label':'AL-'},{'id':'morph-af','label':'-AF'}],
              'tags':[{'class':'generic','label':'Adverbio AF'}]
            }
          ]
          existing={w['id']:w for w in root.get('words',[])}
          for w in words: existing[w['id']]=w
          root['words']=list(existing.values())
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          rm .github/workflows/_apply-ant-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json .github/workflows/_apply-ant-once.yml
          git commit -m "Añadir familia léxica ANT"
          git push
