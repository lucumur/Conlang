name: Rebuild lexicon index once
on:
  push:
    paths:
      - '.github/workflows/_rebuild-lexicon-index-once.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Commit rebuilt index and remove temporary workflow
        run: |
          rm .github/workflows/_rebuild-lexicon-index-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerar índice léxico tras AJL"
          git push