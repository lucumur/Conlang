name: Migrate ALK to KAL once

on:
  push:
    paths:
      - '.github/workflows/_migrate-alk-kal-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical lexicon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a_path = Path('lexico/a.json')
          k_path = Path('lexico/k.json')
          a = json.loads(a_path.read_text(encoding='utf-8'))
          k = json.loads(k_path.read_text(encoding='utf-8'))

          matches = [(i, e) for i, e in enumerate(a['entries']) if e.get('id') == 'root-alk']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one root-alk entry, found {len(matches)}')
          idx, entry = matches[0]
          a['entries'].pop(idx)

          if any(e.get('id') == 'root-kal' or e.get('form') == '*KAL-' for e in k['entries']):
              raise SystemExit('Exact root-kal / *KAL- already exists in k.json')

          entry.update({
              'id': 'root-kal',
              'form': '*KAL-',
              'gloss': 'alcali',
              'tags': [
                  {'class': 'generic', 'label': 'Raiz'},
                  {'class': 'nova', 'label': 'Nova'},
                  {'class': 'germanico', 'label': 'Germanico'},
              ],
              'letter': 'K',
              'section': 'sec-k',
              'etymology': 'Etym. de novo; alemán kal- → *KAL-',
              'notes': [],
              'row_class': 'lex-root-row',
              'words': [
                  {
                      'id': 'lexeme-kalsale',
                      'form': 'kalsale',
                      'gloss': 'potasa',
                      'analysis_html': 'KAL + <a class="morph-link" href="#root-sal">SAL</a> + <a class="morph-link" href="#morph-e">-E</a>',
                      'analysis_text': 'KAL + SAL + -E',
                      'refs': [
                          {'id': 'root-sal', 'label': 'SAL'},
                          {'id': 'morph-e', 'label': '-E'},
                      ],
                      'tags': [{'class': 'generic', 'label': 'Nomen E'}],
                  },
                  {
                      'id': 'lexeme-kaljone',
                      'form': 'kaljone',
                      'gloss': 'potasio',
                      'analysis_html': 'KAL + <a class="morph-link" href="#root-jon">JON</a> + <a class="morph-link" href="#morph-e">-E</a>',
                      'analysis_text': 'KAL + JON + -E',
                      'refs': [
                          {'id': 'root-jon', 'label': 'JON'},
                          {'id': 'morph-e', 'label': '-E'},
                      ],
                      'tags': [{'class': 'generic', 'label': 'Nomen E'}],
                  },
                  {
                      'id': 'lexeme-kaljur',
                      'form': 'kaljur',
                      'gloss': 'alcalino',
                      'analysis_html': 'KAL + <a class="morph-link" href="#morph-j-theme">-J-</a> + <a class="morph-link" href="#morph-ur-3">-UR</a>',
                      'analysis_text': 'KAL + -J- + -UR',
                      'refs': [
                          {'id': 'morph-j-theme', 'label': '-J-'},
                          {'id': 'morph-ur-3', 'label': '-UR'},
                      ],
                      'tags': [{'class': 'generic', 'label': 'Adjetivo UR'}],
                  },
                  {
                      'id': 'lexeme-kalja',
                      'form': 'kalja',
                      'gloss': 'alcalinidad',
                      'analysis_html': 'KAL + <a class="morph-link" href="#morph-j-theme">-J-</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
                      'analysis_text': 'KAL + -J- + -A',
                      'refs': [
                          {'id': 'morph-j-theme', 'label': '-J-'},
                          {'id': 'morph-a-2', 'label': '-A'},
                      ],
                      'tags': [{'class': 'generic', 'label': 'Nomen A'}],
                  },
              ],
          })

          insert_at = next((i for i, e in enumerate(k['entries']) if e.get('id') == 'root-kal-k'), len(k['entries']))
          k['entries'].insert(insert_at, entry)

          a_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          k_path.write_text(json.dumps(k, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_migrate-alk-kal-once.yml
      - name: Commit canonical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/k.json lexico/index.json .github/workflows/_migrate-alk-kal-once.yml
          git commit -m "Migrar ALK a KAL y añadir derivados"
          git push
