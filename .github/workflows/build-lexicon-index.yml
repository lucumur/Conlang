name: Build lexicon index
on:
  push:
    paths:
      - 'lexico/*.json'
      - '!lexico/index.json'
      - '!lexico/history.json'
      - 'scripts/build_lexicon_index.py'
      - 'scripts/build_root_history.py'
      - '.github/workflows/build-lexicon-index.yml'
permissions:
  contents: write
concurrency:
  group: lexicon-index
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild generated lexicon data
        run: |
          python scripts/build_lexicon_index.py
          python scripts/build_root_history.py
      - name: Commit generated files if changed
        run: |
          if git diff --quiet -- lexico/index.json lexico/history.json; then
            exit 0
          fi
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/index.json lexico/history.json
          git commit -m "Regenerar datos léxicos"
          git push
