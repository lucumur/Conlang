name: Build lexicon index
on:
  push:
    paths:
      - 'lexico/*.json'
      - '!lexico/index.json'
permissions:
  contents: write
concurrency:
  group: lexicon-index
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Commit index if changed
        run: |
          if git diff --quiet -- lexico/index.json; then
            exit 0
          fi
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/index.json
          git commit -m "Regenerar índice léxico"
          git push
