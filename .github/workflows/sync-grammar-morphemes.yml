name: Sync canonical grammar morphemes

on:
  push:
    paths:
      - '.github/workflows/sync-grammar-morphemes.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical morphemes in lexicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')

          def update_exact(form, old_gloss, new_gloss, old_tag=None, new_tag=None):
              global s
              old = f'<code>{form}</code></td><td class="gloss">{old_gloss}</td>'
              new = f'<code>{form}</code></td><td class="gloss">{new_gloss}</td>'
              if old in s:
                  s = s.replace(old, new, 1)
              if old_tag and new_tag:
                  # Restrict tag replacement to the row containing this form.
                  pat = re.compile(r'(<tr><td class="form"><code>'+re.escape(form)+r'</code>.*?</tr>)')
                  m = pat.search(s)
                  if m and old_tag in m.group(1):
                      row = m.group(1).replace(old_tag, new_tag, 1)
                      s = s[:m.start()] + row + s[m.end():]

          # Redefinitions fixed explicitly by the latest grammar decision.
          update_exact('*-AS', 'verbo activo', 'agentivo')
          update_exact('*-OS', 'verbo intransitivo', 'absolutivo dinámico')
          update_exact('*-IS', 'adjetivo, participio pasivo', 'absolutivo pasivo o absolutivo impersonal')
          update_exact('*E-', 'tiempo imperfecto', 'pretérito arcaico; plenamente funcional con -IS y -ES', '<span class="tag generic">sufijo</span>', '<span class="tag generic">morfema temporal</span>')
          update_exact('*-AJ', 'adverbial', 'plural de -A')
          update_exact('*-AN', 'humano activo', 'humano agentivo')
          update_exact('*-ON', 'humano intransitivo', 'humano no agentivo')
          update_exact('*-OR', 'colectivo', 'participio absolutivo')
          update_exact('*-EL', 'posesivo adjetivo', 'adjetivo directo del nomen')
          update_exact('*-OL', 'adjetivo abundante', 'adjetivo de abundancia o parecido')
          update_exact('*-ER', 'locativo', 'adjetivo primario no derivado')
          update_exact('*-E', 'incontable', 'incontables')

          def section_bounds(section_id):
              start = s.find(f'<section class="lex-section" id="{section_id}">')
              if start < 0:
                  raise SystemExit(f'No se encontró {section_id}')
              end = s.find('</section>', start)
              if end < 0:
                  raise SystemExit(f'Sección sin cierre: {section_id}')
              return start, end

          def has_form(form):
              return f'<code>{form}</code>' in s

          def add_row(section_id, form, gloss, tag='sufijo'):
              global s
              if has_form(form):
                  return
              start, end = section_bounds(section_id)
              tbody_end = s.rfind('</tbody>', start, end)
              if tbody_end < 0:
                  raise SystemExit(f'No se encontró tbody en {section_id}')
              row = (f'<tr><td class="form"><code>{form}</code></td>'
                     f'<td class="gloss">{gloss}</td>'
                     f'<td class="tags"><span class="tag generic">{tag}</span></td></tr>')
              s = s[:tbody_end] + row + s[tbody_end:]

          # Four-way predicative system.
          add_row('sec-e', '*-ES', 'estativo')

          # Modern preterite.
          add_row('sec-a', '*-AJS', 'pretérito moderno agentivo')
          add_row('sec-o', '*-OJS', 'pretérito moderno absolutivo dinámico')

          # Imperfect preterite.
          add_row('sec-e', '*-EVAS', 'pretérito imperfecto agentivo')
          add_row('sec-e', '*-EVOS', 'pretérito imperfecto absolutivo dinámico')
          add_row('sec-e', '*-EVES', 'pretérito imperfecto estativo')
          add_row('sec-e', '*-EVIS', 'pretérito imperfecto absolutivo pasivo o impersonal')

          # Abilitative.
          add_row('sec-o', '*-OVAS', 'abilitativo agentivo')
          add_row('sec-o', '*-OVOS', 'abilitativo absolutivo dinámico')
          add_row('sec-o', '*-OVIS', 'abilitativo absolutivo pasivo o impersonal')

          # Future.
          add_row('sec-e', '*-ESAS', 'futuro agentivo')
          add_row('sec-e', '*-ESOS', 'futuro absolutivo dinámico')
          add_row('sec-e', '*-ESIS', 'futuro absolutivo pasivo o impersonal')

          # Solitive.
          add_row('sec-u', '*-USAS', 'solitivo agentivo')
          add_row('sec-u', '*-USOS', 'solitivo absolutivo dinámico')
          add_row('sec-u', '*-USIS', 'solitivo absolutivo pasivo o impersonal')

          # Conditional / irrealis.
          add_row('sec-u', '*-URAS', 'condicional o irrealis agentivo')
          add_row('sec-u', '*-UROS', 'condicional o irrealis absolutivo dinámico')
          add_row('sec-u', '*-URIS', 'condicional o irrealis absolutivo pasivo o impersonal')

          # Nominal genders/classes.
          add_row('sec-o', '*-O', 'género inanimado')
          add_row('sec-a', '*-A', 'género de dinamismos abstractos y acciones nominalizadas')
          # -ON and -AN already exist and were updated above.
          add_row('sec-a', '*-AR', 'participio agentivo')
          # -OR already exists and was updated above.
          add_row('sec-a', '*-AL', 'género locativo')
          # -E already exists.

          # Adjectival classes.
          # -EL, -OL, -ER updated above.
          add_row('sec-u', '*-UR', 'adjetivo superlativo')

          # Adverbials.
          add_row('sec-u', '*-UK', 'adverbial')
          # -AM already exists.
          add_row('sec-a', '*-AF', 'adverbial')

          # Plural morphology.
          add_row('sec-i', '*-I', 'plural de -O')
          add_row('sec-o', '*-ONI', 'plural de -ON')
          add_row('sec-a', '*-ANI', 'plural de -AN')
          # -AJ is updated above as plural of -A.

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit lexicon sync
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Actualizar morfemas gramaticales del léxico"
          git push
