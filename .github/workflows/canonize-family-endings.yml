name: Canonize family endings
on:
  push:
    paths:
      - '.github/workflows/canonize-family-endings.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonize AJN EJN AJNDA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Morphemes
          mp = Path('lexico/morphemes.json')
          md = json.loads(mp.read_text(encoding='utf-8'))
          morphs = md['morphemes']
          def upsert(payload):
              m = next((x for x in morphs if x.get('id') == payload['id'] or x.get('form') == payload['form']), None)
              if m is None:
                  morphs.append(payload)
              else:
                  m.update(payload)
          upsert({'id':'morph-ajn-family','form':'*-AJN','gloss':'terminación familiar','tags':[{'class':'generic','label':'sufijo familiar'}],'letter':'A','section':'sec-a','etymology':None,'notes':['Atestiguado en la familia AV y en formas familiares como pajn/frajn.'],'row_class':''})
          upsert({'id':'morph-ejn-family','form':'*-EJN','gloss':'variante femenina de -AJN','tags':[{'class':'generic','label':'sufijo familiar femenino'}],'letter':'E','section':'sec-e','etymology':None,'notes':[],'row_class':''})
          upsert({'id':'morph-ajnda-family','form':'*-AJNDA','gloss':'forma abstracta de -AJN','tags':[{'class':'generic','label':'sufijo familiar abstracto'}],'letter':'A','section':'sec-a','etymology':None,'notes':[],'row_class':''})
          mp.write_text(json.dumps(md, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          # Lexicon A
          ap = Path('lexico/a.json')
          ad = json.loads(ap.read_text(encoding='utf-8'))
          av = next((e for e in ad['entries'] if e.get('id') == 'root-av' and e.get('gloss') == 'abuelo'), None)
          if av is None:
              raise SystemExit('canonical AV grandfather root not found')
          av['notes'] = ['-AJN es una terminación familiar; -EJN es su variante femenina; -AJNDA es su forma abstracta. El hipocorístico vavaj permanece lexicalizado hasta que se formalice su patrón.']
          byform = {w.get('form'): w for w in av.get('words', [])}
          byform['avajn'].update({
              'analysis_html':'AV + <a class="morph-link" href="#morph-ajn-family">-AJN</a>',
              'analysis_text':'AV + -AJN',
              'refs':[{'id':'morph-ajn-family','label':'-AJN'}]
          })
          byform['avejn'].update({
              'analysis_html':'AV + <a class="morph-link" href="#morph-ejn-family">-EJN</a>',
              'analysis_text':'AV + -EJN',
              'refs':[{'id':'morph-ejn-family','label':'-EJN'}]
          })
          byform['avajnda'].update({
              'analysis_html':'AV + <a class="morph-link" href="#morph-ajnda-family">-AJNDA</a>',
              'analysis_text':'AV + -AJNDA',
              'refs':[{'id':'morph-ajnda-family','label':'-AJNDA'}]
          })

          # Earlier family forms: document relation without inventing an unconfirmed coalescence rule.
          arc = next((e for e in ad['entries'] if e.get('id') == 'root-arc'), None)
          if arc:
              for w in arc.get('words', []):
                  if w.get('form') == 'arcipajn':
                      w['analysis_html'] = 'ARC + i epentética + PAJ + <a class="morph-link" href="#morph-ajn-family">patrón familiar -AJN</a>'
                      w['analysis_text'] = 'ARC + i epentética + PAJ + patrón familiar -AJN'
                      refs = [r for r in w.get('refs', []) if r.get('id') != 'morph-ajn-family']
                      refs.append({'id':'morph-ajn-family','label':'-AJN'})
                      w['refs'] = refs
                  elif w.get('form') == 'arcifrajn':
                      w['analysis_html'] = 'ARC + i epentética + FRA + <a class="morph-link" href="#morph-ajn-family">patrón familiar -AJN</a>'
                      w['analysis_text'] = 'ARC + i epentética + FRA + patrón familiar -AJN'
                      refs = [r for r in w.get('refs', []) if r.get('id') != 'morph-ajn-family']
                      refs.append({'id':'morph-ajn-family','label':'-AJN'})
                      w['refs'] = refs

          ap.write_text(json.dumps(ad, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          # Grammar
          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          marker = '<h3>4.2. Diminutivo</h3>'
          block = '''  <h3>4.2. Terminaciones familiares</h3>\n  <p><span class="status canon">Canónico</span><code>-AJN</code> es una terminación familiar. <code>-EJN</code> es su variante femenina y <code>-AJNDA</code> constituye su forma abstracta.</p>\n  <p><span class="status canon">Canónico</span>Ejemplos: <code>avajn</code> «abuelo materno», <code>avejn</code> «abuela materna» y <code>avajnda</code> «abolengo, ancestria». El patrón familiar también está atestiguado en formas anteriores como <code>pajn</code> y <code>frajn</code>; no se formalizan aquí procesos de coalescencia adicionales sin decisión explícita.</p>\n\n  <h3>4.3. Diminutivo</h3>'''
          if '<h3>4.2. Terminaciones familiares</h3>' not in g:
              if marker not in g:
                  raise SystemExit('grammar diminutive marker not found')
              g = g.replace(marker, block, 1)
          gp.write_text(g, encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/morphemes.json lexico/index.json gramatica.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Canonizar terminaciones familiares AJN EJN AJNDA"
          git push
