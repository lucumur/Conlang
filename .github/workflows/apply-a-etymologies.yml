name: Apply A-root etymologies

on:
  push:
    paths:
      - '.github/workflows/apply-a-etymologies.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update A roots, etymologies and tag styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html

          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')

          # Global canonical simplification: Español + Portugués -> Iberico.
          s = s.replace('<span class="tag espanol">Español</span>', '<span class="tag iberico">Iberico</span>')
          s = s.replace('<span class="tag portugues">Portugues</span>', '<span class="tag iberico">Iberico</span>')
          # Avoid duplicated Iberico pills when an entry previously carried both tags.
          s = s.replace('<span class="tag iberico">Iberico</span><span class="tag iberico">Iberico</span>', '<span class="tag iberico">Iberico</span>')

          def clean_text(x):
              x = re.sub(r'<[^>]+>', ' ', x)
              x = html.unescape(x)
              return ' '.join(x.split()).strip().lower()

          def row_form(row):
              m = re.search(r'<td class="form"><code(?:\s+[^>]*)?>(.*?)</code>', row, re.S)
              return html.unescape(m.group(1)).strip() if m else ''

          def row_gloss(row):
              m = re.search(r'<span class="root-gloss">(.*?)</span>', row, re.S)
              if m:
                  return clean_text(m.group(1))
              m = re.search(r'<td class="gloss">(.*?)</td><td class="tags">', row, re.S)
              return clean_text(m.group(1)) if m else ''

          def make_tags(lineage, origin):
              cls = {
                  'Nat-Plen':'nat-plen','Nat-Mod':'nat-mod','Nat-Red':'nat-red','Nova':'nova',
                  'Latin':'latin','Italico':'italico','Esper':'esper','Germanico':'germanico',
                  'Iberico':'iberico','Frances':'frances','Arabe':'arabe','Helenico':'helenico',
                  'Anglo':'anglo','Neo':'neo'
              }
              parts = ['<span class="tag generic">Raiz</span>']
              if lineage:
                  parts.append(f'<span class="tag {cls[lineage]}">{lineage}</span>')
              if origin:
                  parts.append(f'<span class="tag {cls[origin]}">{origin}</span>')
              return ''.join(parts)

          # key = (current form, gloss prefix).  Values are canonical decisions from the working table.
          specs = {
              ('*ABL-', 'ser capaz'): ('*EBL-', 'Nat-Plen', 'Italico', 'Esperanto <i>ebla</i> → *EBL-'),
              ('*AG-', 'comportarse'): ('*AG-', 'Nat-Plen', 'Latin', 'Esperanto <i>agi</i> → *AG-'),
              ('*AG-', 'gran'): ('*AG-', 'Nat-Mod', 'Esper', 'Esperanto <i>-eg- / ega</i> → *AG-'),
              ('*AGL-', 'aguila'): ('*AGL-', 'Nat-Plen', None, 'Esperanto <i>aglo</i> → *AGL-'),
              ('*AJN-', 'cualquiera'): ('*AJN-', 'Nat-Plen', 'Germanico', 'Esperanto <i>ajn</i> → *AJN-'),
              ('*AĈ-', 'escoria'): ('*AĈ-', 'Nat-Plen', 'Esper', 'Esperanto <i>aĉ- / aĉa</i> → *AĈ-'),
              ('*AĜ-', 'envejecer'): ('*AĜ-', 'Nat-Plen', 'Anglo', 'Esperanto <i>aĝo</i> → *AĜ-'),
              ('*AJ-', 'hacer'): ('*AJ-', 'Nat-Mod', 'Esper', 'Esperanto <i>agi</i> → *AJ-'),
              ('*AL-', 'alto'): ('*AL-', 'Nat-Mod', 'Latin', 'Esperanto <i>alta</i> → *AL-'),
              ('*AL-', 'otro'): ('*AL-', 'Nat-Mod', 'Latin', 'Esperanto <i>alia</i> → *AL-'),
              ('*ALB-', 'blanco'): ('*ALB-', 'Nat-Red', 'Latin', 'Esperanto <i>albino</i> → *ALB-'),
              ('*ALC-', 'ajo'): ('*ALC-', 'Nat-Mod', 'Iberico', 'Esperanto <i>ajlo</i> → *ALC-'),
              ('*ALJ-', 'alearse'): ('*ALJ-', 'Nat-Red', 'Frances', 'Esperanto <i>aliĝi</i> → *ALJ-'),
              ('*ALK-', 'alcali'): ('*ALK-', 'Nat-Red', 'Arabe', 'Esperanto <i>alkalo</i> → *ALK-'),
              ('*ALM-', 'respirar'): ('*ALM-', 'Nova', 'Latin', 'de novo; latín <i>anima</i> → <i>anma</i> → *ALM-'),
              ('*ALUM-', 'alumbre'): ('*ALUM-', 'Nat-Mod', 'Latin', 'Esperanto <i>aluno</i> → *ALUM-'),
              ('*AM-', 'amar'): ('*AM-', 'Nat-Plen', 'Latin', 'Esperanto <i>ami</i> → *AM-'),
              ('*AMBR-', 'ambar'): ('*AMBR-', 'Nat-Plen', 'Frances', 'Esperanto <i>ambro</i> → *AMBR-'),
              ('*AMER-', 'america'): ('*AMER-', 'Nat-Red', 'Italico', 'Esperanto <i>Ameriko</i> → *AMER-'),
              ('*AND-', 'andes'): ('*AND-', 'Nat-Plen', 'Iberico', 'Esperanto <i>Andoj</i> → *AND-'),
              ('*ANG-', 'angor'): ('*ANG-', 'Nat-Red', 'Latin', 'Esperanto <i>angoro</i> → *ANG-'),
              ('*ANG-', 'angulo'): ('*ANG-', 'Nat-Red', 'Latin', 'Esperanto <i>angulo</i> → *ANG-'),
              ('*ANGL-', 'ingles'): ('*ANGL-', 'Nat-Plen', 'Anglo', 'Esperanto <i>angla</i> → *ANGL-'),
              ('*ANS-', 'pato'): ('*ANS-', 'Nat-Mod', 'Latin', 'Esperanto <i>anaso</i> → *ANS-'),
              ('*ANT-', 'anterior'): ('*ANT-', 'Nat-Red', 'Latin', 'Esperanto <i>antaŭ</i> → *ANT-'),
              ('*ANĜ-', 'angel'): ('*ANĜ-', 'Nat-Red', 'Italico', 'Esperanto <i>anĝelo</i> → *ANĜ-'),
              ('*APOL-', 'apolo'): ('*APOL-', 'Nat-Red', 'Helenico', 'Esperanto <i>Apolono</i> → *APOL-'),
              ('*APR-', 'afrodita'): ('*AFRU-', 'Nat-Red', 'Helenico', 'Esperanto <i>Afrodito</i> → *AFRU-'),
              ('*APU-', 'a un lado'): ('*APU-', 'Nat-Mod', 'Latin', 'Esperanto <i>apud</i> → *APU-'),
              ('*APR-', 'aparecer'): ('*APR-', 'Nat-Red', 'Frances', 'Esperanto <i>aperi</i> → *APR-'),
              ('*AR-', 'aire'): ('*AR-', 'Nat-Mod', 'Italico', 'Esperanto <i>aero</i> → *AR-'),
              ('*ARB-', 'arbol'): ('*ARB-', 'Nat-Plen', 'Latin', 'Esperanto <i>arbo</i> → *ARB-'),
              ('*ARC-A', 'regir'): ('*ARC-A', 'Nova', 'Helenico', 'de novo; griego <i>arkhes</i> → *ARC-A'),
              ('*ARG-', 'argon'): ('*ARG-', 'Nat-Red', 'Helenico', 'Esperanto <i>argono</i> → *ARG-'),
              ('*ARI-', 'arido'): ('*ARI-', 'Nat-Red', 'Latin', 'Esperanto <i>arida</i> → *ARI-'),
              ('*ARK-', 'guardar'): ('*ARK-', 'Nova', 'Latin', 'de novo; latín <i>arca</i> → *ARK-'),
              ('*ARĈ-', 'arquear'): ('*ARĈ-', 'Nat-Plen', 'Frances', 'Esperanto <i>arĉo</i> → *ARĈ-'),
              ('*ARĜ-', 'plata'): ('*ARĜ-', 'Nat-Red', 'Italico', 'Esperanto <i>arĝento</i> → *ARĜ-'),
              ('*ARẐ-', 'articular, embonar'): ('*ARẐ-', 'Nat-Mod', 'Italico', 'Esperanto <i>artiko</i> → <i>artko</i> → *ARẐ-'),
              ('*AS-TR', 'estrella'): ('*AS-TR', 'Nat-Plen', 'Helenico', 'Esperanto <i>astro</i> → *AS-TR'),
              ('*ASP-R', 'aspero'): ('*ASP-R', 'Nat-Plen', 'Italico', 'Esperanto <i>aspra</i> → *ASP-R'),
              ('*ATL-', 'competir'): ('*AΘL-', 'Nat-Mod', 'Helenico', 'Esperanto <i>atleto</i> → *AΘL-'),
              ('*AV-', 'abuelo'): ('*AV-', 'Nat-Plen', 'Latin', 'Esperanto <i>avo</i> → *AV-'),
              ('*AV-', 'avellana'): ('*AV-', 'Nat-Red', 'Italico', 'Esperanto <i>avelo</i> → *AV-'),
              ('*AV-', 'tener'): ('*AV-', 'Nat-Mod', 'Italico', 'Esperanto <i>havi</i> → *AV-'),
              ('*AZ-', 'burro'): ('*AZ-', 'Nat-Red', 'Italico', 'Esperanto <i>azeno</i> → *AZ-'),
              ('*AZ-', 'nitrogeno'): ('*AZ-', 'Nat-Red', 'Frances', 'Esperanto <i>azoto</i> → *AZ-'),
              ('*AŜV-', 'agua'): ('*ASV-', 'Nat-Mod', 'Neo', 'Esperanto <i>akvo</i> → *ASV-'),
              ('*AVG-', 'agosto'): ('*AVG-', 'Nat-Red', 'Latin', 'Esperanto <i>aŭgusto</i> → *AVG-'),
          }

          a0 = s.index('<section class="lex-section" id="sec-a">')
          a1 = s.index('<section class="lex-section" id="sec-b">')
          before, sec, after = s[:a0], s[a0:a1], s[a1:]

          found = set()
          out = []
          pos = 0
          for m in re.finditer(r'<tr(?:\s+[^>]*)?>.*?</tr>', sec, re.S):
              out.append(sec[pos:m.start()])
              row = m.group(0)
              key = (row_form(row), row_gloss(row).split(' ⭐')[0])
              spec = specs.get(key)
              if spec:
                  found.add(key)
                  newform, lineage, origin, ety = spec
                  # Rename first form only.
                  row = re.sub(r'(<td class="form"><code(?:\s+[^>]*)?>).*?(</code>)', lambda mm: mm.group(1)+newform+mm.group(2), row, count=1, flags=re.S)
                  # Replace/add etymology note in the root gloss cell.
                  row = re.sub(r'<div class="entry-note etymology">.*?</div>', '', row, flags=re.S)
                  note = '<div class="entry-note etymology">Etimología: '+ety+'</div>'
                  if '<span class="root-gloss">' in row:
                      row = re.sub(r'(</span>)(?=<details class="derived-panel">|<details class="suffix-repertoire|</td>)', r'\1'+note, row, count=1)
                  else:
                      row = row.replace('</td><td class="tags">', note+'</td><td class="tags">', 1)
                  # Canonical tag set: structural + lineage + ultimate source.
                  row = re.sub(r'<td class="tags">.*?</td></tr>$', '<td class="tags">'+make_tags(lineage, origin)+'</td></tr>', row, count=1, flags=re.S)
              out.append(row)
              pos = m.end()
          out.append(sec[pos:])
          sec = ''.join(out)

          missing = [k for k in specs if k not in found and k[0] != '*APR-' or False]
          # AFR- is a new root explicitly derived from Esperanto Afriko.
          if '*AFR-' not in sec:
              afr = '<tr><td class="form"><code>*AFR-</code></td><td class="gloss">Africa<div class="entry-note etymology">Etimología: Esperanto <i>Afriko</i> → *AFR-</div></td><td class="tags">'+make_tags('Nat-Red','Italico')+'</td></tr>'
              marker = '<tr><td class="form"><code>*APU-</code>'
              idx = sec.find(marker)
              if idx < 0:
                  raise SystemExit('No se encontró punto de inserción para *AFR-')
              sec = sec[:idx] + afr + sec[idx:]

          s = before + sec + after

          # Merge the renamed *EBL- family with the pre-existing *EBL- "posible" entry in section E.
          # Preserve all already documented derived words; only the root identity and provenance change here.
          a0 = s.index('<section class="lex-section" id="sec-a">')
          a1 = s.index('<section class="lex-section" id="sec-b">')
          asec = s[a0:a1]
          m = re.search(r'<tr class="lex-root-row"><td class="form"><code>\*EBL-</code></td>.*?</tr>', asec, re.S)
          if not m:
              raise SystemExit('No se encontró la familia renombrada *EBL- en A')
          ebl_row = m.group(0)
          asec = asec[:m.start()] + asec[m.end():]
          s = s[:a0] + asec + s[a1:]

          e0 = s.index('<section class="lex-section" id="sec-e">')
          e1 = s.index('<section class="lex-section" id="sec-f">')
          esec = s[e0:e1]
          old = re.search(r'<tr><td class="form"><code>\*EBL-</code></td><td class="gloss">posible</td><td class="tags">.*?</td></tr>', esec, re.S)
          if not old:
              raise SystemExit('No se encontró la entrada previa *EBL- = posible')
          ebl_row = ebl_row.replace('<span class="root-gloss">ser capaz</span>', '<span class="root-gloss">ser capaz; posible</span>', 1)
          esec = esec[:old.start()] + ebl_row + esec[old.end():]
          s = s[:e0] + esec + s[e1:]

          p.write_text(s, encoding='utf-8')

          # Tag colors for the newly canonical categories.
          sp = Path('styles.css')
          css = sp.read_text(encoding='utf-8')
          anchor = '.tag.nat-mod{background:#cdebd6}'
          if '.tag.nat-red{' not in css:
              css = css.replace(anchor, anchor+'.tag.nat-red{background:#d8eef0}', 1)
          if '.tag.iberico{' not in css:
              css = css.replace('.tag.portugues{background:#dff1da}', '.tag.portugues{background:#dff1da}.tag.iberico{background:#ffe4b5}', 1)
          if '.tag.helenico{' not in css:
              css = css.replace('.tag.griego{background:#e9ddff}', '.tag.griego{background:#e9ddff}.tag.helenico{background:#e9ddff}', 1)
          if '.tag.esper{' not in css:
              css = css.replace('.tag.anglo{background:#d8ebff}', '.tag.anglo{background:#d8ebff}.tag.esper{background:#e7e5e4}.tag.neo{background:#eef2ff}', 1)
          sp.write_text(css, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html styles.css
          git commit -m "Actualizar raíces A con etimologías y etiquetas"
          git push
