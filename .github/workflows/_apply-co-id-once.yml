name: Apply CO and ID once
on:
  push:
    paths:
      - '.github/workflows/_apply-co-id-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update CO, ID and ALM analyses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 1) Canonical root *CO- = alto, sacro. Leave *CO-T untouched.
          cpath = 'lexico/c.json'
          c = load(cpath)
          entries = c['entries']
          co = next((e for e in entries if e.get('id') == 'root-co'), None)
          if co is None:
              co = {
                  'id': 'root-co',
                  'form': '*CO-',
                  'gloss': 'alto, sacro',
                  'tags': [{'class': 'generic', 'label': 'Raiz'}],
                  'letter': 'C',
                  'section': 'sec-c',
                  'etymology': None,
                  'notes': [],
                  'row_class': '',
                  'words': []
              }
              pos = next((i for i,e in enumerate(entries) if e.get('id') == 'root-co-t'), len(entries))
              entries.insert(pos, co)
          else:
              co['form'] = '*CO-'
              co['gloss'] = 'alto, sacro'
          save(cpath, c)

          # 2) Redefine *-ID-.
          mpath = 'lexico/morphemes.json'
          m = load(mpath)
          mid = next(x for x in m['morphemes'] if x.get('id') == 'morph-id')
          mid['form'] = '*-ID-'
          mid['gloss'] = 'subclase, diminutivo'
          save(mpath, m)

          # 3) Resolve ALM analyses.
          apath = 'lexico/a.json'
          a = load(apath)
          alm = next(e for e in a['entries'] if e.get('id') == 'root-alm')
          words = {w['id']: w for w in alm.get('words', [])}

          w = words['lexeme-coalma']
          w['analysis_html'] = '<a class="morph-link" href="#root-co">CO</a> + ALM + <a class="morph-link" href="#morph-a-2">-A</a>'
          w['analysis_text'] = 'CO + ALM + -A'
          w['refs'] = [
              {'id': 'root-co', 'label': 'CO'},
              {'id': 'morph-a-2', 'label': '-A'}
          ]

          w = words['lexeme-nujalmida']
          w['analysis_html'] = '<a class="morph-link" href="#root-nu-j">NU-J</a> + ALM + <a class="morph-link" href="#morph-id">-ID-</a> + <a class="morph-link" href="#morph-a-2">-A</a>'
          w['analysis_text'] = 'NU-J + ALM + -ID- + -A'
          w['refs'] = [
              {'id': 'root-nu-j', 'label': 'NU-J'},
              {'id': 'morph-id', 'label': '-ID-'},
              {'id': 'morph-a-2', 'label': '-A'}
          ]

          w = words['lexeme-almidaj']
          w['analysis_html'] = 'ALM + <a class="morph-link" href="#morph-id">-ID-</a> + <a class="morph-link" href="#morph-aj">-AJ</a>'
          w['analysis_text'] = 'ALM + -ID- + -AJ'
          w['refs'] = [
              {'id': 'morph-id', 'label': '-ID-'},
              {'id': 'morph-aj', 'label': '-AJ'}
          ]
          save(apath, a)
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_apply-co-id-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexico/a.json lexico/c.json lexico/morphemes.json lexico/index.json .github/workflows/_apply-co-id-once.yml
          git commit -m 'Canonizar CO e ID y resolver ALM'
          git push
