name: Add ALT lexical family
on:
  push:
    paths:
      - '.github/workflows/add-alt-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ALT root and repertoire
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          def tag(label, cls='generic'):
              return {"class": cls, "label": label}

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          entries = {e['id']: e for e in data['entries']}
          root = entries['root-al']
          root['form'] = '*ALT-'
          root['gloss'] = 'alto'
          root['tags'] = [tag('Raiz'), tag('Nat-Plen','nat-plen'), tag('Latin','latin')]
          root['etymology'] = 'Etym. Eo. alta → *ALT-'
          root['row_class'] = 'lex-root-row'
          root['words'] = [
              {
                  "id":"lexeme-alter",
                  "form":"alter",
                  "gloss":"alto, elevado",
                  "analysis_html":"ALT + <a class=\"morph-link\" href=\"#morph-er\">-ER</a>",
                  "analysis_text":"ALT + -ER",
                  "refs":[{"id":"morph-er","label":"-ER"}],
                  "tags":[tag('Adjetivo ER')]
              },
              {
                  "id":"lexeme-altezha",
                  "form":"alteẑa",
                  "gloss":"altura, tamaño",
                  "analysis_html":"ALT + <a class=\"morph-link\" href=\"#morph-eza\">-EẐA</a>",
                  "analysis_text":"ALT + -EẐA",
                  "refs":[{"id":"morph-eza","label":"-EẐA"}],
                  "tags":[tag('Nomen abstracto')]
              },
              {
                  "id":"lexeme-altala",
                  "form":"altala",
                  "gloss":"elevacion, altitud",
                  "analysis_html":"ALT + <a class=\"morph-link\" href=\"#morph-al-3\">-AL</a> + <a class=\"morph-link\" href=\"#morph-a-2\">-A</a>",
                  "analysis_text":"ALT + -AL + -A",
                  "refs":[{"id":"morph-al-3","label":"-AL"},{"id":"morph-a-2","label":"-A"}],
                  "tags":[tag('Nomen A')]
              },
              {
                  "id":"lexeme-altaf",
                  "form":"altaf",
                  "gloss":"arriba",
                  "analysis_html":"ALT + <a class=\"morph-link\" href=\"#morph-af\">-AF</a>",
                  "analysis_text":"ALT + -AF",
                  "refs":[{"id":"morph-af","label":"-AF"}],
                  "tags":[tag('Adverbio AF')]
              }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['python','scripts/build_lexicon_index.py'], check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json
          git commit -m "Actualizar raíz ALT y su repertorio"
          git push
