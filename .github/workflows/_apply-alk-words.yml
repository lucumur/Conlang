name: Apply ALK words
on:
  push:
    paths:
      - '.github/workflows/_apply-alk-words.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ALK lexicon and index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-alk')
          words = root.setdefault('words', [])
          by_id = {w.get('id'): w for w in words}

          alkol = {
              'id': 'lexeme-alkol',
              'form': 'alkol',
              'gloss': 'alcalino',
              'analysis_html': 'ALK + <a class="morph-link" href="#morph-ol-2">-OL</a>',
              'analysis_text': 'ALK + -OL',
              'refs': [{'id': 'morph-ol-2', 'label': '-OL'}],
              'tags': [{'class': 'generic', 'label': 'Adjetivo OL'}]
          }
          alkale = {
              'id': 'lexeme-alkale',
              'form': 'alkale',
              'gloss': 'potasa',
              'analysis_html': '',
              'analysis_text': '',
              'refs': [],
              'tags': []
          }

          for item in (alkol, alkale):
              if item['id'] in by_id:
                  by_id[item['id']].update(item)
              else:
                  words.append(item)

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_apply-alk-words.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json .github/workflows/_apply-alk-words.yml
          git commit -m "Añadir palabras de ALK"
          git push
