name: Fix AND etymology
on:
  push:
    paths:
      - '.github/workflows/fix-and-etymology.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix AND row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')
          pat=re.compile(r'<tr><td class="form"><code id="root-and">\*AND-</code></td><td class="gloss">Andes(?P<details><details class="suffix-repertoire root-repertoire-static">.*?</details>)</td><td class="tags">.*?</td></tr>',re.S)
          m=pat.search(s)
          if not m:
              raise SystemExit('No se encontró *AND-')
          row='<tr><td class="form"><code id="root-and">*AND-</code></td><td class="gloss">Andes<div class="entry-note etymology">Etimología: Esperanto <i>Andoj</i> → *AND-</div>'+m.group('details')+'</td><td class="tags"><span class="tag generic">Raiz</span><span class="tag nat-plen">Nat-Plen</span><span class="tag iberico">Iberico</span></td></tr>'
          s=s[:m.start()]+row+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Corregir etimología y etiquetas de AND"
          git push
