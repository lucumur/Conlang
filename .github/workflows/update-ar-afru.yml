name: Update AR and AFRU
on:
  push:
    paths:
      - '.github/workflows/update-ar-afru.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lexical families
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          by_id = {e.get('id'): e for e in data.get('entries', [])}

          ar = by_id['root-ar']
          ar['row_class'] = 'lex-root-row'
          ar['words'] = [
            {
              'id':'lexeme-aronas','form':'aronas','gloss':'ventilar',
              'analysis_html':'AR + <span title="formante provisional">-ON-</span> + <a class="morph-link" href="#morph-as">-AS</a>',
              'analysis_text':'AR + -ON- (extensión verbal provisional) + -AS',
              'refs':[{'id':'morph-as','label':'-AS'}],
              'tags':[{'class':'generic','label':'Predicado AS'}],
              'semantic_fields':['aire','ventilación','circulación']
            },
            {
              'id':'lexeme-are','form':'are','gloss':'aire',
              'analysis_html':'AR + <a class="morph-link" href="#morph-e">-E</a>',
              'analysis_text':'AR + -E',
              'refs':[{'id':'morph-e','label':'-E'}],
              'tags':[{'class':'generic','label':'Nomen E'}],
              'semantic_fields':['aire','atmósfera','sustancias']
            },
            {
              'id':'lexeme-arel','form':'arel','gloss':'aéreo',
              'analysis_html':'AR + <a class="morph-link" href="#morph-el">-EL</a>',
              'analysis_text':'AR + -EL',
              'refs':[{'id':'morph-el','label':'-EL'}],
              'tags':[{'class':'generic','label':'Adjetivo EL'}],
              'semantic_fields':['aire','espacio','aeronáutica']
            }
          ]

          afru = by_id['root-afru']
          afru['row_class'] = 'lex-root-row'
          afru['words'] = [
            {
              'id':'lexeme-afrun','form':'afrun','gloss':'Afrodita',
              'analysis_html':'AFRU + <span title="lexicalizado">-n lexicalizado</span>',
              'analysis_text':'AFRU + -n lexicalizado',
              'refs':[],
              'tags':[{'class':'generic','label':'Nombre propio'}],
              'semantic_fields':['mitología','divinidades','amor']
            },
            {
              'id':'lexeme-afrusma','form':'afrusma','gloss':'vigor sexual femenino',
              'analysis_html':'AFRU + <span title="formante provisional">-SM-</span> + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text':'AFRU + -SM- (formante provisional) + -A',
              'refs':[{'id':'morph-a-2','label':'-A'}],
              'tags':[{'class':'generic','label':'Nomen A'}],
              'semantic_fields':['sexualidad','vigor','femenino']
            },
            {
              'id':'lexeme-afrulunda','form':'afrulunda','gloss':'abril',
              'analysis_html':'AFRU + <a class="morph-link" href="#root-lun">LUN</a> + <span title="formante calendárico provisional">-DA</span>',
              'analysis_text':'AFRU + LUN + -DA (formante calendárico provisional)',
              'refs':[{'id':'root-lun','label':'LUN'}],
              'tags':[{'class':'generic','label':'Nomen calendárico'}],
              'semantic_fields':['calendario','meses','primavera']
            },
            {
              'id':'lexeme-afrudur','form':'afrudur','gloss':'afrodisíaco',
              'analysis_html':'AFRU + <span title="formante estimulativo provisional">-DUR</span>',
              'analysis_text':'AFRU + -DUR (formante estimulativo provisional)',
              'refs':[],
              'tags':[{'class':'generic','label':'Derivado adjetival'}],
              'semantic_fields':['sexualidad','estimulación','deseo']
            }
          ]

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/update-ar-afru.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Añadir repertorios de AR y AFRU"
          git push
