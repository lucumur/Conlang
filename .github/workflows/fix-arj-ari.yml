name: Unify ARI and ARJ
on:
  push:
    paths:
      - '.github/workflows/fix-arj-ari.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify duplicate arid root
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lexico/a.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entries = data['entries']
          ari = next(e for e in entries if e.get('id') == 'root-ari')
          arj = next(e for e in entries if e.get('id') == 'root-arj')

          if ari.get('words'):
              raise SystemExit('root-ari unexpectedly has words; refusing automatic merge')

          # ARJ is the current canonical spelling; preserve its repertory and merge metadata from old ARI.
          seen = {(t.get('class'), t.get('label')) for t in arj.get('tags', [])}
          for tag in ari.get('tags', []):
              key = (tag.get('class'), tag.get('label'))
              if key not in seen:
                  arj.setdefault('tags', []).append(tag)
                  seen.add(key)

          if ari.get('etymology'):
              arj['etymology'] = ari['etymology'].replace('*ARI-', '*ARJ-')

          for note in ari.get('notes', []):
              if note not in arj.setdefault('notes', []):
                  arj['notes'].append(note)

          entries[:] = [e for e in entries if e.get('id') != 'root-ari']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Redirect any references elsewhere from the obsolete duplicate to canonical ARJ.
          for p in Path('lexico').glob('*.json'):
              if p.name == 'index.json':
                  continue
              obj = json.loads(p.read_text(encoding='utf-8'))
              changed = False
              for entry in obj.get('entries', []):
                  for word in entry.get('words', []):
                      had_old_ref = False
                      for ref in word.get('refs', []):
                          if ref.get('id') == 'root-ari':
                              ref['id'] = 'root-arj'
                              ref['label'] = 'ARJ'
                              had_old_ref = True
                              changed = True
                      if had_old_ref:
                          if isinstance(word.get('analysis_html'), str):
                              word['analysis_html'] = word['analysis_html'].replace('#root-ari', '#root-arj').replace('>ARI<', '>ARJ<')
                          if isinstance(word.get('analysis_text'), str):
                              word['analysis_text'] = word['analysis_text'].replace('ARI', 'ARJ')
              if changed:
                  p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/fix-arj-ari.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/*.json .github/workflows/fix-arj-ari.yml
          git commit -m "Unificar ARI con ARJ"
          git push
