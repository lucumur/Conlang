name: Update ARCH family
on:
  push:
    paths:
      - '.github/workflows/update-arch-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lexical family and morphology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-arc-2')
          root['gloss'] = 'arco'
          root['row_class'] = 'lex-root-row'
          root['words'] = [
            {
              'id':'lexeme-archas','form':'arĉas','gloss':'arquear',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-as">-AS</a>',
              'analysis_text':'ARĈ + -AS',
              'refs':[{'id':'morph-as','label':'-AS'}],
              'tags':[{'class':'generic','label':'Predicado AS'}],
              'semantic_fields':['curvatura','forma','transformación']
            },
            {
              'id':'lexeme-archos','form':'arĉos','gloss':'arquearse',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-os">-OS</a>',
              'analysis_text':'ARĈ + -OS',
              'refs':[{'id':'morph-os','label':'-OS'}],
              'tags':[{'class':'generic','label':'Predicado OS'}],
              'semantic_fields':['curvatura','cambio de estado','forma']
            },
            {
              'id':'lexeme-archutas','form':'arĉutas','gloss':'disparar un arco',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-ut">-UT-</a> + <a class="morph-link" href="#morph-as">-AS</a>',
              'analysis_text':'ARĈ + -UT- + -AS',
              'refs':[{'id':'morph-ut','label':'-UT-'},{'id':'morph-as','label':'-AS'}],
              'tags':[{'class':'generic','label':'Predicado AS'}],
              'semantic_fields':['arquería','armas','tiro']
            },
            {
              'id':'lexeme-archir','form':'arĉir','gloss':'arqueado',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-ir-reservative">-IR</a>',
              'analysis_text':'ARĈ + -IR',
              'refs':[{'id':'morph-ir-reservative','label':'-IR'}],
              'tags':[{'class':'generic','label':'Adjetivo IR'}],
              'semantic_fields':['curvatura','forma','geometría']
            },
            {
              'id':'lexeme-archo','form':'arĉo','gloss':'arco',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-o">-O</a>',
              'analysis_text':'ARĈ + -O',
              'refs':[{'id':'morph-o','label':'-O'}],
              'tags':[{'class':'generic','label':'Nomen O'}],
              'semantic_fields':['arcos','armas','geometría']
            },
            {
              'id':'lexeme-archistan','form':'arĉistan','gloss':'arquero',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-ist">-IST</a> + <a class="morph-link" href="#morph-an-2">-AN</a>',
              'analysis_text':'ARĈ + -IST + -AN',
              'refs':[{'id':'morph-ist','label':'-IST'},{'id':'morph-an-2','label':'-AN'}],
              'tags':[{'class':'generic','label':'Humano AN'}],
              'semantic_fields':['arquería','oficios','armas']
            },
            {
              'id':'lexeme-archuta','form':'arĉuta','gloss':'arquería',
              'analysis_html':'ARĈ + <a class="morph-link" href="#morph-ut">-UT-</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text':'ARĈ + -UT- + -A',
              'refs':[{'id':'morph-ut','label':'-UT-'},{'id':'morph-a-2','label':'-A'}],
              'tags':[{'class':'generic','label':'Nomen A'}],
              'semantic_fields':['arquería','deportes','armas']
            }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mp = Path('lexico/morphemes.json')
          mdata = json.loads(mp.read_text(encoding='utf-8'))
          old_ut = next((m for m in mdata['morphemes'] if m.get('id') == 'morph-utas'), None)
          if old_ut:
              old_ut['id'] = 'morph-ut'
              old_ut['form'] = '*-UT-'
              old_ut['gloss'] = 'uso instrumental o actividad realizada mediante el referente de la base (provisional)'
              old_ut['notes'] = [
                'Reanálisis provisional de *-UTAS «utilizar» como *-UT- + -AS.',
                'Ejemplos: arĉutas «disparar un arco» y arĉuta «arquería».'
              ]
          ir = next(m for m in mdata['morphemes'] if m.get('id') == 'morph-ir-reservative')
          ir['gloss'] = 'adjetivo resultativo o estativo: estado resultante o caracterizado por la base (provisional)'
          ir['notes'] = [
            'Generalización provisional a partir de arkir «secreto» (< guardado/oculto) y arĉir «arqueado».',
            'El valor específico depende de la semántica de la raíz.'
          ]
          mp.write_text(json.dumps(mdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          needle = '<tr><td><code>-LE</code></td><td>derivador deverbal; función semántica formal todavía abierta</td></tr>'
          add = needle + '\n    <tr><td><code>-UT-</code></td><td><span class="status prov">Provisional</span>uso instrumental o actividad realizada mediante el referente de la base; <code>arĉutas</code> «disparar un arco», <code>arĉuta</code> «arquería»</td></tr>'
          if needle in g and '<code>-UT-</code></td>' not in g:
              g = g.replace(needle, add)
          needle2 = '<tr><td><code>-OR</code></td><td>adjetivo de grado superior o superlativo</td></tr>'
          add2 = needle2 + '\n    <tr><td><code>-IR</code></td><td><span class="status prov">Provisional</span>adjetivo resultativo o estativo; expresa un estado resultante o caracterizado por la raíz</td></tr>'
          if needle2 in g and '<code>-IR</code></td>' not in g:
              g = g.replace(needle2, add2)
          gp.write_text(g, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/update-arch-family.yml
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/morphemes.json gramatica.html .github/workflows/update-arch-family.yml
          git commit -m "Añadir repertorio de ARĈ y revisar UT e IR"
          git push
