name: Update ARJ family
on:
  push:
    paths:
      - '.github/workflows/update-arj-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ARJ family
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def tag(label, cls='generic'):
              return {'class': cls, 'label': label}

          # --- lexico/a.json ---
          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          entries = data.setdefault('entries', [])
          arj = next((e for e in entries if e.get('id') == 'root-arj' or e.get('form') == '*ARJ-'), None)
          if arj is None:
              arj = {
                'id':'root-arj',
                'form':'*ARJ-',
                'gloss':'arido',
                'tags':[tag('Raiz')],
                'letter':'A',
                'section':'sec-a',
                'etymology':None,
                'notes':[],
                'row_class':'lex-root-row',
                'words':[]
              }
              # Insert after ARG if present, otherwise append.
              idx = next((i for i,e in enumerate(entries) if e.get('id') == 'root-arg'), None)
              if idx is None:
                  entries.append(arj)
              else:
                  entries.insert(idx + 1, arj)
          else:
              arj['form'] = '*ARJ-'
              arj['gloss'] = 'arido'
              arj['row_class'] = 'lex-root-row'

          territorial_id = 'morph-on-territorial'
          arj['words'] = [
            {
              'id':'lexeme-arjol',
              'form':'arjol',
              'gloss':'arido, seco',
              'analysis_html':'ARJ + <a class="morph-link" href="#morph-ol-2">-OL</a>',
              'analysis_text':'ARJ + -OL',
              'refs':[{'id':'morph-ol-2','label':'-OL'}],
              'tags':[tag('Adjetivo OL')],
              'semantic_fields':['sequedad','clima','propiedades físicas']
            },
            {
              'id':'lexeme-arjolda',
              'form':'arjolda',
              'gloss':'aridez',
              'analysis_html':'ARJ + <a class="morph-link" href="#morph-olda">-OLDA</a>',
              'analysis_text':'ARJ + -OLDA',
              'refs':[{'id':'morph-olda','label':'-OLDA'}],
              'tags':[tag('Abstracto OLDA')],
              'semantic_fields':['sequedad','cualidades','clima']
            },
            {
              'id':'lexeme-arjeva',
              'form':'arjeva',
              'gloss':'sequia',
              'analysis_html':'ARJ + <a class="morph-link" href="#morph-ev">-EV-</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text':'ARJ + -EV- + -A',
              'refs':[{'id':'morph-ev','label':'-EV-'},{'id':'morph-a-2','label':'-A'}],
              'tags':[tag('Nomen A')],
              'semantic_fields':['sequía','clima','meteorología']
            },
            {
              'id':'lexeme-arjonal',
              'form':'arjonal',
              'gloss':'desierto',
              'analysis_html':'ARJ + <a class="morph-link" href="#morph-on-territorial">-ON-</a> + <a class="morph-link" href="#morph-al-3">-AL</a>',
              'analysis_text':'ARJ + -ON- + -AL',
              'refs':[{'id':territorial_id,'label':'-ON-'},{'id':'morph-al-3','label':'-AL'}],
              'tags':[tag('Locativo AL')],
              'semantic_fields':['desiertos','biomas','geografía']
            },
            {
              'id':'lexeme-arjonatel',
              'form':'arjonatel',
              'gloss':'desertico',
              'analysis_html':'ARJ + <a class="morph-link" href="#morph-on-territorial">-ONAT-</a> + <a class="morph-link" href="#morph-el">-EL</a>',
              'analysis_text':'ARJ + -ONAT- + -EL',
              'refs':[{'id':territorial_id,'label':'-ONAT-'},{'id':'morph-el','label':'-EL'}],
              'tags':[tag('Adjetivo EL')],
              'semantic_fields':['desiertos','biomas','geografía']
            }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- provisional territorial formant ---
          mp = Path('lexico/morphemes.json')
          mdata = json.loads(mp.read_text(encoding='utf-8'))
          morphs = mdata.setdefault('morphemes', [])
          m = {
            'id': territorial_id,
            'form':'*-ON- / *-ONAT-',
            'gloss':'formante territorial o de extensión natural; -ONAT- como variante relacional ante -EL (provisional)',
            'tags':[tag('morfema'), tag('Provisional')],
            'letter':'O',
            'section':'sec-o',
            'etymology':None,
            'notes':['Análisis provisional inferido de arjonal «desierto» y arjonatel «desértico». Puede revisarse cuando aparezcan más ejemplos.'],
            'row_class':''
          }
          for i, old in enumerate(morphs):
              if old.get('id') == territorial_id:
                  morphs[i] = m
                  break
          else:
              morphs.append(m)
          mp.write_text(json.dumps(mdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python scripts/build_lexicon_index.py
          git rm .github/workflows/update-arj-family.yml

      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Añadir repertorio de ARJ"
          git push
