name: Apply ERZ once
on:
  push:
    paths:
      - '.github/workflows/_apply-erz-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update ERZ morpheme and alurze analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('lexico/morphemes.json')
          data = json.loads(mp.read_text(encoding='utf-8'))
          morphemes = data['morphemes']
          existing = next((m for m in morphemes if m.get('id') == 'morph-erz' or m.get('form') == '*-ERZ-'), None)
          if existing:
              existing['id'] = 'morph-erz'
              existing['form'] = '*-ERZ-'
              existing['gloss'] = 'metal'
              existing['tags'] = [{'class':'generic','label':'sufijo'}]
              existing['letter'] = 'E'
              existing['section'] = 'sec-e'
          else:
              morphemes.append({
                  'id':'morph-erz','form':'*-ERZ-','gloss':'metal',
                  'tags':[{'class':'generic','label':'sufijo'}],
                  'letter':'E','section':'sec-e','etymology':None,'notes':[],'row_class':''
              })
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ap = Path('lexico/a.json')
          a = json.loads(ap.read_text(encoding='utf-8'))
          root = next(e for e in a['entries'] if e.get('id') == 'root-alu')
          w = next(w for w in root['words'] if w.get('id') == 'lexeme-alurze')
          w['analysis_html'] = 'ALU + <a class="morph-link" href="#morph-erz">-ERZ-</a> + <a class="morph-link" href="#morph-e">-E</a>'
          w['analysis_text'] = 'ALU + -ERZ- + -E'
          w['refs'] = [
              {'id':'morph-erz','label':'-ERZ-'},
              {'id':'morph-e','label':'-E'}
          ]
          ap.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          import subprocess
          subprocess.run(['python','scripts/build_lexicon_index.py'], check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/morphemes.json lexico/a.json lexico/index.json
          git rm .github/workflows/_apply-erz-once.yml
          git commit -m "Canonizar -ERZ- como metal"
          git push
