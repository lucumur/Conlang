name: Add ALB lexical family
on:
  push:
    paths:
      - '.github/workflows/add-alb-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ALB family and Tirol root
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          def tag(label, cls='generic'):
              return {"class": cls, "label": label}

          # --- ALB family ---
          ap = Path('lexico/a.json')
          ad = json.loads(ap.read_text(encoding='utf-8'))
          ae = {e['id']: e for e in ad['entries']}
          alb = ae['root-alb']
          alb['form'] = '*ALB-'
          alb['gloss'] = 'blancor'
          alb['row_class'] = 'lex-root-row'
          alb['words'] = [
              {
                  "id":"lexeme-albis",
                  "form":"albis",
                  "gloss":"brillar blanco",
                  "analysis_html":"ALB + <a class=\"morph-link\" href=\"#morph-is\">-IS</a>",
                  "analysis_text":"ALB + -IS",
                  "refs":[{"id":"morph-is","label":"-IS"}],
                  "tags":[tag('Predicado IS')]
              },
              {
                  "id":"lexeme-soalbol",
                  "form":"soalbol",
                  "gloss":"palido",
                  "analysis_html":"SO + ALB + <a class=\"morph-link\" href=\"#morph-ol-2\">-OL</a>",
                  "analysis_text":"SO + ALB + -OL",
                  "refs":[{"id":"morph-ol-2","label":"-OL"}],
                  "tags":[tag('Adjetivo OL')]
              },
              {
                  "id":"lexeme-albjol",
                  "form":"albjol",
                  "gloss":"blanco",
                  "analysis_html":"ALB + J + <a class=\"morph-link\" href=\"#morph-ol-2\">-OL</a>",
                  "analysis_text":"ALB + J + -OL",
                  "refs":[{"id":"morph-ol-2","label":"-OL"}],
                  "tags":[tag('Adjetivo OL')]
              },
              {
                  "id":"lexeme-albjon",
                  "form":"albjon",
                  "gloss":"elfo (mitico)",
                  "analysis_html":"ALB + J + <a class=\"morph-link\" href=\"#morph-on\">-ON</a>",
                  "analysis_text":"ALB + J + -ON",
                  "refs":[{"id":"morph-on","label":"-ON"}],
                  "tags":[tag('Humano ON')]
              },
              {
                  "id":"lexeme-albjal",
                  "form":"albjal",
                  "gloss":"Escocia",
                  "analysis_html":"ALB + J + <a class=\"morph-link\" href=\"#morph-al-3\">-AL</a>",
                  "analysis_text":"ALB + J + -AL",
                  "refs":[{"id":"morph-al-3","label":"-AL"}],
                  "tags":[tag('Locativo AL')]
              },
              {
                  "id":"lexeme-tiralbal",
                  "form":"tiralbal",
                  "gloss":"los Alpes",
                  "analysis_html":"<a class=\"morph-link\" href=\"#root-tir-tirol\">TIR</a> + ALB + <a class=\"morph-link\" href=\"#morph-al-3\">-AL</a>",
                  "analysis_text":"TIR + ALB + -AL",
                  "refs":[{"id":"root-tir-tirol","label":"TIR"},{"id":"morph-al-3","label":"-AL"}],
                  "tags":[tag('Locativo AL')]
              },
              {
                  "id":"lexeme-tiralbiston",
                  "form":"tiralbiston",
                  "gloss":"alpinista",
                  "analysis_html":"<a class=\"morph-link\" href=\"#root-tir-tirol\">TIR</a> + ALB + <a class=\"morph-link\" href=\"#morph-ist\">-IST</a> + <a class=\"morph-link\" href=\"#morph-on\">-ON</a>",
                  "analysis_text":"TIR + ALB + -IST + -ON",
                  "refs":[{"id":"root-tir-tirol","label":"TIR"},{"id":"morph-ist","label":"-IST"},{"id":"morph-on","label":"-ON"}],
                  "tags":[tag('Humano ON')]
              },
              {
                  "id":"lexeme-albucon",
                  "form":"albucon",
                  "gloss":"albino",
                  "analysis_html":"ALB + <a class=\"morph-link\" href=\"#morph-uc\">-UC-</a> + <a class=\"morph-link\" href=\"#morph-on\">-ON</a>",
                  "analysis_text":"ALB + -UC- + -ON",
                  "refs":[{"id":"morph-uc","label":"-UC-"},{"id":"morph-on","label":"-ON"}],
                  "tags":[tag('Humano ON')]
              },
              {
                  "id":"lexeme-albucesta",
                  "form":"albucesta",
                  "gloss":"albinismo",
                  "analysis_html":"ALB + <a class=\"morph-link\" href=\"#morph-uc\">-UC-</a> + EST + <a class=\"morph-link\" href=\"#morph-a-2\">-A</a>",
                  "analysis_text":"ALB + -UC- + EST + -A",
                  "refs":[{"id":"morph-uc","label":"-UC-"},{"id":"morph-a-2","label":"-A"}],
                  "tags":[tag('Nomen A')]
              },
              {
                  "id":"lexeme-alba",
                  "form":"alba",
                  "gloss":"palidez, blancor",
                  "analysis_html":"ALB + <a class=\"morph-link\" href=\"#morph-a-2\">-A</a>",
                  "analysis_text":"ALB + -A",
                  "refs":[{"id":"morph-a-2","label":"-A"}],
                  "tags":[tag('Nomen A')]
              },
              {
                  "id":"lexeme-albam",
                  "form":"albam",
                  "gloss":"alba, madrugada",
                  "analysis_html":"ALB + <a class=\"morph-link\" href=\"#morph-am\">-AM</a>",
                  "analysis_text":"ALB + -AM",
                  "refs":[{"id":"morph-am","label":"-AM"}],
                  "tags":[]
              }
          ]
          ap.write_text(json.dumps(ad, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- New homonymous TIR root (Tirol/alpine), preserving existing TIR 'estirar, tirar' ---
          tp = Path('lexico/t.json')
          td = json.loads(tp.read_text(encoding='utf-8'))
          ids = {e['id'] for e in td['entries']}
          newroot = {
              "id":"root-tir-tirol",
              "form":"*TIR-",
              "gloss":"Tirol, alpino",
              "tags":[tag('Raiz'), tag('Nova','nova'), tag('Celta','celta')],
              "letter":"T",
              "section":"sec-t",
              "etymology":"Etym. de novo; celtico tir → *TIR-",
              "notes":[],
              "row_class":"lex-root-row",
              "words":[]
          }
          if 'root-tir-tirol' in ids:
              for i,e in enumerate(td['entries']):
                  if e['id'] == 'root-tir-tirol':
                      td['entries'][i] = newroot
                      break
          else:
              pos = next((i+1 for i,e in enumerate(td['entries']) if e.get('id') == 'root-tir'), len(td['entries']))
              td['entries'].insert(pos, newroot)
          tp.write_text(json.dumps(td, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          subprocess.run(['python','scripts/build_lexicon_index.py'], check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/t.json lexico/index.json
          git commit -m "Añadir repertorio de ALB y raíz TIR alpina"
          git push
