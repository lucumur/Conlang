name: Clean ANGUDOL once
on:
  push:
    paths:
      - '.github/workflows/_clean-angudol-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove speculative ANGUDOL etymology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e['id'] == 'root-ang-2')
          word = next(w for w in root['words'] if w['id'] == 'lexeme-angudol')
          word['analysis_html'] = 'ANG + UD + <a class="morph-link" href="#morph-ol-2">-OL</a>'
          word['analysis_text'] = 'ANG + UD + -OL'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          rm .github/workflows/_clean-angudol-once.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json .github/workflows/_clean-angudol-once.yml
          git commit -m "Ajustar análisis de angudol"
          git push
