name: Fix NA-T and F root
on:
  push:
    paths:
      - '.github/workflows/fix-arb-na-t-f.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          def tag(label, cls='generic'):
              return {'class': cls, 'label': label}

          # 1) Restore canonical *NA-T.
          np = Path('lexico/n.json')
          nd = json.loads(np.read_text(encoding='utf-8'))
          nat = next((e for e in nd.get('entries',[]) if e.get('id') in {'root-nat','root-na-t'} or e.get('form') in {'*NAT-','*NA-T'}), None)
          if nat is None:
              raise SystemExit('No se encontró la raíz de nacer')
          nat['id'] = 'root-na-t'
          nat['form'] = '*NA-T'
          nat['gloss'] = 'nacer'
          np.write_text(json.dumps(nd, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Canonical productive root *F- for the -ificar-like derivation.
          fp = Path('lexico/f.json')
          fd = json.loads(fp.read_text(encoding='utf-8'))
          entries = fd.get('entries', [])
          froot = next((e for e in entries if e.get('id') == 'root-f' or e.get('form') == '*F-'), None)
          if froot is None:
              froot = {
                  'id':'root-f',
                  'form':'*F-',
                  'gloss':'hacer, volver, convertir en',
                  'tags':[tag('Raiz')],
                  'letter':'F',
                  'section':'sec-f',
                  'etymology':None,
                  'notes':['Raíz derivativa productiva de valor factitivo; la verbalización la aporta -AS.'],
                  'row_class':'lex-root-row',
                  'words':[]
              }
              entries.insert(0, froot)
          else:
              froot['gloss'] = 'hacer, volver, convertir en'
              froot['notes'] = ['Raíz derivativa productiva de valor factitivo; la verbalización la aporta -AS.']
          fd['entries'] = entries
          fp.write_text(json.dumps(fd, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3) Remove the incorrect fused morpheme *-FAS.
          mp = Path('lexico/morphemes.json')
          md = json.loads(mp.read_text(encoding='utf-8'))
          md['morphemes'] = [m for m in md.get('morphemes',[]) if m.get('id') != 'morph-fas' and m.get('form') != '*-FAS']
          mp.write_text(json.dumps(md, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4) Correct ARB-family analyses.
          ap = Path('lexico/a.json')
          ad = json.loads(ap.read_text(encoding='utf-8'))
          arb = next((e for e in ad.get('entries',[]) if e.get('id') == 'root-arb'), None)
          if arb is None:
              raise SystemExit('No se encontró *ARB-')
          for w in arb.get('words',[]):
              if w.get('id') == 'lexeme-natarbo' or w.get('form') == 'natarbo':
                  w['analysis_html'] = '<a class="morph-link" href="#root-na-t">NA-T</a> + ARB + <a class="morph-link" href="#morph-o">-O</a>'
                  w['analysis_text'] = 'NA-T + ARB + -O'
                  w['refs'] = [{'id':'root-na-t','label':'NA-T'},{'id':'morph-o','label':'-O'}]
              if w.get('id') == 'lexeme-arbifas' or w.get('form') == 'arbifas':
                  w['analysis_html'] = 'ARB + <span class="meta-extra">i epentética</span> + <a class="morph-link" href="#root-f">F</a> + <a class="morph-link" href="#morph-as">-AS</a>'
                  w['analysis_text'] = 'ARB + i epentética + F + -AS'
                  w['refs'] = [{'id':'root-f','label':'F'},{'id':'morph-as','label':'-AS'}]
                  w['tags'] = [tag('Predicado AS')]
          ap.write_text(json.dumps(ad, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 5) Document productive i-epenthesis in phonology.
          pp = Path('fonologia.html')
          p = pp.read_text(encoding='utf-8')
          marker = '  <p><span class="status canon">Canónico</span>El léxico moderno admite grupos consonánticos complejos y raíces con divisiones internas, por ejemplo <code>*AS-TR</code>, <code>*DEN-TR-</code>, <code>*MES-TR</code>, <code>*MON-TR</code>, <code>*TEN-BR-</code> o <code>*EΘ-R</code>.</p>'
          ep = '  <p><span class="status canon">Canónico</span><code>i</code> puede insertarse como vocal epentética para reparar grupos consonánticos no admitidos en composición o derivación. Ejemplos: <code>ARB + KRON + -A → arbikrona</code> (no <code>*arbkrona</code>) y <code>ARB + F + -AS → arbifas</code>.</p>'
          if 'ARB + KRON + -A → arbikrona' not in p:
              if marker not in p:
                  raise SystemExit('No se encontró el punto de inserción fonológico')
              p = p.replace(marker, marker + '\n' + ep, 1)
              pp.write_text(p, encoding='utf-8')

          subprocess.run(['python','scripts/build_lexicon_index.py'], check=True)
          PY
      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-arb-na-t-f.yml
          git add lexico/a.json lexico/f.json lexico/n.json lexico/morphemes.json lexico/index.json fonologia.html
          git commit -m "Corregir NA-T y analizar arbifas con F + AS"
          git push
