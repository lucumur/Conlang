name: Document root extensions
on:
  push:
    paths:
      - '.github/workflows/document-root-extensions.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update grammar and phonology
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          if '1.1. Raíces con extensión interna' not in g:
              start = g.index('<h2>1. Naturaleza y unidad básica</h2>')
              end = g.index('</section>', start)
              block = '''  <h3>1.1. Raíces con extensión interna</h3>\n  <p><span class="status canon">Canónico</span>Cuando una raíz se cita con un guion interno, el segmento anterior al guion representa su <strong>forma primigenia</strong> y el material posterior constituye una <strong>extensión de raíz</strong>. La forma extendida es normalmente la forma más usual en el léxico moderno y en la derivación corriente.</p>\n  <p><span class="status canon">Canónico</span>La forma primigenia no es una raíz independiente: pertenece a la misma entrada léxica y puede reaparecer sin la extensión en determinados derivados. Este uso es especialmente admisible en registros o entornos formales, donde la derivación puede recurrir deliberadamente a la base más antigua.</p>\n  <p><span class="status canon">Canónico</span>Así, <code>*OẐ-AN-</code> tiene como forma primigenia <code>OẐ-</code> y como forma extendida usual <code>OẐ-AN-</code>; <code>oẑastren</code> «estrella de mar» emplea la forma primigenia <code>OẐ-</code>. Del mismo modo, en raíces como <code>*AS-TR</code>, la parte posterior al guion es una extensión histórica de la raíz, aunque la forma extendida sea la de uso ordinario.</p>\n'''
              g = g[:end] + block + g[end:]
              gp.write_text(g, encoding='utf-8')

          fp = Path('fonologia.html')
          f = fp.read_text(encoding='utf-8')
          newp = '<p><span class="status canon">Canónico</span>Las divisiones internas de raíces como <code>*AS-TR</code> o <code>*OẐ-AN-</code> reflejan una estructura histórica entre una base primigenia y una extensión posterior. La distribución morfológica y registral de ambas formas se documenta en la sección 1.1 de <a href="gramatica.html">gramatica.html</a>.</p>'
          pattern = r'<p><span class="status canon">Canónico</span>En una raíz con guion interno,.*?</p>'
          if re.search(pattern, f, flags=re.S):
              f = re.sub(pattern, newp, f, count=1, flags=re.S)
              fp.write_text(f, encoding='utf-8')
          elif newp not in f:
              raise SystemExit('No se encontró la nota previa de extensiones en fonologia.html')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gramatica.html fonologia.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Documentar raíces primigenias y extensiones internas"
          git push
