name: Finalize grammar lexicon sync

on:
  push:
    paths:
      - '.github/workflows/finalize-grammar-sync.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize documentation sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Correct the temporal E- tag only on the row with the archaic preterite gloss.
          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r'(<tr><td class="form"><code>\*E-</code></td><td class="gloss">pretérito arcaico; plenamente funcional con -IS y -ES</td><td class="tags">)(.*?)(</td></tr>)')
          m = pat.search(s)
          if not m:
              raise SystemExit('No se encontró la entrada temporal E-')
          middle = m.group(2).replace('<span class="tag generic">sufijo</span>', '<span class="tag generic">morfema temporal</span>', 1)
          s = s[:m.start()] + m.group(1) + middle + m.group(3) + s[m.end():]
          p.write_text(s, encoding='utf-8')

          # Remove the now-obsolete warning that the lexicon still needs synchronization.
          p = Path('gramatica.html')
          s = p.read_text(encoding='utf-8')
          old = '<p><span class="status open">Pendiente</span>El léxico todavía contiene algunas glosas antiguas para morfemas que ahora han sido redefinidos, especialmente <code>-AS</code>, <code>-OS</code>, <code>-IS</code>, <code>E-</code>, <code>-EL</code>, <code>-ER</code>, <code>-OR</code> y otras terminaciones de clase. Debe sincronizarse <a href="lexico.html">lexico.html</a> con esta gramática sin alterar raíces no relacionadas.</p>'
          new = '<p><span class="status canon">Sincronizado</span>El léxico refleja las redefiniciones canónicas actuales de los morfemas predicativos, temporales, nominales, adjetivales, adverbiales y de número documentados en esta gramática.</p>'
          if old not in s:
              raise SystemExit('No se encontró el aviso de sincronización pendiente')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit final sync
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html gramatica.html
          git commit -m "Finalizar sincronización del sistema morfológico"
          git push
