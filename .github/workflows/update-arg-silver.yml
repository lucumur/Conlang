name: Update ARG silver family
on:
  push:
    paths:
      - '.github/workflows/update-arg-silver.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ARĜ family
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('lexico/a.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-arg-2')
          root['form'] = '*ARĜ-'
          root['gloss'] = 'plata'
          root['row_class'] = 'lex-root-row'

          def tag(label):
              return {'class': 'generic', 'label': label}

          words = [
              {
                  'id': 'lexeme-argxel',
                  'form': 'arĝel',
                  'gloss': 'de plata',
                  'analysis_html': 'ARĜ + <a class="morph-link" href="#morph-el">-EL</a>',
                  'analysis_text': 'ARĜ + -EL',
                  'refs': [{'id': 'morph-el', 'label': '-EL'}],
                  'tags': [tag('Adjetivo EL')],
                  'semantic_fields': ['metales', 'materiales', 'composición']
              },
              {
                  'id': 'lexeme-argxol',
                  'form': 'arĝol',
                  'gloss': 'plateado',
                  'analysis_html': 'ARĜ + <a class="morph-link" href="#morph-ol-2">-OL</a>',
                  'analysis_text': 'ARĜ + -OL',
                  'refs': [{'id': 'morph-ol-2', 'label': '-OL'}],
                  'tags': [tag('Adjetivo OL')],
                  'semantic_fields': ['colores', 'apariencia', 'metales']
              },
              {
                  'id': 'lexeme-carargxol',
                  'form': 'cararĝol',
                  'gloss': 'canoso',
                  'analysis_html': '<a class="morph-link" href="#root-car-2">CAR</a> + ARĜ + <a class="morph-link" href="#morph-ol-2">-OL</a>',
                  'analysis_text': 'CAR + ARĜ + -OL',
                  'refs': [{'id': 'root-car-2', 'label': 'CAR'}, {'id': 'morph-ol-2', 'label': '-OL'}],
                  'tags': [tag('Adjetivo OL')],
                  'semantic_fields': ['cabello', 'envejecimiento', 'colores']
              },
              {
                  'id': 'lexeme-argxe',
                  'form': 'arĝe',
                  'gloss': 'plata',
                  'analysis_html': 'ARĜ + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text': 'ARĜ + -E',
                  'refs': [{'id': 'morph-e', 'label': '-E'}],
                  'tags': [tag('Nomen E')],
                  'semantic_fields': ['metales', 'elementos químicos', 'materiales']
              },
              {
                  'id': 'lexeme-asvargxe',
                  'form': 'asvarĝe',
                  'gloss': 'mercurio',
                  'analysis_html': '<a class="morph-link" href="#root-asv">ASV</a> + ARĜ + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text': 'ASV + ARĜ + -E',
                  'refs': [{'id': 'root-asv', 'label': 'ASV'}, {'id': 'morph-e', 'label': '-E'}],
                  'tags': [tag('Nomen E')],
                  'semantic_fields': ['elementos químicos', 'metales', 'líquidos']
              },
              {
                  'id': 'lexeme-sevdargxe',
                  'form': 'ŝevdarĝe',
                  'gloss': 'zinc',
                  'analysis_html': '<a class="morph-link" href="#root-sevd">ŜEVD</a> + ARĜ + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text': 'ŜEVD + ARĜ + -E',
                  'refs': [{'id': 'root-sevd', 'label': 'ŜEVD'}, {'id': 'morph-e', 'label': '-E'}],
                  'tags': [tag('Nomen E')],
                  'semantic_fields': ['elementos químicos', 'metales', 'química']
              },
              {
                  'id': 'lexeme-argxivare',
                  'form': 'arĝivare',
                  'gloss': 'cubertería',
                  'analysis_html': 'ARĜ + <span title="epéntesis">i epentética</span> + <a class="morph-link" href="#root-var">VAR</a> + <a class="morph-link" href="#morph-e">-E</a>',
                  'analysis_text': 'ARĜ + i epentética + VAR + -E',
                  'refs': [{'id': 'root-var', 'label': 'VAR'}, {'id': 'morph-e', 'label': '-E'}],
                  'tags': [tag('Nomen E')],
                  'semantic_fields': ['utensilios', 'mesa', 'hogar']
              }
          ]

          root['words'] = words
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Rebuild lexicon index
        run: python scripts/build_lexicon_index.py

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-arg-silver.yml
          git add lexico/a.json lexico/index.json
          git commit -m "Añadir repertorio de ARĜ"
          git push
