name: Add AV family
on:
  push:
    paths:
      - '.github/workflows/add-av-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical AV family
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ap = Path('lexico/a.json')
          data = json.loads(ap.read_text(encoding='utf-8'))
          entries = data['entries']

          root = next((e for e in entries if e.get('id') == 'root-av' or e.get('form') == '*AV-'), None)
          payload = {
            'id': 'root-av',
            'form': '*AV-',
            'gloss': 'abuelo',
            'tags': [{'class':'generic','label':'Raiz'}],
            'letter': 'A',
            'section': 'sec-a',
            'etymology': None,
            'notes': ['Las formaciones avajn, avejn, vavaj y avajnda son canónicas, pero sus segmentos internos adicionales no se generalizan como morfemas productivos sin decisión explícita.'],
            'row_class': 'lex-root-row',
            'words': [
              {
                'id':'lexeme-avajn','form':'avajn','gloss':'abuelo materno',
                'analysis_html':'AV + formación interna lexicalizada',
                'analysis_text':'AV + formación interna lexicalizada',
                'refs':[],
                'tags':[{'class':'generic','label':'Parentesco'}],
                'semantic_fields':['parentesco','familia','ascendencia']
              },
              {
                'id':'lexeme-avejn','form':'avejn','gloss':'abuela materna',
                'analysis_html':'AV + formación interna lexicalizada',
                'analysis_text':'AV + formación interna lexicalizada',
                'refs':[],
                'tags':[{'class':'generic','label':'Parentesco'}],
                'semantic_fields':['parentesco','familia','ascendencia']
              },
              {
                'id':'lexeme-vavaj','form':'vavaj','gloss':'abuelito, abuelita (hipocorístico)',
                'analysis_html':'derivado hipocorístico de AV; formación interna no generalizada',
                'analysis_text':'derivado hipocorístico de AV; formación interna no generalizada',
                'refs':[],
                'tags':[{'class':'generic','label':'Hipocorístico'}],
                'semantic_fields':['parentesco','familia','afectividad']
              },
              {
                'id':'lexeme-avajnda','form':'avajnda','gloss':'abolengo, ancestria',
                'analysis_html':'derivado de AV; formación interna lexicalizada',
                'analysis_text':'derivado de AV; formación interna lexicalizada',
                'refs':[],
                'tags':[{'class':'generic','label':'Abstracto'}],
                'semantic_fields':['ascendencia','familia','genealogía']
              }
            ]
          }

          if root is None:
              entries.append(payload)
          else:
              old_words = root.get('words', [])
              by_id = {w.get('id'):w for w in old_words}
              by_form = {w.get('form'):w for w in old_words}
              root.update({k:v for k,v in payload.items() if k != 'words'})
              for nw in payload['words']:
                  old = by_id.get(nw['id']) or by_form.get(nw['form'])
                  if old is None:
                      old_words.append(nw)
                  else:
                      old.clear(); old.update(nw)
              root['words'] = old_words

          ap.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Agregar familia léxica AV"
          git push
