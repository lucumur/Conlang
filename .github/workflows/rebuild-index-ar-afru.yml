name: Rebuild index after AR and AFRU
on:
  push:
    paths:
      - '.github/workflows/rebuild-index-ar-afru.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Commit index and remove temporary workflow
        run: |
          rm .github/workflows/rebuild-index-ar-afru.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerar índice tras AR y AFRU"
          git push
