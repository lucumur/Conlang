name: Replace KURT with KORT
on:
  push:
    paths:
      - '.github/workflows/update-kurt-root.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonize KORT for court and update kortanĝon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          kp = Path('lexico/k.json')
          kdata = json.loads(kp.read_text(encoding='utf-8'))
          entries = kdata['entries']
          entries[:] = [e for e in entries if e.get('id') != 'root-kurt']
          kort = next(e for e in entries if e.get('id') == 'root-kort')
          kort['gloss'] = 'corte (palaciega)'
          notes = [n for n in kort.get('notes', []) if 'KURT' not in n]
          kort['notes'] = notes
          kp.write_text(json.dumps(kdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ap = Path('lexico/a.json')
          adata = json.loads(ap.read_text(encoding='utf-8'))
          ang = next(e for e in adata['entries'] if e.get('id') == 'root-ang-3')
          word = next(w for w in ang['words'] if w.get('id') in ('lexeme-kurtangxon', 'lexeme-kortangxon'))
          word['id'] = 'lexeme-kortangxon'
          word['form'] = 'kortanĝon'
          word['gloss'] = 'asesor, mensajero'
          word['analysis_html'] = '<a class="morph-link" href="#root-kort">KORT</a> + ANĜ + <a class="morph-link" href="#morph-on">-ON</a>'
          word['analysis_text'] = 'KORT + ANĜ + -ON'
          word['refs'] = [
              {'id': 'root-kort', 'label': 'KORT'},
              {'id': 'morph-on', 'label': '-ON'}
          ]
          ap.write_text(json.dumps(adata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/k.json lexico/a.json lexico/index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Usar KORT para corte palaciega"
          git push
