name: Add provisional KURT root
on:
  push:
    paths:
      - '.github/workflows/update-kurt-root.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add provisional KURT and link kurtanĝon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          kp = Path('lexico/k.json')
          kdata = json.loads(kp.read_text(encoding='utf-8'))
          entries = kdata['entries']
          existing = next((e for e in entries if e.get('id') == 'root-kurt'), None)
          root = {
              'id': 'root-kurt',
              'form': '*KURT-',
              'gloss': 'corte (palaciega)',
              'tags': [
                  {'class': 'generic', 'label': 'Raiz'},
                  {'class': 'generic', 'label': 'Provisional'}
              ],
              'letter': 'K',
              'section': 'sec-k',
              'etymology': None,
              'notes': ['PROVISIONAL: forma destinada a «corte (palaciega)»; revisar frente a *KORT- «corte».'],
              'row_class': 'lex-root-row',
              'words': []
          }
          if existing is None:
              pos = next((i + 1 for i, e in enumerate(entries) if e.get('id') == 'root-kurs'), len(entries))
              entries.insert(pos, root)
          else:
              existing.clear()
              existing.update(root)
          kp.write_text(json.dumps(kdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ap = Path('lexico/a.json')
          adata = json.loads(ap.read_text(encoding='utf-8'))
          ang = next(e for e in adata['entries'] if e.get('id') == 'root-ang-3')
          word = next(w for w in ang['words'] if w.get('id') == 'lexeme-kurtangxon')
          word['analysis_html'] = '<a class="morph-link" href="#root-kurt">KURT</a> + ANĜ + <a class="morph-link" href="#morph-on">-ON</a>'
          word['analysis_text'] = 'KURT + ANĜ + -ON'
          word['refs'] = [
              {'id': 'root-kurt', 'label': 'KURT'},
              {'id': 'morph-on', 'label': '-ON'}
          ]
          ap.write_text(json.dumps(adata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/k.json lexico/a.json lexico/index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Agregar raíz provisional KURT"
          git push
