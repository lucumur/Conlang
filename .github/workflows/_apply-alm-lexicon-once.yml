name: Apply ALM lexicon once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-alm-lexicon-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update ALM entry and index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          entry = next(e for e in data['entries'] if e['id'] == 'root-alm')
          entry['gloss'] = 'animo'
          entry['row_class'] = 'lex-root-row'
          entry['words'] = [
            {
              'id': 'lexeme-almas',
              'form': 'almas',
              'gloss': 'animar, dar vida',
              'analysis_html': 'ALM + <a class="morph-link" href="#morph-as">-AS</a>',
              'analysis_text': 'ALM + -AS',
              'refs': [{'id': 'morph-as', 'label': '-AS'}],
              'tags': [{'class': 'generic', 'label': 'Predicado AS'}]
            },
            {
              'id': 'lexeme-nujalmas',
              'form': 'nujalmas',
              'gloss': 'reanimar',
              'analysis_html': '<a class="morph-link" href="#root-nu-j">NU-J</a> + ALM + <a class="morph-link" href="#morph-as">-AS</a>',
              'analysis_text': 'NU-J + ALM + -AS',
              'refs': [{'id': 'root-nu-j', 'label': 'NU-J'}, {'id': 'morph-as', 'label': '-AS'}],
              'tags': [{'class': 'generic', 'label': 'Predicado AS'}]
            },
            {
              'id': 'lexeme-nujalmida',
              'form': 'nujalmida',
              'gloss': 'reanimacion',
              'analysis_html': '<a class="morph-link" href="#root-nu-j">NU-J</a> + ALM(ID) + <a class="morph-link" href="#morph-a-2">-A</a> <span class="meta-extra">[ID como extensión de tema; analizar]</span>',
              'analysis_text': 'NU-J + ALM(ID) + -A [ID como extensión de tema; analizar]',
              'refs': [{'id': 'root-nu-j', 'label': 'NU-J'}, {'id': 'morph-a-2', 'label': '-A'}],
              'tags': [{'class': 'generic', 'label': 'Nomen A'}]
            },
            {
              'id': 'lexeme-almos',
              'form': 'almos',
              'gloss': 'animarse, entusiasmarse',
              'analysis_html': 'ALM + <a class="morph-link" href="#morph-os">-OS</a>',
              'analysis_text': 'ALM + -OS',
              'refs': [{'id': 'morph-os', 'label': '-OS'}],
              'tags': [{'class': 'generic', 'label': 'Predicado OS'}]
            },
            {
              'id': 'lexeme-alma',
              'form': 'alma',
              'gloss': 'anima, alma, espiritu',
              'analysis_html': 'ALM + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text': 'ALM + -A',
              'refs': [{'id': 'morph-a-2', 'label': '-A'}],
              'tags': [{'class': 'generic', 'label': 'Nomen A'}]
            },
            {
              'id': 'lexeme-coalma',
              'form': 'coalma',
              'gloss': 'espiritu santo',
              'analysis_html': 'CO + ALM + <a class="morph-link" href="#morph-a-2">-A</a> <span class="meta-extra">[CO pendiente de analizar]</span>',
              'analysis_text': 'CO + ALM + -A [CO pendiente de analizar]',
              'refs': [{'id': 'morph-a-2', 'label': '-A'}],
              'tags': [{'class': 'generic', 'label': 'Nomen A'}]
            },
            {
              'id': 'lexeme-bonalmor',
              'form': 'bonalmor',
              'gloss': 'buena gente, bien intencionado',
              'analysis_html': '<a class="morph-link" href="#root-bon">BON</a> + ALM + <a class="morph-link" href="#morph-or">-OR</a>',
              'analysis_text': 'BON + ALM + -OR',
              'refs': [{'id': 'root-bon', 'label': 'BON'}, {'id': 'morph-or', 'label': '-OR'}],
              'tags': [{'class': 'generic', 'label': 'Participio OR'}]
            },
            {
              'id': 'lexeme-malalmor',
              'form': 'malalmor',
              'gloss': 'desalmado, malvado',
              'analysis_html': '<a class="morph-link" href="#root-mal">MAL</a> + ALM + <a class="morph-link" href="#morph-or">-OR</a>',
              'analysis_text': 'MAL + ALM + -OR',
              'refs': [{'id': 'root-mal', 'label': 'MAL'}, {'id': 'morph-or', 'label': '-OR'}],
              'tags': [{'class': 'generic', 'label': 'Participio OR'}]
            },
            {
              'id': 'lexeme-almidaj',
              'form': 'almidaj',
              'gloss': 'animos, ganas, entusiasmo',
              'analysis_html': 'ALM(ID) + <a class="morph-link" href="#morph-aj">-AJ</a> <span class="meta-extra">[ID como extensión de tema; analizar]</span>',
              'analysis_text': 'ALM(ID) + -AJ [ID como extensión de tema; analizar]',
              'refs': [{'id': 'morph-aj', 'label': '-AJ'}],
              'tags': [{'class': 'generic', 'label': 'Nomen A plural'}]
            },
            {
              'id': 'lexeme-almen',
              'form': 'almen',
              'gloss': 'animal, ser vivo',
              'analysis_html': 'ALM + <a class="morph-link" href="#morph-en">-EN</a>',
              'analysis_text': 'ALM + -EN',
              'refs': [{'id': 'morph-en', 'label': '-EN'}],
              'tags': []
            }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/_apply-alm-lexicon-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexico/a.json lexico/index.json .github/workflows/_apply-alm-lexicon-once.yml
          git commit -m 'Actualizar ALM y sus derivados'
          git push
