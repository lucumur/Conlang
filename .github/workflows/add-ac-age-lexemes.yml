name: Add AC and AGE lexemes
on:
  push:
    paths:
      - '.github/workflows/add-ac-age-lexemes.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lexicon and grammar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def tag(label):
              return {"class":"generic","label":label}

          # --- A roots and derived words ---
          ap = Path('lexico/a.json')
          data = json.loads(ap.read_text(encoding='utf-8'))
          entries = {e['id']: e for e in data['entries']}

          ac = entries['root-ac']
          ac['row_class'] = 'lex-root-row'
          ac['words'] = [
              {
                  "id":"lexeme-ace",
                  "form":"aĉe",
                  "gloss":"escoria, escombros",
                  "analysis_html":"AĈ + <a class=\"morph-link\" href=\"#morph-e\">-E</a>",
                  "analysis_text":"AĈ + -E",
                  "refs":[{"id":"morph-e","label":"-E"}],
                  "tags":[tag("Nomen E")]
              }
          ]

          agx = entries['root-ag-2-2']
          agx['row_class'] = 'lex-root-row'
          agx['words'] = [
              {
                  "id":"lexeme-agxos",
                  "form":"aĝos",
                  "gloss":"crecer, envejecer",
                  "analysis_html":"AĜ + <a class=\"morph-link\" href=\"#morph-os\">-OS</a>",
                  "analysis_text":"AĜ + -OS",
                  "refs":[{"id":"morph-os","label":"-OS"}],
                  "tags":[tag("Predicado OS")]
              },
              {
                  "id":"lexeme-agxoton",
                  "form":"aĝoton",
                  "gloss":"adulto",
                  "analysis_html":"AĜ + <a class=\"morph-link\" href=\"#morph-ot\">-OT-</a> + <a class=\"morph-link\" href=\"#morph-on\">-ON</a>",
                  "analysis_text":"AĜ + -OT- + -ON",
                  "refs":[{"id":"morph-ot","label":"-OT-"},{"id":"morph-on","label":"-ON"}],
                  "tags":[tag("Humano ON")]
              },
              {
                  "id":"lexeme-agxeva",
                  "form":"aĝeva",
                  "gloss":"edad",
                  "analysis_html":"AĜ + <a class=\"morph-link\" href=\"#morph-ev\">-EV-</a> + <a class=\"morph-link\" href=\"#morph-a-2\">-A</a>",
                  "analysis_text":"AĜ + -EV- + -A",
                  "refs":[{"id":"morph-ev","label":"-EV-"},{"id":"morph-a-2","label":"-A"}],
                  "tags":[tag("Nomen A")]
              },
              {
                  "id":"lexeme-agxeta",
                  "form":"aĝeta",
                  "gloss":"año",
                  "analysis_html":"AĜ + <a class=\"morph-link\" href=\"#morph-et\">-ET-</a> + <a class=\"morph-link\" href=\"#morph-a-2\">-A</a>",
                  "analysis_text":"AĜ + -ET- + -A",
                  "refs":[{"id":"morph-et","label":"-ET-"},{"id":"morph-a-2","label":"-A"}],
                  "tags":[tag("Nomen A")]
              },
              {
                  "id":"lexeme-lontagxeva",
                  "form":"lontaĝeva",
                  "gloss":"eternidad",
                  "analysis_html":"<a class=\"morph-link\" href=\"#root-lont\">LONT</a> + <a class=\"morph-link\" href=\"#root-ag-2-2\">AĜ</a> + <a class=\"morph-link\" href=\"#morph-ev\">-EV-</a> + <a class=\"morph-link\" href=\"#morph-a-2\">-A</a>",
                  "analysis_text":"LONT + AĜ + -EV- + -A",
                  "refs":[{"id":"root-lont","label":"LONT"},{"id":"root-ag-2-2","label":"AĜ"},{"id":"morph-ev","label":"-EV-"},{"id":"morph-a-2","label":"-A"}],
                  "tags":[tag("Nomen A")]
              },
              {
                  "id":"lexeme-lontagxol",
                  "form":"lontaĝol",
                  "gloss":"eterno",
                  "analysis_html":"<a class=\"morph-link\" href=\"#root-lont\">LONT</a> + <a class=\"morph-link\" href=\"#root-ag-2-2\">AĜ</a> + <a class=\"morph-link\" href=\"#morph-ol-2\">-OL</a>",
                  "analysis_text":"LONT + AĜ + -OL",
                  "refs":[{"id":"root-lont","label":"LONT"},{"id":"root-ag-2-2","label":"AĜ"},{"id":"morph-ol-2","label":"-OL"}],
                  "tags":[tag("Adjetivo OL")]
              },
              {
                  "id":"lexeme-agxin",
                  "form":"aĝin",
                  "gloss":"crecido, madurado",
                  "analysis_html":"AĜ + <a class=\"morph-link\" href=\"#morph-in\">-IN</a>",
                  "analysis_text":"AĜ + -IN",
                  "refs":[{"id":"morph-in","label":"-IN"}],
                  "tags":[tag("Participio IN")]
              },
              {
                  "id":"lexeme-agxil",
                  "form":"aĝil",
                  "gloss":"crecido, madurado",
                  "analysis_html":"AĜ + <a class=\"morph-link\" href=\"#morph-il\">-IL</a>",
                  "analysis_text":"AĜ + -IL",
                  "refs":[{"id":"morph-il","label":"-IL"}],
                  "tags":[tag("Inanimado IL")]
              }
          ]

          ap.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- New morphemes ---
          mp = Path('lexico/morphemes.json')
          md = json.loads(mp.read_text(encoding='utf-8'))
          existing = {m['id'] for m in md['morphemes']}
          additions = [
              {
                  "id":"morph-ot","form":"*-OT-","gloss":"estativo nominal",
                  "tags":[tag("sufijo")],"letter":"O","section":"sec-o","etymology":None,"notes":[],"row_class":""
              },
              {
                  "id":"morph-ev","form":"*-EV-","gloss":"época",
                  "tags":[tag("sufijo")],"letter":"E","section":"sec-e","etymology":None,"notes":[],"row_class":""
              },
              {
                  "id":"morph-il","form":"*-IL","gloss":"para inanimados",
                  "tags":[tag("sufijo")],"letter":"I","section":"sec-i","etymology":None,"notes":[],"row_class":""
              },
              {
                  "id":"morph-et","form":"*-ET-","gloss":"función pendiente; atestiguado en aĝeta",
                  "tags":[tag("sufijo")],"letter":"E","section":"sec-e","etymology":None,"notes":["Función no canonizada todavía."],"row_class":""
              }
          ]
          for m in additions:
              if m['id'] not in existing:
                  md['morphemes'].append(m)
          mp.write_text(json.dumps(md, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # --- Grammar: only explicitly defined morphemes ---
          gp = Path('gramatica.html')
          s = gp.read_text(encoding='utf-8')
          anchor = '    <tr><td><code>-IN</code></td><td>participio animante</td></tr>'
          rows = []
          if '<code>-IL</code>' not in s:
              rows.append('    <tr><td><code>-IL</code></td><td>para inanimados</td></tr>')
          if '<code>-OT-</code>' not in s:
              rows.append('    <tr><td><code>-OT-</code></td><td>estativo nominal</td></tr>')
          if '<code>-EV-</code>' not in s:
              rows.append('    <tr><td><code>-EV-</code></td><td>época</td></tr>')
          if rows:
              if anchor not in s:
                  raise SystemExit('No se encontró el ancla -IN en gramatica.html')
              s = s.replace(anchor, anchor + '\n' + '\n'.join(rows), 1)
              gp.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json lexico/morphemes.json gramatica.html
          git commit -m "Añadir léxico de AĈ y AĜ"
          git push
