name: Finalize ARC update
on:
  push:
    paths:
      - '.github/workflows/update-arc-family.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild lexicon index and remove temporary workflow
        run: |
          python scripts/build_lexicon_index.py
          git rm .github/workflows/update-arc-family.yml
      - name: Commit finalization
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/index.json
          git commit -m "Regenerar índice tras ARC y limpiar workflow"
          git push
