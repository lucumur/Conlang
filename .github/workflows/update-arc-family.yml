name: Update ARC family
on:
  push:
    paths:
      - '.github/workflows/update-arc-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ARC family
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          arc = next((e for e in data.get('entries', []) if e.get('id') == 'root-arc'), None)
          if arc is None:
              raise SystemExit('No se encontró *ARC-')

          def tag(label):
              return {'class':'generic','label':label}

          arc['row_class'] = 'lex-root-row'
          arc['words'] = [
            {
              'id':'lexeme-arces','form':'arces','gloss':'comenzar',
              'analysis_html':'ARC + <a class="morph-link" href="#morph-es">-ES</a>',
              'analysis_text':'ARC + -ES',
              'refs':[{'id':'morph-es','label':'-ES'}],
              'tags':[tag('Predicado ES'), tag('Incoativo lexicalizado')],
              'semantic_fields':['inicio','cambio','procesos']
            },
            {
              'id':'lexeme-antarcur','form':'antarcur','gloss':'arcaico',
              'analysis_html':'<a class="morph-link" href="#root-ant">ANT</a> + ARC + <a class="morph-link" href="#morph-ur-3">-UR</a>',
              'analysis_text':'ANT + ARC + -UR',
              'refs':[{'id':'root-ant','label':'ANT'},{'id':'morph-ur-3','label':'-UR'}],
              'tags':[tag('Adjetivo UR')],
              'semantic_fields':['antigüedad','tiempo','cualidades']
            },
            {
              'id':'lexeme-natarcur','form':'natarcur','gloss':'primigenio',
              'analysis_html':'<a class="morph-link" href="#root-na-t">NA-T</a> + ARC + <a class="morph-link" href="#morph-ur-3">-UR</a>',
              'analysis_text':'NA-T + ARC + -UR',
              'refs':[{'id':'root-na-t','label':'NA-T'},{'id':'morph-ur-3','label':'-UR'}],
              'tags':[tag('Adjetivo UR')],
              'semantic_fields':['origen','antigüedad','primordialidad']
            },
            {
              'id':'lexeme-arcipajn','form':'arcipajn','gloss':'Padre, Mayor',
              'analysis_html':'ARC + <span class="meta-extra">i epentética</span> + <a class="morph-link" href="#root-paj">PAJ</a> + <span class="meta-extra">-n lexicalizado</span>',
              'analysis_text':'ARC + i epentética + PAJ + -n lexicalizado',
              'refs':[{'id':'root-paj','label':'PAJ'}],
              'tags':[tag('Humano'), tag('Título')],
              'semantic_fields':['parentesco','jerarquía','títulos']
            },
            {
              'id':'lexeme-arcifrajn','form':'arcifrajn','gloss':'hermano noble',
              'analysis_html':'ARC + <span class="meta-extra">i epentética</span> + <a class="morph-link" href="#root-fra">FRA</a> + <a class="morph-link" href="#morph-j-theme">-J-</a> + <span class="meta-extra">-n lexicalizado</span>',
              'analysis_text':'ARC + i epentética + FRA + -J- + -n lexicalizado',
              'refs':[{'id':'root-fra','label':'FRA'},{'id':'morph-j-theme','label':'-J-'}],
              'tags':[tag('Humano'), tag('Título')],
              'semantic_fields':['parentesco','nobleza','jerarquía']
            },
            {
              'id':'lexeme-antarcaral','form':'antarcaral','gloss':'anticuario',
              'analysis_html':'<a class="morph-link" href="#root-ant">ANT</a> + ARC + <a class="morph-link" href="#morph-ar-2">-AR</a> + <a class="morph-link" href="#morph-al-3">-AL</a>',
              'analysis_text':'ANT + ARC + -AR + -AL',
              'refs':[{'id':'root-ant','label':'ANT'},{'id':'morph-ar-2','label':'-AR'},{'id':'morph-al-3','label':'-AL'}],
              'tags':[tag('Lexicalizado')],
              'semantic_fields':['antigüedades','oficios','comercio']
            },
            {
              'id':'lexeme-arcenal','form':'arcenal','gloss':'archivo',
              'analysis_html':'ARC + <span class="meta-extra">-en- formante léxico</span> + <a class="morph-link" href="#morph-al-3">-AL</a>',
              'analysis_text':'ARC + -en- formante léxico + -AL',
              'refs':[{'id':'morph-al-3','label':'-AL'}],
              'tags':[tag('Locativo AL')],
              'semantic_fields':['documentos','archivos','conservación']
            },
            {
              'id':'lexeme-urarca','form':'urarca','gloss':'inicio, origen',
              'analysis_html':'<a class="morph-link" href="#morph-ur">UR-</a> + ARC + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text':'UR- + ARC + -A',
              'refs':[{'id':'morph-ur','label':'UR-'},{'id':'morph-a-2','label':'-A'}],
              'tags':[tag('Nomen A')],
              'semantic_fields':['origen','inicio','primordialidad']
            },
            {
              'id':'lexeme-arcam','form':'arcam','gloss':'al principio',
              'analysis_html':'ARC + <a class="morph-link" href="#morph-am">-AM</a>',
              'analysis_text':'ARC + -AM',
              'refs':[{'id':'morph-am','label':'-AM'}],
              'tags':[tag('Adverbio AM')],
              'semantic_fields':['tiempo','inicio']
            }
          ]

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/a.json
          git commit -m "Añadir repertorio de ARC"
          git push
