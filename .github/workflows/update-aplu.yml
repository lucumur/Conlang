name: Update APL-U root
on:
  push:
    paths:
      - '.github/workflows/update-aplu.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update APL-U
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('lexico/a.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-apol')
          root['form'] = '*APL-U'
          root['gloss'] = 'Apolo'
          root['etymology'] = 'Etym. Eo. Apolono → *APL-U'
          root['row_class'] = 'lex-root-row'
          root['words'] = [
            {
              'id': 'lexeme-aplun',
              'form': 'Aplun',
              'gloss': 'Apolo',
              'analysis_html': 'APL-U + <span title="extensión nominal lexicalizada">-N</span>',
              'analysis_text': 'APL-U + -N (extensión nominal lexicalizada)',
              'refs': [],
              'tags': [{'class': 'generic', 'label': 'Nombre propio'}],
              'semantic_fields': ['mitología', 'divinidades', 'artes']
            },
            {
              'id': 'lexeme-apluntel',
              'form': 'apluntel',
              'gloss': 'artistico, apolineo',
              'analysis_html': 'APL-U(N) + <span title="formante relacional provisional">-TEL</span>',
              'analysis_text': 'APL-U(N) + -TEL (formante relacional provisional)',
              'refs': [],
              'tags': [{'class': 'generic', 'label': 'Adjetivo relacional'}],
              'semantic_fields': ['artes', 'estética', 'mitología']
            },
            {
              'id': 'lexeme-aplulunda',
              'form': 'Aplulunda',
              'gloss': 'Septiembre',
              'analysis_html': 'APL-U + <a class="morph-link" href="#root-lun">LUND</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
              'analysis_text': 'APL-U + LUND + -A',
              'refs': [
                {'id': 'root-lun', 'label': 'LUND'},
                {'id': 'morph-a-2', 'label': '-A'}
              ],
              'tags': [{'class': 'generic', 'label': 'Nomen calendárico'}],
              'semantic_fields': ['calendario', 'meses', 'tiempo']
            }
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexico/a.json lexico/index.json
          git diff --cached --quiet || git commit -m 'Actualizar raíz APL-U y repertorio'
          git push
