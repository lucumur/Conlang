name: Rebuild index now
on:
  push:
    paths:
      - '.github/workflows/rebuild-index-now.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Remove temporary workflow
        run: rm .github/workflows/rebuild-index-now.yml
      - name: Commit index
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/index.json .github/workflows/rebuild-index-now.yml
          git commit -m "Regenerar índice tras ARĈ"
          git push
