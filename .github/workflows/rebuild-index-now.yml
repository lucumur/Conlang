name: Rebuild lexicon index now
on:
  push:
    paths:
      - '.github/workflows/rebuild-index-now.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python scripts/build_lexicon_index.py
      - name: Commit index
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- lexico/index.json; then exit 0; fi
          git add lexico/index.json
          git commit -m "Regenerar índice léxico tras AĈ y AĜ"
          git push
