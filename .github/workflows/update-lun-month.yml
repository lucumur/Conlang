name: Update LUN month
on:
  push:
    paths:
      - '.github/workflows/update-lun-month.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update LUN and index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('lexico/l.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for e in data.get('entries',[]):
              if e.get('id')=='root-lun':
                  e['gloss']='luna, mes'
                  break
          else:
              raise SystemExit('root-lun not found')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/update-lun-month.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar LUN como luna y mes"
          git push
