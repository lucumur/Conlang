name: Migrate lexicon to JSON
on:
  push:
    paths:
      - '.github/workflows/migrate-lexicon-json.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate lexicon
        run: python scripts/migrate_lexicon_json.py
      - name: Validate output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path('lexico').glob('*.json'))
          assert files
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
          idx=json.loads(Path('lexico/index.json').read_text(encoding='utf-8'))
          assert idx['counts']['roots'] > 0
          assert 'lexico/a.json' in Path('lexico.html').read_text(encoding='utf-8')
          print(idx['counts'])
          PY
      - name: Commit migration
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html lexico scripts/migrate_lexicon_json.py
          git commit -m "Migrar léxico a JSON con carga por letra"
          git push
