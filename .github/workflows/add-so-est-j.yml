name: Add SO EST J morphemes
on:
  push:
    paths:
      - '.github/workflows/add-so-est-j.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update morphemes and ALB analyses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          def tag(label, cls='generic'):
              return {"class": cls, "label": label}

          # morphemes
          mp = Path('lexico/morphemes.json')
          md = json.loads(mp.read_text(encoding='utf-8'))
          ids = {m['id'] for m in md['morphemes']}
          new = [
              {
                  "id":"morph-so-sub",
                  "form":"*SO-",
                  "gloss":"atenuativo; indica un poco, en grado menor",
                  "tags":[tag('morfema')],
                  "letter":"S",
                  "section":"sec-s",
                  "etymology":None,
                  "notes":[],
                  "row_class":""
              },
              {
                  "id":"morph-est-cond",
                  "form":"*-EST-",
                  "gloss":"condición, estado",
                  "tags":[tag('morfema')],
                  "letter":"E",
                  "section":"sec-e",
                  "etymology":None,
                  "notes":[],
                  "row_class":""
              },
              {
                  "id":"morph-j-theme",
                  "form":"*-J-",
                  "gloss":"extensión de tema / formante derivacional",
                  "tags":[tag('morfema')],
                  "letter":"J",
                  "section":"sec-j",
                  "etymology":None,
                  "notes":["Puede funcionar como extensión temática o como formante derivacional según la formación léxica."],
                  "row_class":""
              }
          ]
          for nm in new:
              if nm['id'] in ids:
                  for i,m in enumerate(md['morphemes']):
                      if m['id']==nm['id']:
                          md['morphemes'][i]=nm
                          break
              else:
                  md['morphemes'].append(nm)
          mp.write_text(json.dumps(md, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          # update ALB family links
          ap = Path('lexico/a.json')
          ad = json.loads(ap.read_text(encoding='utf-8'))
          alb = next(e for e in ad['entries'] if e.get('id')=='root-alb')
          byform = {w['form']:w for w in alb.get('words',[])}

          w=byform.get('soalbol')
          if w:
              w['analysis_html'] = '<a class="morph-link" href="#morph-so-sub">SO-</a> + ALB + <a class="morph-link" href="#morph-ol-2">-OL</a>'
              w['analysis_text'] = 'SO- + ALB + -OL'
              w['refs'] = [{"id":"morph-so-sub","label":"SO-"},{"id":"morph-ol-2","label":"-OL"}]

          for form, ending_id, ending_label in [('albjol','morph-ol-2','-OL'),('albjon','morph-on','-ON'),('albjal','morph-al-3','-AL')]:
              w=byform.get(form)
              if w:
                  w['analysis_html'] = f'ALB + <a class="morph-link" href="#morph-j-theme">-J-</a> + <a class="morph-link" href="#{ending_id}">{ending_label}</a>'
                  w['analysis_text'] = f'ALB + -J- + {ending_label}'
                  w['refs'] = [{"id":"morph-j-theme","label":"-J-"},{"id":ending_id,"label":ending_label}]

          w=byform.get('albucesta')
          if w:
              w['analysis_html'] = 'ALB + <a class="morph-link" href="#morph-uc">-UC-</a> + <a class="morph-link" href="#morph-est-cond">-EST-</a> + <a class="morph-link" href="#morph-a-2">-A</a>'
              w['analysis_text'] = 'ALB + -UC- + -EST- + -A'
              w['refs'] = [{"id":"morph-uc","label":"-UC-"},{"id":"morph-est-cond","label":"-EST-"},{"id":"morph-a-2","label":"-A"}]

          ap.write_text(json.dumps(ad, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          subprocess.run(['python','scripts/build_lexicon_index.py'], check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/morphemes.json lexico/a.json lexico/index.json
          git commit -m "Definir SO EST y J derivativos"
          git push
