name: Refine ARK analysis
on:
  push:
    paths:
      - '.github/workflows/fix-ark-analysis.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark inferred ARK derivations provisional
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          mp = Path('lexico/morphemes.json')
          data = json.loads(mp.read_text(encoding='utf-8'))
          for m in data.get('morphemes', []):
              if m.get('id') == 'morph-alda':
                  labels = [t.get('label') for t in m.get('tags', [])]
                  if 'Provisional' not in labels:
                      m.setdefault('tags', []).append({'class':'generic','label':'Provisional'})
                  m['notes'] = ['Análisis provisional inferido de arkal → arkalda; la palabra arkalda es canónica, pero la productividad general de -ALDA aún debe confirmarse.']
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          old = '<p><span class="status canon">Canónico</span><code>-ALDA</code> forma una institución o actividad abstracta a partir de una forma locativa en <code>-AL</code>: <code>arkal</code> «banco» → <code>arkalda</code> «banca (institución)».</p>'
          new = '<p><span class="status prov">Provisional</span><code>-ALDA</code> se analiza por ahora como formación institucional o abstracta a partir de una forma locativa en <code>-AL</code>: <code>arkal</code> «banco» → <code>arkalda</code> «banca (institución)». La productividad general de este patrón debe confirmarse con más ejemplos.</p>'
          if old in g:
              g = g.replace(old, new, 1)
          gp.write_text(g, encoding='utf-8')
          PY

          python scripts/build_lexicon_index.py
          git rm .github/workflows/fix-ark-analysis.yml
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Marcar análisis ALDA como provisional"
          git push
