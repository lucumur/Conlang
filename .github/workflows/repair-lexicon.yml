name: Update lexicon cleanup and search

on:
  push:
    paths:
      - '.github/workflows/repair-lexicon.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lexicon corrections
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update_lexicon.py
          python /tmp/update_lexicon.py
      - name: Commit updated lexicon
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Corregir AJ, limpiar tags y añadir buscador" || exit 0
          git push
