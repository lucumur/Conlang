name: Repair static lexicon

on:
  push:
    paths:
      - '.github/workflows/repair-lexicon.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert lexicon to static HTML
        run: python tools/repair_lexicon.py
      - name: Commit repaired lexicon
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Convertir léxico a HTML estático y separar S/Ŝ" || exit 0
          git push
