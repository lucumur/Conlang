name: Document root extensions
on:
  push:
    paths:
      - '.github/workflows/add-astr-family.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document primordial and extended root forms
        run: |
          python - <<'PY'
          from pathlib import Path

          gp = Path('gramatica.html')
          g = gp.read_text(encoding='utf-8')
          marker = '<p><span class="status canon">Canónico</span>Las formas de cita del léxico llevan asterisco y al menos un guion. Una raíz ordinaria suele citarse con guion final, por ejemplo <code>*AM-</code>; los afijos pueden llevar guion inicial, final o a ambos lados.</p>'
          addition = marker + '''
  <h3>1.1. Raíces con extensión interna</h3>
  <p><span class="status canon">Canónico</span>Cuando una raíz se cita con un guion interno, el segmento anterior al guion representa su <strong>forma primigenia</strong> y el material posterior constituye una <strong>extensión de raíz</strong>. La forma extendida es normalmente la forma más usual en el léxico moderno y en la derivación corriente.</p>
  <p><span class="status canon">Canónico</span>La forma primigenia no es una raíz independiente: pertenece a la misma entrada léxica y puede reaparecer sin la extensión en determinados derivados. Este uso es especialmente admisible en registros o entornos formales, donde la derivación puede recurrir deliberadamente a la base más antigua.</p>
  <p><span class="status canon">Canónico</span>Así, <code>*OẐ-AN-</code> tiene como forma primigenia <code>OẐ-</code> y como forma extendida usual <code>OẐ-AN-</code>; <code>oẑastren</code> «estrella de mar» emplea la forma primigenia <code>OẐ-</code>. Del mismo modo, en raíces como <code>*AS-TR</code>, la parte posterior al guion es una extensión histórica de la raíz, aunque la forma extendida sea la de uso ordinario.</p>'''
          if '1.1. Raíces con extensión interna' not in g:
              if marker not in g:
                  raise SystemExit('grammar anchor not found')
              g = g.replace(marker, addition, 1)
          gp.write_text(g, encoding='utf-8')

          fp = Path('fonologia.html')
          f = fp.read_text(encoding='utf-8')
          old = '<p><span class="status canon">Canónico</span>En una raíz con guion interno, el material situado después del guion constituye una extensión de raíz que puede aparecer u omitirse en los derivados. La forma reducida sigue remitiendo a la misma raíz y no constituye automáticamente una raíz independiente. Ejemplo: <code>*OẐ-AN-</code> puede aportar el tema reducido <code>OẐ-</code> en <code>oẑastren</code>; del mismo modo, las raíces del tipo <code>*AS-TR</code> admiten derivados con o sin su extensión según la formación léxica.</p>'
          new = '<p><span class="status canon">Canónico</span>Las divisiones internas de raíces como <code>*AS-TR</code> o <code>*OẐ-AN-</code> reflejan una estructura histórica entre una base primigenia y una extensión posterior. La distribución morfológica y registral de ambas formas se documenta en la sección 1.1 de <a href="gramatica.html">gramatica.html</a>.</p>'
          if old in f:
              f = f.replace(old, new, 1)
          elif new not in f:
              raise SystemExit('phonology extension paragraph not found')
          fp.write_text(f, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gramatica.html fonologia.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Documentar forma primigenia y extensión de raíces"
          git push
