name: Sync EBL paradigm
on:
  push:
    paths:
      - '.github/workflows/sync-ebl-paradigm.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize EBL lexical family
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ep = Path('lexico/e.json')
          data = json.loads(ep.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-ebl')
          root['gloss'] = 'ser capaz; posible'
          root['notes'] = [
              'CANÓNICO: eblis es la forma absolutiva impersonal; eblos es la forma absolutiva dinámica.',
              'El segmento ON de eblonas/maleblonir queda atestiguado en esta familia sin canonizar aquí un morfema general independiente.',
              'MEJ en mejeblira queda sin referencia léxica hasta que su estatus se documente explícitamente.'
          ]
          root['words'] = [
              {
                  'id': 'lexeme-eblis',
                  'form': 'eblis',
                  'gloss': 'poder ser, poder ocurrir',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-is-2">-IS</a>',
                  'analysis_text': 'EBL + -IS',
                  'refs': [{'id': 'morph-is-2', 'label': '-IS'}],
                  'tags': [{'class': 'generic', 'label': 'Predicado IS'}]
              },
              {
                  'id': 'lexeme-eblos',
                  'form': 'eblos',
                  'gloss': 'ser capaz, tener capacidad',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-os">-OS</a>',
                  'analysis_text': 'EBL + -OS',
                  'refs': [{'id': 'morph-os', 'label': '-OS'}],
                  'tags': [{'class': 'generic', 'label': 'Predicado OS'}]
              },
              {
                  'id': 'lexeme-eblonas',
                  'form': 'eblonas',
                  'gloss': 'capacitar, habilitar',
                  'analysis_html': 'EBL + ON + <a class="morph-link" href="#morph-as">-AS</a>',
                  'analysis_text': 'EBL + ON + -AS',
                  'refs': [{'id': 'morph-as', 'label': '-AS'}],
                  'tags': [{'class': 'generic', 'label': 'Predicado AS'}]
              },
              {
                  'id': 'lexeme-eblik',
                  'form': 'eblik',
                  'gloss': 'talvez',
                  'analysis_html': 'EBLIS → EBLIK',
                  'analysis_text': 'EBLIS → EBLIK',
                  'refs': [],
                  'tags': []
              },
              {
                  'id': 'lexeme-eblir',
                  'form': 'eblir',
                  'gloss': 'posible',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-ir-reservative">-IR</a>',
                  'analysis_text': 'EBL + -IR',
                  'refs': [{'id': 'morph-ir-reservative', 'label': '-IR'}],
                  'tags': [{'class': 'generic', 'label': 'Adjetivo IR'}]
              },
              {
                  'id': 'lexeme-mejeblira',
                  'form': 'mejeblira',
                  'gloss': 'posibilidad, chanza',
                  'analysis_html': 'MEJ + EBL + <a class="morph-link" href="#morph-ir-reservative">-IR</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
                  'analysis_text': 'MEJ + EBL + -IR + -A',
                  'refs': [
                      {'id': 'morph-ir-reservative', 'label': '-IR'},
                      {'id': 'morph-a-2', 'label': '-A'}
                  ],
                  'tags': [{'class': 'generic', 'label': 'Nomen A'}]
              },
              {
                  'id': 'lexeme-beleblira',
                  'form': 'beleblira',
                  'gloss': 'oportunidad',
                  'analysis_html': '<a class="morph-link" href="#root-bel">BEL</a> + EBL + <a class="morph-link" href="#morph-ir-reservative">-IR</a> + <a class="morph-link" href="#morph-a-2">-A</a>',
                  'analysis_text': 'BEL + EBL + -IR + -A',
                  'refs': [
                      {'id': 'root-bel', 'label': 'BEL'},
                      {'id': 'morph-ir-reservative', 'label': '-IR'},
                      {'id': 'morph-a-2', 'label': '-A'}
                  ],
                  'tags': [{'class': 'generic', 'label': 'Nomen A'}]
              },
              {
                  'id': 'lexeme-eblol',
                  'form': 'eblol',
                  'gloss': 'habil',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-ol-2">-OL</a>',
                  'analysis_text': 'EBL + -OL',
                  'refs': [{'id': 'morph-ol-2', 'label': '-OL'}],
                  'tags': [{'class': 'generic', 'label': 'Adjetivo OL'}]
              },
              {
                  'id': 'lexeme-eblura',
                  'form': 'eblura',
                  'gloss': 'capacidad, habilidad',
                  'analysis_html': 'EBL + <a class="morph-link" href="#morph-ura">-URA</a>',
                  'analysis_text': 'EBL + -URA',
                  'refs': [{'id': 'morph-ura', 'label': '-URA'}],
                  'tags': [{'class': 'generic', 'label': 'Nomen A'}]
              },
              {
                  'id': 'lexeme-maleblonir',
                  'form': 'maleblonir',
                  'gloss': 'discapacitado',
                  'analysis_html': '<a class="morph-link" href="#root-mal">MAL</a> + EBL + ON + <a class="morph-link" href="#morph-ir-reservative">-IR</a>',
                  'analysis_text': 'MAL + EBL + ON + -IR',
                  'refs': [
                      {'id': 'root-mal', 'label': 'MAL'},
                      {'id': 'morph-ir-reservative', 'label': '-IR'}
                  ],
                  'tags': [{'class': 'generic', 'label': 'Adjetivo IR'}]
              }
          ]
          ep.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mp = Path('lexico/morphemes.json')
          mtxt = mp.read_text(encoding='utf-8')
          old = '[función por definir; atestiguado en eblitas y agitas]'
          new = '[función por definir; atestiguado en agitas]'
          if old in mtxt:
              mtxt = mtxt.replace(old, new)
          mp.write_text(mtxt, encoding='utf-8')

          gp = Path('gramatica.html')
          gtxt = gp.read_text(encoding='utf-8')
          old = '<p><span class="status canon">Canónico</span>Ejemplo: <code>ebles</code> «ser capaz, tener capacidad» → <code>ebleẑa</code> «capacidad, habilidad».</p>'
          new = '<p><span class="status canon">Canónico</span>Para <code>*EBL-</code>, <code>eblis</code> expresa «poder ser, poder ocurrir» y <code>eblos</code> «ser capaz, tener capacidad». La cualidad abstracta correspondiente queda como <code>eblura</code> «capacidad, habilidad».</p>'
          if old not in gtxt:
              raise SystemExit('Expected obsolete EBL grammar example not found')
          gp.write_text(gtxt.replace(old, new), encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico/e.json lexico/morphemes.json lexico/index.json gramatica.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sincronizar paradigma canónico de EBL"
          git push
