name: Update LUND extension

on:
  push:
    paths:
      - '.github/workflows/update-lund-extension.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical lexicon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          l_path = Path('lexico/l.json')
          l_data = json.loads(l_path.read_text(encoding='utf-8'))
          lun = next(e for e in l_data['entries'] if e['id'] == 'root-lun')
          lun['gloss'] = 'luna'
          notes = [n for n in lun.get('notes', []) if 'LUND' not in n]
          notes.append('Extensión interna de la raíz: *LUND- = mes.')
          lun['notes'] = notes
          l_path.write_text(json.dumps(l_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          a_path = Path('lexico/a.json')
          a_data = json.loads(a_path.read_text(encoding='utf-8'))
          afru = next(e for e in a_data['entries'] if e['id'] == 'root-afru')
          word = next(w for w in afru['words'] if w['id'] == 'lexeme-afrulunda')
          word['analysis_html'] = 'AFRU + <a class="morph-link" href="#root-lun">LUND</a> + <a class="morph-link" href="#morph-a-2">-A</a>'
          word['analysis_text'] = 'AFRU + LUND + -A'
          word['refs'] = [
              {'id': 'root-lun', 'label': 'LUND'},
              {'id': 'morph-a-2', 'label': '-A'}
          ]
          a_path.write_text(json.dumps(a_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-lund-extension.yml
          git add lexico/l.json lexico/a.json lexico/index.json
          git commit -m "Documentar LUND como extensión interna de LUN"
          git push
