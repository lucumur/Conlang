name: Fix CER gloss

on:
  push:
    paths:
      - '.github/workflows/fix-cer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct ĈER gloss
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')
          old='<code>*ĈER-</code></td><td class="gloss">cuero</td>'
          new='<code>*ĈER-</code></td><td class="gloss">cuerno</td>'
          if old not in s:
              raise SystemExit('No se encontró la entrada exacta *ĈER- = cuero')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Corregir glosa de ĈER a cuerno"
          git push
