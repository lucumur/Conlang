name: Apply KAL semantic fields once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-kal-semantics-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update KAL semantic fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lexico/k.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          root = next(e for e in data['entries'] if e.get('id') == 'root-kal')
          fields = {
              'lexeme-kalsale': ['química', 'sales', 'álcalis'],
              'lexeme-kaljone': ['química', 'elementos', 'metales'],
              'lexeme-kaljur': ['química', 'ácido-base'],
              'lexeme-kalja': ['química', 'ácido-base'],
          }
          for word in root.get('words', []):
              if word.get('id') in fields:
                  word['semantic_fields'] = fields[word['id']]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          git rm .github/workflows/_apply-kal-semantics-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexico/k.json lexico/index.json
          git commit -m 'Añadir campos semánticos de KAL'
          git push
