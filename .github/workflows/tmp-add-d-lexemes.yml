name: Apply canonical D lexemes
on:
  push:
    paths:
      - '.github/workflows/tmp-add-d-lexemes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical lexicon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('lexico/d.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          byid={e['id']:e for e in d['entries']}
          byid['root-delf']['words']=[
            {
              'id':'lexeme-delfen','form':'delfen','gloss':'delfin',
              'analysis_html':'DELF + <a class="morph-link" href="#morph-en">-EN</a>',
              'analysis_text':'DELF + -EN','refs':[{'id':'morph-en','label':'-EN'}],
              'tags':[{'class':'generic','label':'Animal EN'}],
              'semantic_fields':['fauna','animales','zoología'],'notes':[]
            }
          ]
          byid['root-den-tr']['words']=[
            {
              'id':'lexeme-denter','form':'denter','gloss':'interno',
              'analysis_html':'DENTR + <a class="morph-link" href="#morph-er">-ER</a>',
              'analysis_text':'DENTR + -ER','refs':[{'id':'morph-er','label':'-ER'}],
              'tags':[{'class':'generic','label':'Adjetivo ER'}],
              'semantic_fields':['espacio','posición','relaciones'],'notes':[]
            },
            {
              'id':'lexeme-dentreos','form':'dentreos','gloss':'adentrarse, entrar',
              'analysis_html':'DENTR + <a class="morph-link" href="#morph-eos-directional">-EOS</a>',
              'analysis_text':'DENTR + -EOS','refs':[{'id':'morph-eos-directional','label':'-EOS'}],
              'tags':[{'class':'generic','label':'Direccional EOS'}],
              'semantic_fields':['movimiento','dirección','espacio'],'notes':[]
            },
            {
              'id':'lexeme-denveste','form':'denveste','gloss':'ropa interior',
              'analysis_html':'DEN <span class="meta-extra">(forma primigenia de *DEN-TR-)</span> + <a class="morph-link" href="#root-vest">VEST</a> + E',
              'analysis_text':'DEN (forma primigenia de *DEN-TR-) + VEST + E','refs':[{'id':'root-vest','label':'VEST'}],
              'tags':[{'class':'generic','label':'Compuesto'}],
              'semantic_fields':['vestimenta','objetos','cuerpo'],'notes':[]
            },
            {
              'id':'lexeme-dentroja','form':'dentroja','gloss':'entrada, introduccion',
              'analysis_html':'DENTR + OJA <span class="meta-extra">(formación lexicalizada)</span>',
              'analysis_text':'DENTR + OJA (formación lexicalizada)','refs':[],
              'tags':[{'class':'generic','label':'Lexicalizado'}],
              'semantic_fields':['movimiento','acceso','introducción'],'notes':[]
            },
            {
              'id':'lexeme-dentru','form':'dentru','gloss':'adentro',
              'analysis_html':'DENTR + U <span class="meta-extra">(forma adverbial lexicalizada)</span>',
              'analysis_text':'DENTR + U (forma adverbial lexicalizada)','refs':[],
              'tags':[{'class':'generic','label':'Adverbial'}],
              'semantic_fields':['espacio','posición','dirección'],'notes':[]
            }
          ]
          byid['root-difr']['words']=[
            {
              'id':'lexeme-difris','form':'difris','gloss':'diferir, ser diferente',
              'analysis_html':'DIFR + <a class="morph-link" href="#morph-is-2">-IS</a>',
              'analysis_text':'DIFR + -IS','refs':[{'id':'morph-is-2','label':'-IS'}],
              'tags':[{'class':'generic','label':'Predicado IS'}],
              'semantic_fields':['diferencia','comparación','estado'],'notes':[]
            },
            {
              'id':'lexeme-difras','form':'difras','gloss':'diferenciar, distinguir',
              'analysis_html':'DIFR + <a class="morph-link" href="#morph-as">-AS</a>',
              'analysis_text':'DIFR + -AS','refs':[{'id':'morph-as','label':'-AS'}],
              'tags':[{'class':'generic','label':'Predicado AS'}],
              'semantic_fields':['diferencia','comparación','acciones'],'notes':[]
            },
            {
              'id':'lexeme-difror','form':'difror','gloss':'diferente, distinto',
              'analysis_html':'DIFR + <a class="morph-link" href="#morph-or">-OR</a>',
              'analysis_text':'DIFR + -OR','refs':[{'id':'morph-or','label':'-OR'}],
              'tags':[{'class':'generic','label':'Adjetivo OR'}],
              'semantic_fields':['diferencia','comparación','cualidades'],'notes':[]
            },
            {
              'id':'lexeme-difrabulco','form':'difrabulĉo','gloss':'signo de dieresis',
              'analysis_html':'DIFR + ABULĈO <span class="meta-extra">(formación lexicalizada)</span>',
              'analysis_text':'DIFR + ABULĈO (formación lexicalizada)','refs':[],
              'tags':[{'class':'generic','label':'Lexicalizado'}],
              'semantic_fields':['escritura','ortografía','signos'],'notes':[]
            }
          ]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/build_lexicon_index.py
          rm .github/workflows/tmp-add-d-lexemes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexico/d.json lexico/index.json .github/workflows/tmp-add-d-lexemes.yml
          git commit -m 'lexicon: add canonical DELF DEN-TR DIFR forms'
          git push
