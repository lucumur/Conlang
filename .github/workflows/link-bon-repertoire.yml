name: Link BON repertoire

on:
  push:
    paths:
      - '.github/workflows/link-bon-repertoire.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update BON reciprocal links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('lexico.html')
          s=p.read_text(encoding='utf-8')

          # Stable root anchors.
          s=s.replace('<code>*AG-</code></td><td class="gloss">\n<span class="root-gloss">comportarse</span>', '<code id="root-ag">*AG-</code></td><td class="gloss">\n<span class="root-gloss">comportarse</span>', 1)

          # BON root: add anchor and a visible repertoire containing bonagaj.
          pat=re.compile(r'(<tr><td class="form"><code>)(\*BON-)(</code></td><td class="gloss">)(bueno)(</td><td class="tags">)', re.S)
          m=pat.search(s)
          if not m:
              raise SystemExit('No se encontró *BON- = bueno')
          block='<details class="suffix-repertoire root-repertoire-static"><summary>Repertorio (1)</summary><div class="suffix-word-list"><a class="word-link" href="#lexeme-bonagaj">bonagaj</a></div></details>'
          repl=m.group(1)+'<code id="root-bon">*BON-</code>' if False else None
          s=pat.sub(lambda x: '<tr><td class="form"><code id="root-bon">*BON-</code></td><td class="gloss">bueno'+block+x.group(5), s, count=1)

          # Link both roots in bonagaj's morphological analysis.
          old='BON + AG + <a class="morph-link" href="#morph-aj">-AJ</a>'
          new='<a class="morph-link" href="#root-bon">BON</a> + <a class="morph-link" href="#root-ag">AG</a> + <a class="morph-link" href="#morph-aj">-AJ</a>'
          if old not in s:
              raise SystemExit('No se encontró el análisis de bonagaj')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Enlazar BON con bonagaj"
          git push
