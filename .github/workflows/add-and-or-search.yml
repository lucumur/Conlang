name: Add AND OR lexicon search

on:
  push:
    paths:
      - '.github/workflows/add-and-or-search.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add boolean search to lexicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lexico.html')
          s = p.read_text(encoding='utf-8')

          old_placeholder = 'placeholder="Escribe una raíz, glosa o etiqueta…"'
          new_placeholder = 'placeholder="Ej.: griego AND animal · griego OR latin"'
          if old_placeholder in s:
              s = s.replace(old_placeholder, new_placeholder, 1)

          old_box = '''    <div class="lex-search-row">
      <input id="lex-search" type="search" autocomplete="off" spellcheck="false" placeholder="Ej.: griego AND animal · griego OR latin">
      <span id="lex-search-count" aria-live="polite"></span>
    </div>
  </div>'''
          new_box = '''    <div class="lex-search-row">
      <input id="lex-search" type="search" autocomplete="off" spellcheck="false" placeholder="Ej.: griego AND animal · griego OR latin">
      <span id="lex-search-count" aria-live="polite"></span>
    </div>
    <div class="lex-search-help">Usa <strong>AND</strong> para exigir ambos términos y <strong>OR</strong> para aceptar cualquiera. AND tiene prioridad sobre OR.</div>
  </div>'''
          if old_box not in s:
              raise SystemExit('No se encontró la caja de búsqueda esperada')
          s = s.replace(old_box, new_box, 1)

          css_anchor = '#lex-search-count{color:var(--muted);font-size:.86rem;white-space:nowrap}'
          css_new = css_anchor + '.lex-search-help{margin-top:7px;color:var(--muted);font-size:.82rem}'
          if css_anchor not in s:
              raise SystemExit('No se encontró el CSS del contador')
          s = s.replace(css_anchor, css_new, 1)

          pattern = re.compile(r'<script>\s*\(function\(\)\{const input=document\.getElementById\("lex-search"\).*?\}\)\(\);\s*</script>', re.S)
          new_script = '''<script>
(function(){
  const input=document.getElementById("lex-search"),count=document.getElementById("lex-search-count");
  if(!input)return;
  const sections=[...document.querySelectorAll(".lex-section")],rows=[...document.querySelectorAll(".lex-table tbody tr")];
  const norm=s=>s.toLocaleLowerCase("es").trim();

  function parseQuery(raw){
    const q=norm(raw);
    if(!q)return [];
    return q.split(/\s+or\s+/i)
      .map(group=>group.split(/\s+and\s+/i).map(term=>norm(term)).filter(Boolean))
      .filter(group=>group.length);
  }

  function rowMatches(text,groups){
    if(!groups.length)return true;
    return groups.some(group=>group.every(term=>text.includes(term)));
  }

  function filterLexicon(){
    const groups=parseQuery(input.value);
    let shown=0;
    rows.forEach(row=>{
      const match=rowMatches(norm(row.textContent),groups);
      row.hidden=!match;
      if(match)shown++;
    });
    sections.forEach(section=>{
      const visible=section.querySelectorAll("tbody tr:not([hidden])").length>0;
      section.hidden=!visible;
    });
    count.textContent=input.value.trim()?(shown+" resultado"+(shown===1?"":"s")):(rows.length+" entradas");
  }

  input.addEventListener("input",filterLexicon);
  filterLexicon();
})();
</script>'''
          s2, n = pattern.subn(new_script, s, count=1)
          if n != 1:
              raise SystemExit(f'No se pudo reemplazar el script de búsqueda: {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit boolean search
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexico.html
          git commit -m "Añadir búsqueda AND OR al léxico"
          git push
