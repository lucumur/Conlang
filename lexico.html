<script>
const origin=new Set(['Nat-plen','Nat-mod','Nova','Latin','Frances','Español','Portugues','Italico','Germanico','Anglo','Griego','Slavo','Celta','Arabe','Baltico','Persa','Sinico','Indico']);
const cls=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ñ/g,'n');
async function loadLexicon(){
  const b64=document.getElementById('lex-gzip').textContent.trim();
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text=await new Response(stream).text();
  renderLexicon(text);
}
function renderLexicon(text){
  const src=text.split(/\r?\n/);
  const host=document.getElementById('lexicon');
  const alpha=document.getElementById('alphabet');
  host.textContent=''; alpha.textContent='';
  let tbody=null,lastGloss=null;
  for(const raw of src){
    const line=raw.trimEnd(),t=line.trim();
    if(!t) continue;
    if(/^\[[^\]]+\]$/.test(t)){
      const name=t.slice(1,-1),id='sec-'+cls(name);
      const a=document.createElement('a');a.href='#'+id;a.textContent=name;alpha.appendChild(a);
      const sec=document.createElement('section');sec.className='lex-section';sec.id=id;
      sec.innerHTML=`<h2>${name}</h2><div class="table-wrap"><table class="lex-table"><thead><tr><th>Forma</th><th>Glosa</th><th>Etiquetas</th></tr></thead><tbody></tbody></table></div>`;
      host.appendChild(sec);tbody=sec.querySelector('tbody');lastGloss=null;continue;
    }
    if(t.startsWith('Nota visible:')||t.startsWith('Nota:')){
      if(lastGloss){const d=document.createElement('div');d.className='entry-note';d.textContent=t.replace(/^Nota(?: visible)?:\s*/,'');lastGloss.appendChild(d)}
      continue;
    }
    if(!tbody||!line.includes('|')) continue;
    const pos=line.indexOf('|'),left=line.slice(0,pos).trim(),right=line.slice(pos+1).trim();
    let form=left,gloss='';
    if(left.includes('=')){const eq=left.indexOf('=');form=left.slice(0,eq).trim();gloss=left.slice(eq+1).trim()}
    const tr=document.createElement('tr'),td1=document.createElement('td'),td2=document.createElement('td'),td3=document.createElement('td');
    td1.className='form';td2.className='gloss';td3.className='tags';
    const code=document.createElement('code');code.textContent=form;td1.appendChild(code);td2.textContent=gloss;lastGloss=td2;
    for(const tok of right.split(/\s+/)){
      if(tok.startsWith('#')){const n=tok.slice(1),sp=document.createElement('span');sp.className='tag '+(origin.has(n)?cls(n):'generic');sp.textContent=n;td3.appendChild(sp)}
      else if(tok){const sp=document.createElement('span');sp.className='meta-extra';sp.textContent=' '+tok;td3.appendChild(sp)}
    }
    tr.append(td1,td2,td3);tbody.appendChild(tr);
  }
}
loadLexicon().catch(err=>{document.getElementById('lexicon').innerHTML='<p>No se pudo cargar el léxico.</p>';console.error(err)});
</script>
